name: Release gate

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "assets/**"
      - "**/*.md"
      - "**/*.mdx"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "assets/**"
      - "**/*.md"
      - "**/*.mdx"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  packed-artifact:
    name: packed artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run release:gate -- --out "${{ runner.temp }}/release-gate"
      - run: npm run test:startup:packaged -- --skip-build --out "${{ runner.temp }}/startup-gate"
      - name: Test packaged vector recovery
        shell: bash
        run: |
          pack_dir="$(mktemp -d "${{ runner.temp }}/vector-recovery-pack.XXXXXX")"
          npm pack --pack-destination "$pack_dir"
          tarballs=("$pack_dir"/agentmemory-agentmemory-*.tgz)
          test "${#tarballs[@]}" -eq 1
          test -f "${tarballs[0]}"
          npm run test:vector-recovery:packaged -- \
            --tarball "${tarballs[0]}" \
            --dependencies "$GITHUB_WORKSPACE/node_modules" \
            --out "${{ runner.temp }}/vector-recovery-gate"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/release-gate
            ${{ runner.temp }}/startup-gate
            ${{ runner.temp }}/vector-recovery-gate
          if-no-files-found: ignore
          retention-days: 14
