name: CI

# `paths-ignore` keeps doc-only / website / README / CHANGELOG churn from
# burning runner minutes. Source / config / workflow changes always run.
# `workflow_dispatch` gives a manual re-run button for flake debugging.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "ROADMAP.md"
      - "website/**"
      - "docs/**"
      - "assets/**"
      - "deploy/**/README.md"
      - "**/*.md"
      - "**/*.mdx"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "ROADMAP.md"
      - "website/**"
      - "docs/**"
      - "assets/**"
      - "deploy/**/README.md"
      - "**/*.md"
      - "**/*.mdx"
  workflow_dispatch:

# Cancel in-flight PR runs when a force-push lands. Keep push runs to
# protect against partial state on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't bail the whole matrix on one cell's failure — we want to
      # see whether the same failure reproduces across OSes (e.g.
      # whether a flake is platform-specific or universal).
      fail-fast: false
      matrix:
        # Windows is covered again after the path-sensitive test fixtures
        # were normalized with node:path and Windows binary naming.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      # The repository intentionally does not commit package-lock.json.
      # Generating an ephemeral lockfile and immediately running npm ci is
      # unreliable with platform-specific optional dependencies, so CI uses
      # one clean resolver/install pass instead.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build TypeScript package
        run: npm run build
      - name: Check generated skills
        run: npm run skills:check
      - name: Run test suite
        run: npm test
