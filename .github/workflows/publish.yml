name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to publish: agentmemory,mcp; add fs-watcher only for its independent release"
        required: false
        default: "agentmemory,mcp"

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: npm run skills:check
      - run: npm run docs:check
      - run: npm test

      - name: Pack once and test the release artifacts
        run: npm run release:prepare -- --out "$RELEASE_OUT" --packages "$RELEASE_PACKAGES"
        env:
          RELEASE_OUT: ${{ runner.temp }}/npm-release
          RELEASE_PACKAGES: ${{ github.event_name == 'release' && 'agentmemory,mcp' || inputs.packages }}

      - name: Publish gated artifacts and verify registry provenance
        run: npm run release:publish -- --manifest "$RELEASE_OUT/manifest.json"
        env:
          RELEASE_OUT: ${{ runner.temp }}/npm-release
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release
          if-no-files-found: ignore
          retention-days: 14
