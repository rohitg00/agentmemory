name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build, without the leading v (for example 0.9.32)"
        required: true
        type: string
      latest:
        description: "Also tag the image as latest"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  IMAGE: ghumarerohit/agentmemory

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          if [ "$EVENT" = "release" ]; then
            tag="$RELEASE_TAG"
            version="${tag#v}"
            if [ "$PRERELEASE" = "true" ]; then latest=false; else latest=true; fi
          else
            version="${INPUT_VERSION#v}"
            tag="v${version}"
            latest="$INPUT_LATEST"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Not a release version: $version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.v.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ steps.v.outputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: agentmemory-smoke:${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,scope=docker-image,mode=max

      - name: Smoke test
        env:
          SMOKE_IMAGE: agentmemory-smoke:${{ steps.v.outputs.version }}
        run: |
          docker run -d --name am-smoke -p 127.0.0.1:3111:3111 "$SMOKE_IMAGE"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3111/agentmemory/livez >/dev/null; then
              echo "livez ok after $((i * 2)) s"
              docker rm -f am-smoke >/dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' am-smoke)" != "true" ]; then
              echo "container exited" >&2
              break
            fi
            sleep 2
          done
          docker logs am-smoke >&2 || true
          docker rm -f am-smoke >/dev/null || true
          exit 1

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,scope=docker-image,mode=max
