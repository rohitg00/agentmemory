services:
  - type: web
    name: agentmemory
    runtime: image
    plan: starter
    image:
      url: ghcr.io/rohitg00/agentmemory:latest
    healthCheckPath: /agentmemory/livez
    autoDeploy: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "3111"
