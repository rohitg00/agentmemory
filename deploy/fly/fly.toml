# Deploy from the repository root: fly deploy --config deploy/fly/fly.toml
app = "agentmemory"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[[mounts]]
  source = "agentmemory_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3111
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/agentmemory/livez"

# Publish the viewer separately; it requires bearer auth and a Host allowlist.
[[services]]
  protocol = "tcp"
  internal_port = 3113
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/"
    [services.http_checks.headers]
      Host = "localhost:3113"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
