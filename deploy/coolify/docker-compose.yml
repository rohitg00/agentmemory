services:
  init:
    # chown the named volume to uid 1000 so the (non-root) agentmemory
    # container can write /data.
    image: busybox:1.36
    user: "0:0"
    volumes:
      - agentmemory-data:/data
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /data && chmod 755 /data"]
    restart: "no"

  agentmemory:
    # Pin to a semver tag for reproducible deploys; bump deliberately.
    image: ghcr.io/rohitg00/agentmemory:0.9.12
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_AGENTMEMORY_3111
    expose:
      - "3111"
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentmemory-data:
