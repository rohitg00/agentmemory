<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agentmemory viewer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Removed Google Fonts <link> in #323: the viewer CSP is strict
       (default-src 'none', style-src 'unsafe-inline', font-src 'self')
       and external stylesheets from fonts.googleapis.com were blocked,
       producing console CSP violations that some browsers (Windows
       Edge in particular) escalate into broader script-execution
       issues. System-font fallbacks are already declared on every
       --font-* CSS variable below, so the viewer renders fine with
       Georgia / system serif / system sans / system mono. -->
  <style>
    :root {
      --bg: #F9F9F7;
      --bg-alt: #F0F0EC;
      --bg-subtle: #F4F4F0;
      --bg-inset: #E8E8E3;
      --border: #111111;
      --border-light: #D4D4CF;
      --border-heavy: #111111;
      --ink: #111111;
      --ink-secondary: #333333;
      --ink-muted: #666666;
      --ink-faint: #999999;
      --accent: #CC0000;
      --accent-light: #FF1A1A;
      --cream: #F5F0E8;
      --node-file: #2D6A4F;
      --node-function: #1D4E89;
      --node-concept: #B8860B;
      --node-error: #CC0000;
      --node-decision: #6B3FA0;
      --node-pattern: #2563EB;
      --node-library: #C2410C;
      --node-person: #111111;
      --green: #2D6A4F;
      --blue: #1D4E89;
      --yellow: #B8860B;
      --red: #CC0000;
      --purple: #6B3FA0;
      --orange: #C2410C;
      --cyan: #0E7490;
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-body: 'Lora', Georgia, serif;
      --font-ui: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    }
    html[data-theme="dark"] {
      --bg: #121316;
      --bg-alt: #1a1c20;
      --bg-subtle: #17181b;
      --bg-inset: #222428;
      --border: #33363b;
      --border-light: #26282c;
      --border-heavy: #c9cbd1;
      --ink: #eef0f3;
      --ink-secondary: #c6c9ce;
      --ink-muted: #94979d;
      --ink-faint: #6d7076;
      --accent: #f2555a;
      --accent-light: #ff7a70;
      --cream: #2a2520;
      --green: #5cc08f;
      --blue: #7fa9e3;
      --yellow: #dcae45;
      --red: #f2555a;
      --purple: #ae92dc;
      --orange: #e8905a;
      --cyan: #4ec0d2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #bg-dither {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }
    .app-header, .tab-bar, .views, .view, .flags-panel, .offline-banner, footer, .app-footer { position: relative; z-index: 1; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink-secondary);
      line-height: 1.6;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); }

    .app-header {
      padding: 10px 24px 0;
      border-bottom: 4px solid var(--border-heavy);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      flex: 0 0 auto;
      position: relative;
      z-index: 3;
    }
    .app-header > .tab-bar { flex: 1 1 100%; order: 10; margin: 8px -24px 0; border-bottom: none; border-top: 1px solid var(--border-light); }
    @media (max-width: 720px) {
      .app-header { padding-bottom: 8px; }
      .app-header > .tab-bar { margin: 0; border-top: none; }
    }
    .app-header .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .app-header .brand:hover h1,
    .app-header .brand:focus-visible h1 { color: var(--accent); }
    .app-header .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .app-header .brand h1 {
      font-size: 22px;
      color: var(--ink);
      font-weight: 900;
      font-family: var(--font-display);
      letter-spacing: -0.02em;
      text-transform: lowercase;
    }
    .app-header .brand .version {
      font-size: 10px;
      color: var(--ink-faint);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    @media (max-width: 720px) {
      .app-header { flex-wrap: wrap; row-gap: 6px; padding: 8px 16px; }
      .app-header .dateline { display: none; }
    }
    .ws-status {
      font-size: 10px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      border: 1px solid var(--border-light);
    }
    .ws-status::before {
      content: '';
      width: 6px;
      height: 6px;
      display: inline-block;
    }
    .ws-status.connected { border-color: var(--green); color: var(--green); }
    .ws-status.connected::before { background: var(--green); animation: live-pulse 2.4s ease-in-out infinite; }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .ws-status.disconnected, .ws-status.connecting { border-color: var(--ink-faint); color: var(--ink-faint); }
    .ws-status.disconnected::before, .ws-status.connecting::before { background: var(--ink-faint); }
    .ws-status.reconnecting { border-color: var(--yellow); color: var(--yellow); }
    .ws-status.reconnecting::before { background: var(--yellow); }
    .ws-status.offline { border-color: var(--accent); color: var(--accent); }
    .ws-status.offline::before { background: var(--accent); }
    .ws-status.stale-health { border-color: var(--yellow); color: var(--yellow); }
    .ws-status.stale-health::before { background: var(--yellow); }

    .tab-bar {
      display: flex;
      align-items: stretch;
      height: 44px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg);
      overflow-x: auto;
      flex: 0 0 auto;
      position: relative;
      z-index: 2;
      padding: 0 12px;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-group { display: flex; align-items: stretch; border-left: 1px solid var(--border-light); padding-left: 6px; margin-left: 6px; }
    .tab-group-label {
      align-self: center;
      font-family: var(--font-ui);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      padding: 0 6px 0 4px;
      white-space: nowrap;
    }
    .tab-bar button {
      background: none;
      border: none;
      color: var(--ink-muted);
      padding: 8px 12px;
      font-size: 11px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-bar button:hover { color: var(--ink); }
    .tab-bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
    .tab-bar button.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }
    .tab-bar button .tab-count {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0;
      color: var(--ink-faint);
      margin-left: 5px;
      font-weight: 500;
    }
    .nav-toggle { display: none; }
    @media (max-width: 720px) {
      .nav-toggle { display: inline-flex; align-items: center; gap: 6px; order: 3; flex: 1 1 100%; justify-content: space-between; }
      .tab-bar {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        height: auto;
        max-height: 70vh;
        overflow-y: auto;
        flex-direction: column;
        padding: 6px 12px 12px;
        border-bottom: 2px solid var(--border);
        box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        z-index: 20;
      }
      .tab-bar.open { display: flex; }
      .tab-group { flex-direction: column; border-left: none; margin-left: 0; padding-left: 0; border-top: 1px solid var(--border-light); padding-top: 4px; margin-top: 4px; }
      .tab-group-label { align-self: flex-start; padding: 6px 12px 2px; }
      .tab-bar button { text-align: left; border-bottom: none; border-left: 2px solid transparent; padding: 9px 12px; }
      .tab-bar button.active { border-left-color: var(--accent); background: var(--bg-alt); }
      .app-shell-nav { position: relative; }
    }

    .views { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .view { display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 24px; }
    .view.active { display: block; animation: view-in 160ms ease-out; }
    #view-graph.active { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
    body.is-stale .view { filter: saturate(0.6); }
    @keyframes view-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .view.active { animation: none; }
      .ws-status.connected::before { animation: none; }
    }

    .layer-row { padding: 12px 0; border-bottom: 1px solid var(--border-light); }
    .layer-row:last-child { border-bottom: none; }
    .layer-head { display: flex; align-items: baseline; gap: 10px; }
    .layer-name { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink); }
    .layer-count { font-family: var(--font-mono); font-size: 13px; color: var(--ink); margin-left: auto; }
    .layer-from { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
    .layer-detail { font-size: 12px; color: var(--ink-faint); margin-top: 4px; line-height: 1.5; }
    .layer-preview { margin: 6px 0 0; padding-left: 16px; font-size: 12px; color: var(--ink-muted); }
    .layer-preview li { margin-bottom: 2px; }
    .verdict { display: flex; gap: 14px; align-items: flex-start; }
    .verdict-badge { font-family: var(--font-ui); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 10px; border: 2px solid currentColor; flex-shrink: 0; }
    .verdict-badge.ok { color: var(--green); } .verdict-badge.info { color: var(--blue); } .verdict-badge.warn { color: var(--yellow); } .verdict-badge.error { color: var(--accent); } .verdict-badge.unknown { color: var(--ink-faint); }
    .verdict-text { font-family: var(--font-display); font-size: 17px; line-height: 1.4; color: var(--ink); }
    .verdict-meta { font-family: var(--font-ui); font-size: 11px; color: var(--ink-faint); margin-top: 4px; }
    .hstale { font-family: var(--font-ui); font-size: 12px; color: var(--ink); padding: 8px 12px; border-left: 3px solid var(--yellow); background: var(--bg-subtle); margin: 12px 0 0; line-height: 1.5; }
    .hstale.offline { border-left-color: var(--accent); }
    .problem { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
    .problem:last-child { border-bottom: none; }
    .problem .pm { font-size: 13px; color: var(--ink); line-height: 1.5; }
    .problem .pf { font-family: var(--font-ui); font-size: 12px; color: var(--ink-muted); margin-top: 3px; line-height: 1.5; }
    .problem .pf::before { content: 'Fix: '; font-weight: 700; color: var(--ink-secondary); }
    .hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
    .hgrid .card { margin: 0; min-width: 0; }
    .hnote { font-family: var(--font-ui); font-size: 11px; color: var(--ink-faint); line-height: 1.5; margin-top: 2px; }
    .hbar { height: 6px; background: var(--bg-inset); margin-top: 5px; position: relative; max-width: 260px; }
    .hbar > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); }
    .hbar.warn > span { background: var(--yellow); } .hbar.bad > span { background: var(--accent); }
    .flag-row { padding: 9px 0; border-bottom: 1px solid var(--bg-inset); }
    .flag-row:last-child { border-bottom: none; }
    .flag-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
    .flag-head code, .env-chip { font-family: var(--font-mono); font-size: 11px; color: var(--ink-secondary); background: var(--bg-inset); padding: 1px 5px; }
    .flag-how { font-family: var(--font-ui); font-size: 12px; color: var(--ink-muted); margin-top: 3px; line-height: 1.5; }
    .cflow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 12px 0 4px; border: 1px solid var(--border-light); }
    .cstep { padding: 10px 12px; border-right: 1px solid var(--border-light); position: relative; min-width: 0; }
    .cstep:last-child { border-right: none; }
    .cstep-n { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
    .cstep-t { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink); margin: 2px 0 4px; }
    .cstep-d { font-family: var(--font-ui); font-size: 11px; color: var(--ink-muted); line-height: 1.5; }
    .cstep-c { font-family: var(--font-mono); font-size: 12px; color: var(--ink); margin-top: 6px; }
    .ccols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 14px; }
    .ccols h4 { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }
    .ckv { display: flex; gap: 10px; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--bg-inset); font-family: var(--font-ui); }
    .ckv > span:first-child { color: var(--ink-muted); width: 150px; flex-shrink: 0; }
    .ckv > span:last-child { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
    @media (max-width: 900px) {
      .hgrid, .ccols { grid-template-columns: 1fr; }
      .cflow { grid-template-columns: 1fr; }
      .cstep { border-right: none; border-bottom: 1px solid var(--border-light); }
      .cstep:last-child { border-bottom: none; }
      .verdict { flex-direction: column; gap: 8px; }
      .ckv > span:first-child { width: 120px; }
    }
    .stats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      background: var(--border-light);
    }
    .stat-card {
      background: var(--bg);
      padding: 12px 16px;
      flex: 1 1 150px;
      min-width: 0;
    }
    .stat-card .label .help { margin-left: 4px; }
    .stat-card[data-action] {
      cursor: pointer;
      transition: background 0.15s ease-out;
    }
    .stat-card[data-action]:hover { background: var(--bg-alt); }
    .stat-card[data-action]:hover .label { color: var(--accent); }
    .stat-card[data-action]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .stat-card[data-action]:active { background: var(--bg-inset); }
    .stat-card .label {
      font-size: 9px;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 4px;
      font-family: var(--font-ui);
      font-weight: 600;
    }
    .stat-card .value {
      font-size: 32px;
      font-weight: 900;
      color: var(--ink);
      font-family: var(--font-display);
      line-height: 1.1;
    }
    .stat-card .sub {
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 2px;
      font-family: var(--font-ui);
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 20px;
      margin-bottom: 16px;
      transition: box-shadow 0.15s;
    }
    .card:hover {
      box-shadow: 4px 4px 0px 0px var(--border);
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
    }

    .health-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .health-dot {
      width: 10px;
      height: 10px;
    }
    .health-dot.healthy { background: var(--green); }
    .health-dot.degraded { background: var(--yellow); }
    .health-dot.critical { background: var(--accent); }

    .badge {
      display: inline-block;
      font-size: 9px;
      padding: 2px 8px;
      font-weight: 600;
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid;
    }
    .badge-blue { border-color: var(--blue); color: var(--blue); background: transparent; }
    .badge-green { border-color: var(--green); color: var(--green); background: transparent; }
    .badge-yellow { border-color: var(--yellow); color: var(--yellow); background: transparent; }
    .badge-red { border-color: var(--accent); color: var(--accent); background: transparent; }
    .badge-purple { border-color: var(--purple); color: var(--purple); background: transparent; }
    .badge-orange { border-color: var(--orange); color: var(--orange); background: transparent; }
    .badge-cyan { border-color: var(--cyan); color: var(--cyan); background: transparent; }
    .badge-muted { border-color: var(--border-light); color: var(--ink-muted); background: transparent; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-family: var(--font-body);
      font-variant-numeric: tabular-nums;
    }
    th {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 2px solid var(--border);
      color: var(--ink);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      font-family: var(--font-ui);
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }
    tr:hover td { background: var(--bg-alt); }

    .strength-bar {
      width: 60px;
      height: 4px;
      background: var(--bg-inset);
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
    }
    .strength-bar .fill {
      height: 100%;
      transition: width 0.3s;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar input, .toolbar select, .search-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 7px 12px;
      font-size: 13px;
      outline: none;
      font-family: var(--font-ui);
    }
    .toolbar input:focus, .toolbar select:focus, .search-input:focus {
      border-color: var(--ink);
      box-shadow: 2px 2px 0px 0px var(--border);
    }
    .toolbar input { flex: 1; min-width: 200px; }

    .btn, .toolbar button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 7px 16px;
      font-size: 11px;
      cursor: pointer;
      transition: box-shadow 0.1s, transform 0.1s;
      font-family: var(--font-ui);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .btn:hover, .toolbar button:hover { box-shadow: 3px 3px 0px 0px var(--border); transform: translate(-1px, -1px); }
    .btn:active, .toolbar button:active { box-shadow: none; transform: translate(0, 0); }
    .btn-danger { border-color: var(--accent); color: var(--accent); }
    .btn-danger:hover { background: var(--accent); color: white; box-shadow: 3px 3px 0px 0px var(--border); }
    .btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .btn-primary:hover { background: var(--ink-secondary); box-shadow: 3px 3px 0px 0px var(--ink-muted); }

    .graph-page { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; height: 100%; }
    .graph-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border-light); background: var(--bg); position: relative; z-index: 6; }
    .graph-search-wrap { position: relative; flex: 1 1 260px; max-width: 420px; min-width: 0; }
    .graph-search { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--border); padding: 7px 10px; font-size: 13px; font-family: var(--font-ui); outline: none; }
    .graph-search:focus { box-shadow: 2px 2px 0 0 var(--border); }
    .graph-search-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--bg); border: 1px solid var(--border); box-shadow: 4px 4px 0 0 var(--border-light); z-index: 20; max-height: 320px; overflow-y: auto; }
    .gs-hit { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: none; border-bottom: 1px solid var(--border-light); background: none; color: var(--ink); font-family: var(--font-ui); font-size: 12px; text-align: left; cursor: pointer; }

      var pts = function(list) { return list.map(function(p) { return (c + p[0] * r).toFixed(2) + ',' + (c + p[1] * r).toFixed(2); }).join(' '); };
      var poly = function(n, start, scale) { var out = []; for (var i = 0; i < n; i++) { var a = start + (Math.PI * 2 / n) * i; out.push([Math.cos(a) * scale, Math.sin(a) * scale]); } return out; };
      switch (shape) {
        case 'square': case 'squareRing': path = '<rect x="' + (c - r * 0.86) + '" y="' + (c - r * 0.86) + '" width="' + (r * 1.72) + '" height="' + (r * 1.72) + '"'; break;
        case 'diamond': case 'diamondRing': path = '<polygon points="' + pts([[0, -1.15], [1.15, 0], [0, 1.15], [-1.15, 0]]) + '"'; break;
        case 'triangle': path = '<polygon points="' + pts([[0, -1.15], [1.1, 0.8], [-1.1, 0.8]]) + '"'; break;
        case 'triangleDown': path = '<polygon points="' + pts([[0, 1.15], [1.1, -0.8], [-1.1, -0.8]]) + '"'; break;
        case 'hexagon': path = '<polygon points="' + pts(poly(6, 0, 1.05)) + '"'; break;
        case 'pentagon': path = '<polygon points="' + pts(poly(5, -Math.PI / 2, 1.1)) + '"'; break;
        case 'star': var st = []; for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + (Math.PI / 5) * i; var rr = i % 2 ? 0.55 : 1.25; st.push([Math.cos(a) * rr, Math.sin(a) * rr]); } path = '<polygon points="' + pts(st) + '"'; break;
        case 'plus': path = '<polygon points="' + pts([[-0.42, -1.1], [0.42, -1.1], [0.42, -0.42], [1.1, -0.42], [1.1, 0.42], [0.42, 0.42], [0.42, 1.1], [-0.42, 1.1], [-0.42, 0.42], [-1.1, 0.42], [-1.1, -0.42], [-0.42, -0.42]]) + '"'; break;
        case 'cross': path = '<polygon transform="rotate(45 ' + c + ' ' + c + ')" points="' + pts([[-0.42, -1.1], [0.42, -1.1], [0.42, -0.42], [1.1, -0.42], [1.1, 0.42], [0.42, 0.42], [0.42, 1.1], [-0.42, 1.1], [-0.42, 0.42], [-1.1, 0.42], [-1.1, -0.42], [-0.42, -0.42]]) + '"'; break;
        default: path = '<circle cx="' + c + '" cy="' + c + '" r="' + r + '"';
      }
      var hollow = graphShapeHollow(shape);
      var fill = hollow ? 'none' : color;
      return '<svg class="g-shape" width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" aria-hidden="true">' + path + ' fill="' + fill + '" stroke="' + color + '" stroke-width="' + (hollow ? 2 : 1) + '"/></svg>';
    }
    function edgeSvg(type) {
      var dash = edgeDash(type);
      return '<svg class="g-edge" width="28" height="10" viewBox="0 0 28 10" aria-hidden="true"><line x1="1" y1="5" x2="22" y2="5" stroke="currentColor" stroke-width="1.6"' + (dash.length ? ' stroke-dasharray="' + dash.join(' ') + '"' : '') + '/><polygon points="21,1.5 27,5 21,8.5" fill="currentColor"/></svg>';
    }

    function drawGraph() {
      var ctx = graphSim.ctx;
      var canvas = graphSim.canvas;
      if (!ctx || !canvas || !graphSim.w) return;
      var g = state.graph;
      var dpr = graphSim.dpr;
      var dark = isDarkMode();
      var ink = dark ? '#eef0f3' : '#111111';
      var muted = dark ? '#94979d' : '#5c5f66';
      var bg = getComputedStyle(canvas.parentElement).backgroundColor || (dark ? '#16171a' : '#fbfaf7');
      var edgeBase = dark ? 'rgba(200,204,212,' : 'rgba(40,44,52,';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, graphSim.w, graphSim.h);

      var byId = graphSim.byId;
      var selected = g.selectedId;
      var focus = selected || graphSim.hoverId;
      var neighbors = {};
      if (focus) {
        graphSim.edges.forEach(function(e) {
          if (e.sourceNodeId === focus) neighbors[e.targetNodeId] = true;
          if (e.targetNodeId === focus) neighbors[e.sourceNodeId] = true;
        });
      }
      var matches = {};
      var searching = g.search.trim().length > 0;
      if (searching) graphSearchMatches(500).forEach(function(n) { matches[n.id] = true; });
      function dimmed(id) {
        if (searching && !matches[id]) return true;
        if (focus && id !== focus && !neighbors[id]) return true;
        return false;
      }

      var box = graphSim.isolatedBox;
      if (box) {
        var bx = box.x * graphSim.zoom + graphSim.panX, by = box.y * graphSim.zoom + graphSim.panY;
        var bw = box.w * graphSim.zoom, bh = box.h * graphSim.zoom;
        ctx.save();
        ctx.strokeStyle = dark ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.14)';
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1;
        ctx.strokeRect(Math.round(bx) + 0.5, Math.round(by) + 0.5, Math.round(bw), Math.round(bh));
        ctx.setLineDash([]);
        ctx.font = '600 10px Inter, system-ui, sans-serif';
        ctx.fillStyle = muted;
        ctx.textBaseline = 'bottom';
        ctx.fillText('NO RELATIONS YET · ' + box.count, Math.round(bx), Math.round(by) - 4);
        ctx.restore();
      }

      var placed = [];
      function free(r) {
        if (r.x < 2 || r.y < 2 || r.x + r.w > graphSim.w - 2 || r.y + r.h > graphSim.h - 2) return false;
        for (var i = 0; i < placed.length; i++) {
          var p = placed[i];
          if (r.x < p.x + p.w && r.x + r.w > p.x && r.y < p.y + p.h && r.y + r.h > p.y) return false;
        }
        return true;
      }

      var visibleEdges = graphSim.edges.filter(function(e) {
        var s = byId[e.sourceNodeId], t = byId[e.targetNodeId];
        return s && t && graphTypeVisible(s.type) && graphTypeVisible(t.type);
      });
      visibleEdges.forEach(function(e) {
        var s = byId[e.sourceNodeId], t = byId[e.targetNodeId];
        var a = toScreen(s), b = toScreen(t);
        var hot = focus && (e.sourceNodeId === focus || e.targetNodeId === focus);
        var dim = (focus && !hot) || (searching && !(matches[s.id] || matches[t.id]));
        var ra = screenRadius(s), rb = screenRadius(t);
        var dx = b.x - a.x, dy = b.y - a.y;
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var ux = dx / len, uy = dy / len;
        var x1 = a.x + ux * (ra + 2), y1 = a.y + uy * (ra + 2);
        var x2 = b.x - ux * (rb + 3), y2 = b.y - uy * (rb + 3);
        if (len < ra + rb + 6) return;
        var alpha = dim ? 0.12 : hot ? 0.9 : 0.42;
        ctx.strokeStyle = edgeBase + alpha + ')';
        ctx.fillStyle = edgeBase + alpha + ')';
        ctx.lineWidth = hot ? 1.8 : 1.1 + Math.min(0.8, (e.weight || 0.5) * 0.6);
        ctx.setLineDash(edgeDash(e.type));
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2 - ux * 5, y2 - uy * 5);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - ux * 7 - uy * 3.5, y2 - uy * 7 + ux * 3.5);
        ctx.lineTo(x2 - ux * 7 + uy * 3.5, y2 - uy * 7 - ux * 3.5);
        ctx.closePath();
        ctx.fill();
      });

      var order = graphSim.nodes.filter(function(s) { return graphTypeVisible(s.type); });
      order.sort(function(p, q) { return (dimmed(q.id) ? 0 : 1) - (dimmed(p.id) ? 0 : 1) || p.r - q.r; });
      order.reverse();
      order.forEach(function(s) {
        var p = toScreen(s);
        var r = screenRadius(s);
        if (p.x < -r - 4 || p.y < -r - 4 || p.x > graphSim.w + r + 4 || p.y > graphSim.h + r + 4) return;
        var shape = NODE_SHAPES[s.type] || 'circle';
        var color = nodeColor(s.type);
        ctx.globalAlpha = dimmed(s.id) ? 0.22 : 1;
        graphShapePath(ctx, shape, p.x, p.y, r);
        if (graphShapeHollow(shape)) {
          ctx.fillStyle = bg;
          ctx.fill();
          ctx.lineWidth = Math.max(2, r * 0.38);
          ctx.strokeStyle = color;
          ctx.stroke();
        } else {
          ctx.fillStyle = color;
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = bg;
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        if (s.id === selected || s.id === graphSim.hoverId || (searching && matches[s.id])) {
          graphShapePath(ctx, shape, p.x, p.y, r + 4);
          ctx.lineWidth = s.id === selected ? 2.2 : 1.4;
          ctx.strokeStyle = s.id === selected ? ink : searching && matches[s.id] && s.id !== graphSim.hoverId ? (dark ? '#f2555a' : '#cc0000') : muted;
          ctx.stroke();
        }
        if (g.fresh[s.id] && Date.now() - g.fresh[s.id] < 4000) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, r + 7, 0, Math.PI * 2);
          ctx.lineWidth = 1.2;
          ctx.strokeStyle = dark ? 'rgba(92,192,143,0.9)' : 'rgba(45,106,79,0.9)';
          ctx.stroke();
        }
        placed.push({ x: p.x - r, y: p.y - r, w: r * 2, h: r * 2, node: s.id });
      });

      var labelList = order.slice().sort(function(p, q) {
        function pri(s) {
          if (s.id === selected) return 5;
          if (s.id === graphSim.hoverId) return 4;
          if (searching && matches[s.id]) return 3;
          if (focus && neighbors[s.id]) return 2;
          return dimmed(s.id) ? 0 : 1;
        }
        return pri(q) - pri(p) || graphDegree(q.id) - graphDegree(p.id) || String(p.id).localeCompare(String(q.id));
      });
      var labeled = 0;
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      labelList.forEach(function(s) {
        if (focus && dimmed(s.id) && s.id !== selected) return;
        if (searching && !matches[s.id] && s.id !== selected) return;
        var node = g.nodeMap[s.id];
        if (!node) return;
        var strong = s.id === selected || s.id === graphSim.hoverId;
        var text = graphNodeLabel(node, strong ? 48 : 26);
        ctx.font = (strong ? '700 12px ' : '500 11px ') + 'Inter, system-ui, sans-serif';
        var tw = ctx.measureText(text).width;
        var p = toScreen(s);
        var r = screenRadius(s);
        var h = strong ? 15 : 14;
        var spots = [
          { x: p.x - tw / 2, y: p.y + r + 3 },
          { x: p.x + r + 5, y: p.y - h / 2 },
          { x: p.x - tw / 2, y: p.y - r - 3 - h },
          { x: p.x - r - 5 - tw, y: p.y - h / 2 }
        ];
        var own = placed.filter(function(pl) { return pl.node === s.id; });
        own.forEach(function(pl) { placed.splice(placed.indexOf(pl), 1); });
        var spot = null;
        for (var i = 0; i < spots.length; i++) {
          var rect = { x: spots[i].x - 2, y: spots[i].y, w: tw + 4, h: h };
          if (strong || free(rect)) { spot = rect; break; }
        }
        own.forEach(function(pl) { placed.push(pl); });
        if (!spot) return;
        placed.push(spot);
        labeled++;
        ctx.strokeStyle = bg;
        ctx.lineWidth = 3.5;
        ctx.strokeText(text, spot.x + 2, spot.y + h / 2);
        ctx.fillStyle = strong ? ink : (dark ? '#d6d8dc' : '#26282c');
        ctx.fillText(text, spot.x + 2, spot.y + h / 2);
      });

      ctx.font = '500 10px "JetBrains Mono", ui-monospace, monospace';
      visibleEdges.forEach(function(e) {
        var s = byId[e.sourceNodeId], t = byId[e.targetNodeId];
        var hot = focus && (e.sourceNodeId === focus || e.targetNodeId === focus);
        if (focus && !hot) return;
        if (searching && !(matches[s.id] || matches[t.id])) return;
        if (!hot && e.type === 'related_to' && graphSim.zoom < 1.3) return;
        var a = toScreen(s), b = toScreen(t);
        var len = Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y));
        var text = String(e.type || '').replace(/_/g, ' ');
        var tw = ctx.measureText(text).width;
        if (!hot && len < tw + screenRadius(s) + screenRadius(t) + 24) return;
        var rect = { x: (a.x + b.x) / 2 - tw / 2 - 3, y: (a.y + b.y) / 2 - 7, w: tw + 6, h: 13 };
        if (!free(rect)) return;
        placed.push(rect);
        ctx.fillStyle = bg;
        ctx.globalAlpha = 0.9;
        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        ctx.globalAlpha = 1;
        ctx.fillStyle = hot ? ink : muted;
        ctx.fillText(text, rect.x + 3, rect.y + 6.5);
      });
      graphSim.labeled = labeled;
    }

    function graphLlmMode() {
      var flag = (store.flags || []).filter(function(f) { return f && f.key === 'GRAPH_EXTRACTION_ENABLED'; })[0];
      var llm = store.provider && store.provider !== 'noop';
      if (flag && flag.enabled && llm) return 'llm';
      if (!llm) return 'no-llm';
      return 'flag-off';
    }
    function graphLlmNote() {
      var mode = graphLlmMode();
      if (mode === 'llm') return 'LLM extraction is on: finished sessions add typed entities (functions, errors, decisions) and typed relations (uses, fixes, depends on).';
      if (mode === 'no-llm') return 'No LLM provider is set, so only structural relations exist: files and concepts that show up in the same observation, plus anything imported from a code graph. Typed entities and relations need an LLM.';
      return 'An LLM provider is set but GRAPH_EXTRACTION_ENABLED is off, so only structural relations exist. Turn it on for typed entities and relations.';
    }

        el.innerHTML =
          '<div class="graph-page">' +
            '<div class="graph-toolbar" id="graph-toolbar">' +
              '<div class="graph-search-wrap"><input type="search" id="graph-search" class="graph-search" placeholder="Find a node (press /)" aria-label="Find a node by name" autocomplete="off" aria-controls="graph-search-results"><div id="graph-search-results" class="graph-search-results" role="listbox" aria-label="Matching nodes" hidden></div></div>' +
              '<select id="graph-type-filter" aria-label="Filter nodes by type"></select>' +

                '<div class="graph-zoom" role="group" aria-label="Zoom">' +
                  '<button type="button" data-action="zoom-graph" data-dir="1" aria-label="Zoom in" title="Zoom in (+)">+</button>' +
                  '<button type="button" data-action="zoom-graph" data-dir="-1" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>' +
                  '<button type="button" data-action="recenter-graph" aria-label="Fit the graph to the view" title="Fit (0)">fit</button>' +
                '</div>' +

                '<div class="graph-stage-msg" id="graph-stage-msg" hidden></div>' +

    function renderGraphToolbar() {
      var g = state.graph;
      var sel = document.getElementById('graph-type-filter');
      if (sel) {
        var types = graphTypeCounts();
        var hiddenCount = types.filter(function(t) { return g.hidden[t.type]; }).length;
        var visible = types.filter(function(t) { return !g.hidden[t.type]; });
        var value = hiddenCount === 0 ? '' : (visible.length === 1 ? visible[0].type : '__custom');
        var html = '<option value="">All types (' + fmtNum(graphNodeList().length) + ')</option>';
        types.forEach(function(t) { html += '<option value="' + esc(t.type) + '">Only ' + esc(t.type) + ' (' + fmtNum(t.shown) + ')</option>'; });
        if (value === '__custom') html += '<option value="__custom">' + visible.length + ' of ' + types.length + ' types</option>';
        if (sel.__html !== html) { sel.innerHTML = html; sel.__html = html; }
        sel.value = value;
        sel.disabled = types.length === 0;
      }
      var sum = document.getElementById('graph-summary');
      if (sum) {
        var t = graphTotals();
        var shown = graphNodeList().length;
        var text = fmtNum(t.nodes) + ' nodes ' + help('graphNode') + ' · ' + fmtNum(t.edges) + ' relations ' + help('graphEdge');
        if (g.truncated && shown < t.nodes) text += ' · showing the ' + fmtNum(shown) + ' most connected';
        setViewHtml(sum, text);
      }
      var input = document.getElementById('graph-search');
      if (input && document.activeElement !== input && input.value !== g.search) input.value = g.search;
      renderGraphSearchResults();
    }

    function renderGraphSearchResults() {
      var g = state.graph;
      var box = document.getElementById('graph-search-results');
      if (!box) return;
      var q = g.search.trim();
      if (!q || !g.searchOpen) { box.hidden = true; box.innerHTML = ''; return; }
      var hits = graphSearchMatches(8);
      var html = '';
      hits.forEach(function(n, i) {
        html += '<button type="button" role="option" class="gs-hit' + (i === g.searchIndex ? ' active' : '') + '" aria-selected="' + (i === g.searchIndex ? 'true' : 'false') + '" data-action="graph-select" data-node-id="' + esc(n.id) + '">' + shapeSvg(n.type, 12) + '<span class="gs-name" title="' + esc(n.name) + '">' + esc(n.type === 'file' && String(n.name).indexOf('/') >= 0 ? (String(n.name).length > 48 ? '…' + String(n.name).slice(-47) : n.name) : graphNodeLabel(n, 60)) + '</span><span class="gs-meta">' + esc(n.type) + ' · ' + graphDegree(n.id) + '</span></button>';
      });
      if (!hits.length) html += '<div class="gs-empty">No node in view matches &ldquo;' + esc(q) + '&rdquo;.</div>';
      if (g.truncated) html += '<button type="button" class="gs-hit gs-remote" data-action="graph-search-remote">Search all ' + fmtNum(graphTotals().nodes) + ' nodes on the server</button>';
      box.innerHTML = html;
      box.hidden = false;
    }

    function renderGraphStage() {
      var g = state.graph;
      var msg = document.getElementById('graph-stage-msg');
      var page = document.querySelector('#view-graph .graph-page');
      if (!msg || !page) return;
      var html = '';
      var empty = g.loaded && !g.queryError && !g.disabledInfo && graphNodeList().length === 0;
      if (!g.loaded) {
        html = '<div class="graph-loading">' + skeleton(4) + '<div class="empty-step-label">Loading the graph…</div></div>';
      } else if (g.disabledInfo) {
        html = emptyState({
          icon: '&#9676;',
          title: 'The knowledge graph is off',
          what: 'Entities and relations agentmemory pulls out of what agents do.',
          why: esc(g.disabledInfo.enableHow || 'Graph extraction is disabled on this server.'),
          steps: [{ label: 'Turn it on and restart:', cmd: 'export GRAPH_EXTRACTION_ENABLED=true\nexport ANTHROPIC_API_KEY=sk-ant-...\nnpx @agentmemory/agentmemory' }],
          link: g.disabledInfo.docsHref ? { href: g.disabledInfo.docsHref, text: 'Knowledge graph docs' } : null
        });
      } else if (g.queryError) {
        html = emptyState({
          icon: '&#9888;',
          title: 'The graph could not be loaded',
          what: 'The graph page reads the top ' + GRAPH_LIMIT + ' most connected nodes in one request.',

        }) + '<div class="graph-msg-actions"><button type="button" class="btn" data-action="graph-retry">Retry</button></div>';
      } else if (empty) {
        html = emptyState({

          steps: [
            { label: 'Build it now from every stored observation (spends LLM tokens when extraction is on):', cmd: curlPost('graph/build', {}) },
            { label: 'Or import a structural code graph made by graphify (no LLM needed):', cmd: curlPost('graph/import-graphify', { cwd: '/path/to/repo' }) },
            { label: 'For typed entities and relations, turn on LLM extraction and restart:', cmd: 'export GRAPH_EXTRACTION_ENABLED=true\nexport ANTHROPIC_API_KEY=sk-ant-...' }
          ]
        }) + '<div class="graph-msg-actions"><button type="button" class="btn btn-primary" data-action="rebuild-graph">Build from observations</button></div>';
      }
      page.classList.toggle('is-empty', !!html && g.loaded);
      if (msg.__html !== html) { msg.innerHTML = html; msg.__html = html; }
      msg.hidden = !html;
    }

    function graphDetailRelations(id) {
      var g = state.graph;
      var rows = {};
      var d = g.detail && g.detail.id === id && g.detail.data ? g.detail.data : null;
      if (d && d.relations) d.relations.forEach(function(r) { rows[r.edgeId] = r; });
      graphEdgeList().forEach(function(e) {
        if (e.sourceNodeId !== id && e.targetNodeId !== id) return;
        var out = e.sourceNodeId === id;
        var n = g.nodeMap[out ? e.targetNodeId : e.sourceNodeId];
        rows[e.id] = { edgeId: e.id, type: e.type, direction: out ? 'out' : 'in', weight: e.weight, observationCount: (e.sourceObservationIds || []).length, neighbor: n ? { id: n.id, name: n.name, type: n.type } : (rows[e.id] && rows[e.id].neighbor) || null };
      });
      return Object.keys(rows).map(function(k) { return rows[k]; }).sort(function(a, b) {
        return String(a.type).localeCompare(String(b.type)) || (a.direction === b.direction ? 0 : a.direction === 'out' ? -1 : 1) || String(a.neighbor && a.neighbor.name).localeCompare(String(b.neighbor && b.neighbor.name));
      });
    }

    function graphCloseBtn() {
      return '<button type="button" class="icon-btn icon-close" data-action="graph-close" aria-label="Close node details">close</button>';
    }

    function renderGraphDetail() {
      var panel = document.getElementById('graph-detail');
      if (!panel) return;
      var g = state.graph;
      var page = document.querySelector('#view-graph .graph-page');
      if (page) page.classList.toggle('has-detail', !!g.selectedId);
      if (!g.selectedId) { setViewHtml(panel, ''); return; }
      var id = g.selectedId;

      html += '<div class="mem-section"><div class="mem-section-title">Most connected</div><ol class="go-top">';

      html += '<div class="empty-step-label" style="margin-top:8px;">Query it from an agent:</div>' + cmdBlock('memory_graph_query { "query": "checkout" }');
