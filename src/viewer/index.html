      var id = target.getAttribute('data-memory-id') || '';
      if (action === 'mem-check') {
        if (target.checked) m.checked[id] = true;
        else delete m.checked[id];
        renderMemories();
      } else if (action === 'mem-check-all') {
        var rows = memoryRows();
        if (target.checked) rows.forEach(function(r) { m.checked[r.id] = true; });
        else rows.forEach(function(r) { delete m.checked[r.id]; });
        renderMemories();
      } else if (action === 'mem-uncheck-all') {
        m.checked = {};
        renderMemories();
      } else if (action === 'mem-export') {
        exportCheckedMemories();
      } else if (action === 'mem-bulk-forget') {
        openBulkForgetModal();
      } else if (action === 'mem-confirm-bulk-forget') {
        closeModal();
        forgetMemories(Object.keys(m.checked), 'Forgotten in the viewer (bulk)');
      } else if (action === 'mem-filter') {
        var dim = target.getAttribute('data-dim');
        var value = target.getAttribute('data-value') || '';
        var current = dim === 'project' ? m.projectFilter : dim === 'agent' ? m.agentFilter : m.typeFilter;
        setMemoryFilter(dim, current === value ? '' : value);
      } else if (action === 'mem-clear-filters') {
        clearMemoryFilters();
      } else if (action === 'mem-close') {
        m.selectedId = null;
        m.editing = null;
        m.error = '';
        setRouteEntity('memories', '');
        renderMemories();
      } else if (action === 'mem-diff') {
        m.diffId = id;
        renderMemories();
      } else if (action === 'mem-edit') {
        startMemoryEdit(id);
      } else if (action === 'mem-cancel-edit') {
        m.editing = null;
        m.error = '';
        renderMemories();
      } else if (action === 'mem-save-edit') {
        reviewMemoryEdit();
      } else if (action === 'mem-confirm-edit') {
        saveMemoryEdit();
      } else if (action === 'mem-forget') {
        openForgetModal(id);
      } else if (action === 'mem-confirm-forget') {
        var mem = store.entities.memory[id];
        var withHistory = document.getElementById('mem-forget-history');
        var ids = [id];
        if (mem && withHistory && withHistory.checked) ids = ids.concat(memoryChain(mem).older.map(function(v) { return v.id; }));
        closeModal();
        forgetMemories(ids, 'Forgotten in the viewer');
      }
    }

    function closeModal() {
      var overlay = document.getElementById('modal-overlay');
      var wasOpen = overlay.classList.contains('open');
      overlay.classList.remove('open');
      document.getElementById('modal').classList.remove('overlay-panel');
      var back = modalReturnFocus;
      modalReturnFocus = null;
      if (wasOpen && back && document.contains(back) && typeof back.focus === 'function') back.focus();
    }

    var ACTIVITY_SESSIONS = 10;

    async function loadActivity() {
      var sessions = sortByTimeDesc(entityList('session'), ['startedAt']).filter(function(x) { return sessionId(x); }).slice(0, ACTIVITY_SESSIONS);
      var results = await Promise.all(sessions.map(function(x) {
        return apiGet('observations?sessionId=' + encodeURIComponent(sessionId(x)) + '&limit=100');
      }));
      var seen = {};
      var allObs = [];
      results.forEach(function(r) {
        ((r && r.observations) || []).forEach(function(o) {
          if (o && o.id && !seen[o.id]) { seen[o.id] = true; allObs.push(o); }
        });
      });
      state.activity.observations = allObs;
      state.activity.sessionCount = sessions.length;
      state.activity.loaded = true;
      if (state.activeTab === 'activity') renderActivity();
    }

    var FILE_BASENAMES = { Makefile: 1, Dockerfile: 1, Containerfile: 1, Procfile: 1, Gemfile: 1, Rakefile: 1, Jenkinsfile: 1, Vagrantfile: 1, Justfile: 1, LICENSE: 1, README: 1 };

    function looksLikeFile(f, cwd) {
      var s = String(f || '').trim();
      if (!s || /[*?{}[\]]/.test(s)) return false;
      var bare = s.replace(/[\/\\]+$/, '');
      if (cwd && bare === String(cwd).replace(/[\/\\]+$/, '')) return false;
      var base = bare.split(/[\/\\]/).pop() || '';
      return !!FILE_BASENAMES[base] || /\.[A-Za-z0-9_-]{1,12}$/.test(base);
    }

    function obsFiles(o) {
      var out = {};
      var cwd = (store.entities.session[o.sessionId] || {}).cwd;
      (o.files || []).forEach(function(f) { if (looksLikeFile(f, cwd)) out[f] = true; });
      var ti = o.toolInput;
      if (ti && typeof ti === 'object') {
        [ti.file_path, ti.notebook_path].forEach(function(f) { if (typeof f === 'string' && looksLikeFile(f, cwd)) out[f] = true; });
      }
      return Object.keys(out);
    }

    function dayKey(ts) {
      var d = new Date(ts);
      if (!isFinite(d.getTime())) return '';
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function activityDays(sessions) {
      var days = {};
      sessions.forEach(function(s) {
        var k = dayKey(s.startedAt);
        if (!k) return;
        var d = days[k] || (days[k] = { sessions: [], obs: 0 });
        d.sessions.push(s);
        d.obs += s.observationCount || 0;
      });
      return days;
    }

    function heatmapHtml(sessions) {
      var act = state.activity;
      var days = activityDays(sessions);
      var keys = Object.keys(days).sort();
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var earliest = keys.length ? new Date(keys[0] + 'T00:00:00') : today;
      var spanWeeks = Math.ceil((today - earliest) / (7 * 86400000)) + 1;
      var weeks = Math.min(53, Math.max(16, spanWeeks));
      var start = new Date(today);
      start.setDate(start.getDate() - today.getDay() - (weeks - 1) * 7);
      var max = 0;
      keys.forEach(function(k) { if (days[k].obs > max) max = days[k].obs; });
      var totalObs = 0;
      var busiest = '';
      keys.forEach(function(k) { totalObs += days[k].obs; if (!busiest || days[k].obs > days[busiest].obs) busiest = k; });
      var html = '<div class="hm-stats">';
      html += '<div><b>' + fmtNum(keys.length) + '</b>active day' + (keys.length === 1 ? '' : 's') + '</div>';
      html += '<div><b>' + fmtNum(sessions.length) + '</b>sessions ' + help('session') + '</div>';
      html += '<div><b>' + fmtNum(totalObs) + '</b>observations ' + help('observation') + '</div>';
      html += '<div><b>' + (busiest ? esc(new Date(busiest + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })) : '-') + '</b>busiest day' + (busiest ? ' · ' + fmtNum(days[busiest].obs) + ' obs' : '') + '</div>';
      html += '</div>';
      var labels = [];
      var cells = '';
      for (var w = 0; w < weeks; w++) {
        var weekStart = new Date(start);
        weekStart.setDate(start.getDate() + w * 7);
        labels[w] = w === 0 ? weekStart.toLocaleDateString(undefined, { month: 'short' }) : '';
        for (var i = 0; i < 7; i++) {
          var probe = new Date(weekStart);
          probe.setDate(weekStart.getDate() + i);
          if (probe.getDate() === 1) labels[w] = probe.toLocaleDateString(undefined, { month: 'short' });
        }
        for (var d = 0; d < 7; d++) {
          var day = new Date(weekStart);
          day.setDate(weekStart.getDate() + d);
          var k = dayKey(day);
          if (day > today) { cells += '<span class="hm-cell future" aria-hidden="true"></span>'; continue; }
          var info = days[k];
          var niceDate = day.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
          if (!info) { cells += '<span class="hm-cell" title="' + esc(niceDate) + ': nothing recorded"></span>'; continue; }
          var ratio = max ? info.obs / max : 0;
          var level = ratio > 0.75 ? 4 : ratio > 0.5 ? 3 : ratio > 0.25 ? 2 : 1;
          var text = niceDate + ': ' + info.sessions.length + ' session' + (info.sessions.length === 1 ? '' : 's') + ', ' + info.obs + ' observation' + (info.obs === 1 ? '' : 's');
          cells += '<button type="button" class="hm-cell level-' + level + (act.day === k ? ' on' : '') + '" data-action="activity-day" data-day="' + k + '" title="' + esc(text) + '" aria-label="' + esc(text) + '" aria-pressed="' + (act.day === k ? 'true' : 'false') + '"></button>';
        }
      }
      if (labels[1] || labels[2]) labels[0] = '';
      html += '<div class="hm"><span></span><div class="hm-months" aria-hidden="true">' + labels.map(function(l) { return '<span>' + esc(l) + '</span>'; }).join('') + '</div>';
      html += '<div class="hm-days" aria-hidden="true"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>';
      html += '<div class="hm-grid" role="group" aria-label="Sessions and observations per day">' + cells + '</div></div>';
      var c = store.counts || {};
      var total = typeof c.sessions === 'number' ? c.sessions : sessions.length;
      var cursor = state.sessions.nextCursor;
      html += '<div class="hm-foot"><span>Counts the ' + fmtNum(sessions.length) + (total > sessions.length ? ' newest of ' + fmtNum(total) : '') + ' sessions loaded in this viewer, on the day each started. Pick a shaded day to list its sessions.</span>';
      if (cursor) html += '<button class="btn" data-action="sessions-load-more"' + (state.sessions.loadingMore ? ' disabled' : '') + '>' + (state.sessions.loadingMore ? 'Loading…' : 'Load older sessions') + '</button>';
      html += '<span class="hm-legend" aria-hidden="true">less <span class="hm-cell"></span><span class="hm-cell level-1"></span><span class="hm-cell level-2"></span><span class="hm-cell level-3"></span><span class="hm-cell level-4"></span> more</span></div>';
      if (act.day && days[act.day]) {
        var list = sortByTimeDesc(days[act.day].sessions, ['startedAt']);
        html += '<div class="day-panel"><div class="mem-section-title">' + esc(new Date(act.day + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })) + ' · ' + list.length + ' session' + (list.length === 1 ? '' : 's') + ' <button type="button" class="linkish" data-action="activity-day" data-day="' + act.day + '" style="margin-left:auto;font-size:11px;">close</button></div><ul class="ses-links">';
        list.slice(0, 20).forEach(function(s) {
          html += '<li><span class="badge ' + (s.status === 'active' ? 'badge-green' : 'badge-blue') + '">' + esc(s.status || 'unknown') + '</span>' + entityLink('session', sessionId(s), sessionDisplayName(s)) + '<span class="rel-time">' + esc(absTime(s.startedAt)) + ' · ' + fmtNum(s.observationCount || 0) + ' obs</span><span class="src-text">' + esc(s.firstPrompt || '') + '</span></li>';
        });
        html += '</ul></div>';
      }
      return html;
    }

    function activityFeedHtml(obs) {
      var act = state.activity;
      var list = obs.filter(function(o) {
        if (act.typeFilter && obsType(o) !== act.typeFilter) return false;
        if (act.fileFilter && obsFiles(o).indexOf(act.fileFilter) < 0) return false;
        return true;
      }).sort(function(a, b) { return String(b.timestamp || '').localeCompare(String(a.timestamp || '')); });
      var html = '';
      if (act.typeFilter || act.fileFilter) {
        html += '<div class="act-filter"><span>' + fmtNum(list.length) + ' observation' + (list.length === 1 ? '' : 's') + (act.typeFilter ? ' of type <b>' + esc(act.typeFilter.replace(/_/g, ' ')) + '</b>' : '') + (act.fileFilter ? ' touching <b>' + esc(act.fileFilter.split('/').pop()) + '</b>' : '') + '</span><button type="button" class="btn" data-action="activity-clear">Show all</button></div>';
      }
      if (!list.length) {
        return html + emptyState({
          compact: true,
          icon: '&#128337;',
          title: act.typeFilter || act.fileFilter ? 'No observations match' : 'Nothing captured yet',
          what: 'The newest observations from the ' + ACTIVITY_SESSIONS + ' newest sessions, grouped by session. New ones appear at the top the moment an agent records them.',
          why: act.typeFilter || act.fileFilter ? 'None of the loaded observations match the picked type or file.' : 'The newest sessions have no captured tool use yet.',
          steps: act.typeFilter || act.fileFilter ? [{ label: 'Press Show all above.' }] : [{ label: 'Record one by hand to watch it arrive:', cmd: curlPost('observe', { hookType: 'post_tool_use', sessionId: 'demo-1', project: 'my-project', cwd: '/path/to/project', timestamp: new Date().toISOString(), data: { tool_name: 'Read', tool_input: { file_path: 'README.md' } } }) }]
        });
      }
      html += '<ol class="obs-timeline">';
      var last = null;
      list.slice(0, 40).forEach(function(o) {
        var s = store.entities.session[o.sessionId] || { id: o.sessionId };
        if (o.sessionId !== last) {
          last = o.sessionId;
          html += '<li class="feed-session" aria-hidden="false">' + entityLink('session', o.sessionId, sessionDisplayName(s)) + (s.agentId ? '<span>@' + esc(s.agentId) + '</span>' : '') + (s.firstPrompt ? '<span class="src-text" title="' + esc(s.firstPrompt) + '">' + esc(truncate(s.firstPrompt, 90)) + '</span>' : '') + '</li>';
        }
        html += obsItemHtml(o, s.cwd, o.sessionId);
      });
      html += '</ol>';
      if (list.length > 40) html += '<div class="load-more">Showing the newest 40 of ' + fmtNum(list.length) + '. Open a session for its full timeline.</div>';
      return html;
    }

    function renderActivity() {
      var el = document.getElementById('view-activity');
      var act = state.activity;
      if (!store.loaded.session || !act.loaded) {
        setViewHtml(el, skeleton(10));
        return;
      }
      var sessions = entityList('session').filter(function(s) { return sessionId(s); });
      if (!sessions.length) {
        setViewHtml(el, emptyState({
          icon: '&#128200;',
          title: 'No activity yet',
          what: 'This page shows when agents worked, what kinds of things they did and which files they touched, with a live feed of the newest observations.',
          why: 'No session has been recorded on this install yet.',
          steps: [
            { label: 'Connect your agent with hooks so its work is captured (swap in codex, cursor, gemini-cli or another supported agent):', cmd: connectCmd() },
            { label: 'Or record a session by hand:', cmd: curlPost('session/start', { sessionId: 'demo-1', project: 'my-project', cwd: '/path/to/project' }) }
          ],
          link: { href: 'https://github.com/rohitg00/agentmemory#quick-start', text: 'Supported agents' }
        }));
        return;
      }
      var obs = act.observations || [];
      var html = '<div class="inline-note"><strong>Activity</strong> shows when agents worked and what they did. Pick a day, a kind of work or a file to narrow the feed; every entry links to its session and observation. The feed updates live.</div>';
      html += '<div class="card"><div class="card-title">When agents worked ' + help('heatmap') + '</div>' + heatmapHtml(sessions) + '</div>';

      var typeCounts = {};
      var fileCounts = {};
      obs.forEach(function(o) {
        var t = obsType(o);
        typeCounts[t] = (typeCounts[t] || 0) + 1;
        obsFiles(o).forEach(function(f) { fileCounts[f] = (fileCounts[f] || 0) + 1; });
      });
      var typeList = Object.keys(typeCounts).sort(function(a, b) { return typeCounts[b] - typeCounts[a]; });
      var topFiles = Object.keys(fileCounts).sort(function(a, b) { return fileCounts[b] - fileCounts[a] || a.localeCompare(b); }).slice(0, 8);
      var busiest = sortByTimeDesc(sessions, ['startedAt']).slice(0, 60).sort(function(a, b) { return (b.observationCount || 0) - (a.observationCount || 0); }).slice(0, 5);

      html += '<div class="dash-cols">';
      html += '<div class="card"><div class="card-title">What agents did <span class="section-sub" style="text-transform:none;letter-spacing:0;font-family:var(--font-ui);font-weight:400;font-size:11px;color:var(--ink-faint);">' + fmtNum(obs.length) + ' observations from the ' + fmtNum(act.sessionCount || 0) + ' newest sessions</span></div>';
      if (!typeList.length) {
        html += '<p class="empty-step-label">The newest sessions have no captured tool use yet. Kinds of work appear here as agents read, edit, run and search.</p>';
      } else {
        html += '<div class="mem-section-title" style="margin-top:0;">Kind of work ' + help('observation') + '</div><div class="bar-chart">';
        var maxT = typeCounts[typeList[0]] || 1;
        typeList.slice(0, 8).forEach(function(t) {
          var on = act.typeFilter === t;
          html += '<button type="button" class="bar-row linkrow' + (on ? ' on' : '') + '" data-action="activity-type" data-type="' + esc(t) + '" aria-pressed="' + (on ? 'true' : 'false') + '" title="Show only ' + esc(t.replace(/_/g, ' ')) + ' observations"><span class="bar-label">' + esc(t.replace(/_/g, ' ')) + '</span><span class="bar-track"><span class="bar-fill" style="display:block;width:' + Math.round((typeCounts[t] / maxT) * 100) + '%;background:' + (OBS_TYPE_COLORS[t] || '#666666') + ';"></span></span><span class="bar-value">' + typeCounts[t] + '</span></button>';
        });
        html += '</div>';
      }
      html += '<div class="mem-section-title" style="margin-top:14px;">Most touched files</div>';
      if (!topFiles.length) {
        html += '<p class="empty-step-label">No file reads or edits in the newest sessions yet.</p>';
      } else {
        html += '<div class="bar-chart">';
        var maxF = fileCounts[topFiles[0]] || 1;
        topFiles.forEach(function(f) {
          var on = act.fileFilter === f;
          html += '<button type="button" class="bar-row linkrow' + (on ? ' on' : '') + '" data-action="activity-file" data-file="' + esc(f) + '" aria-pressed="' + (on ? 'true' : 'false') + '" title="' + esc(f) + ': show only observations touching it"><span class="bar-label">' + esc(f.split('/').pop()) + '</span><span class="bar-track"><span class="bar-fill" style="display:block;width:' + Math.round((fileCounts[f] / maxF) * 100) + '%;background:var(--green);"></span></span><span class="bar-value">' + fileCounts[f] + '</span></button>';
        });
        html += '</div>';
      }
      html += '<div class="mem-section-title" style="margin-top:14px;">Busiest recent sessions</div><ul class="ses-links">';
      busiest.forEach(function(s) {
        html += '<li><span class="strength-num" style="min-width:48px;">' + fmtNum(s.observationCount || 0) + ' obs</span>' + entityLink('session', sessionId(s), sessionDisplayName(s)) + '<span class="src-text" title="' + esc(s.firstPrompt || '') + '">' + esc(s.firstPrompt || '') + '</span></li>';
      });
      html += '</ul></div>';

      html += '<div class="card"><div class="card-title">Latest observations ' + help('observation') + ' <span class="ses-live-note" style="font-family:var(--font-ui);font-size:11px;color:var(--ink-faint);">updates live</span></div><div class="card-scroll" style="max-height:640px;padding-left:14px;">';
      html += activityFeedHtml(obs);
      html += '</div></div></div>';
      setViewHtml(el, html);
    }

    function handleActivityAction(action, target) {
      var act = state.activity;
      if (action === 'activity-type') { var t = target.getAttribute('data-type') || ''; act.typeFilter = act.typeFilter === t ? '' : t; }
      else if (action === 'activity-file') { var f = target.getAttribute('data-file') || ''; act.fileFilter = act.fileFilter === f ? '' : f; }
      else if (action === 'activity-day') { var d = target.getAttribute('data-day') || ''; act.day = act.day === d ? '' : d; }
      else if (action === 'activity-clear') { act.typeFilter = ''; act.fileFilter = ''; }
      renderActivity();
    }

    var TOOL_TYPE_MAP = { Read: 'file_read', Write: 'file_write', Edit: 'file_edit', MultiEdit: 'file_edit', NotebookEdit: 'file_edit', Bash: 'command_run', Grep: 'search', Glob: 'search', WebFetch: 'web_fetch', WebSearch: 'web_fetch', AskUserQuestion: 'conversation', Task: 'subagent' };
    var SESSION_OBS_PAGE = 50;

    function obsType(o) {
      if (o.type) return o.type;
      if (o.toolName && TOOL_TYPE_MAP[o.toolName]) return TOOL_TYPE_MAP[o.toolName];
      if (o.hookType === 'prompt_submit') return 'conversation';
      if (o.hookType === 'post_tool_failure') return 'error';
      return 'other';
    }

    function formatDuration(ms) {
      if (!(ms >= 0)) return '';
      var sec = Math.round(ms / 1000);
      if (sec < 60) return sec + 's';
      var min = Math.round(sec / 60);
      if (min < 60) return min + 'm';
      var h = Math.floor(min / 60);
      if (h < 48) return h + 'h ' + (min % 60) + 'm';
      return Math.round(h / 24) + 'd';
    }

    function sessionDuration(s) {
      var start = new Date(s.startedAt).getTime();
      if (!isFinite(start)) return { label: '-', title: 'No start time recorded' };
      if (s.status === 'active' || !s.endedAt) {
        var last = new Date(s.updatedAt || s.startedAt).getTime();
        var span = isFinite(last) && last - start >= 1000 ? formatDuration(last - start) : '';
        return { label: 'running', running: true, span: span, title: span ? 'Still running. The last observation arrived ' + span + ' after the start.' : 'Still running.' };
      }
      var end = new Date(s.endedAt).getTime();
      return { label: formatDuration(end - start) || '-', title: 'From ' + formatTime(s.startedAt) + ' to ' + formatTime(s.endedAt) };
    }

    function absTime(ts) {
      if (!ts) return '';
      try { return new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (_) { return ''; }
    }

    function sessionFiltersActive() {
      var f = state.sessions.filters;
      return !!(String(f.q || '').trim() || f.project || f.agent || f.status);
    }

    function sessionMatches(s) {
      var f = state.sessions.filters;
      if (f.project && s.project !== f.project) return false;
      if (f.agent && s.agentId !== f.agent) return false;
      if (f.status && s.status !== f.status) return false;
      var q = String(f.q || '').trim().toLowerCase();
      if (q) {
        var hay = [sessionId(s), s.project, s.cwd, s.firstPrompt, s.agentId].map(function(v) { return String(v || '').toLowerCase(); }).join('\n');
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }

    function sessionRows() {
      return sortByTimeDesc(entityList('session').filter(function(s) { return sessionId(s) && sessionMatches(s); }), ['startedAt']);
    }

    function sessionQueryPath(extra) {
      var f = state.sessions.filters;
      var p = 'sessions?limit=50';
      if (f.project) p += '&project=' + encodeURIComponent(f.project);
      if (f.agent) p += '&agentId=' + encodeURIComponent(f.agent);
      if (f.status) p += '&status=' + encodeURIComponent(f.status);
      if (String(f.q || '').trim()) p += '&q=' + encodeURIComponent(String(f.q).trim());
      return p + (extra || '');
    }

    function mergeSessionRows(rows) {
      (rows || []).forEach(function(row) {
        var id = sessionKey(row);
        if (id) store.entities.session[id] = Object.assign({}, store.entities.session[id] || {}, row);
      });
    }

    async function applySessionFilters() {
      var s = state.sessions;
      if (!sessionFiltersActive()) {
        s.query = null;
        renderSessions();
        return;
      }
      var path = sessionQueryPath();
      s.query = { path: path, loading: true, failed: false, nextCursor: null };
      renderSessions();
      var res = await apiGet(path);
      if (!s.query || s.query.path !== path) return;
      s.query.loading = false;
      if (!res) {
        s.query.failed = true;
      } else {
        mergeSessionRows(res.sessions);
        s.query.nextCursor = res.nextCursor || null;
      }
      renderSessions();
    }

    var applySessionFiltersSoon = debounce(applySessionFilters, 300);

    function setSessionFilter(dim, value) {
      state.sessions.filters[dim] = value || '';
      if (state.sessions.selectedId && window.matchMedia('(max-width: 1100px)').matches) {
        state.sessions.selectedId = null;
        setRouteEntity('sessions', '');
      }
      if (state.sessions.autoSelected) {
        state.sessions.selectedId = null;
        state.sessions.autoSelected = false;
      }
      if (dim === 'q') applySessionFiltersSoon();
      else applySessionFilters();
    }

    function clearSessionFilters() {
      state.sessions.filters = { q: '', project: '', agent: '', status: '' };
      state.sessions.query = null;
      renderSessions();
    }

    async function loadMoreSessions() {
      var s = state.sessions;
      var q = s.query;
      var cursor = q ? q.nextCursor : s.nextCursor;
      if (!cursor || s.loadingMore) return;
      s.loadingMore = true;
      renderTab(state.activeTab);
      var res = await apiGet(q ? q.path + '&cursor=' + encodeURIComponent(cursor) : 'sessions?limit=100&cursor=' + encodeURIComponent(cursor));
      s.loadingMore = false;
      if (res) {
        mergeSessionRows(res.sessions);
        if (q && s.query === q) q.nextCursor = res.nextCursor || null;
        else if (!q) s.nextCursor = res.nextCursor || null;
      }
      markDirty(['sessions', 'activity', 'profile', 'replay']);
      renderTab(state.activeTab);
    }

    function adjustSessionFacets(prev, next) {
      var f = state.sessions.facets;
      if (!f) return;
      function bump(list, value, delta) {
        if (!value) return;
        var row = list.find(function(x) { return x.value === value; });
        if (row) row.count = Math.max(0, row.count + delta);
        else if (delta > 0) list.push({ value: value, count: delta });
      }
      [['projects', 'project'], ['agents', 'agentId'], ['statuses', 'status']].forEach(function(pair) {
        var list = f[pair[0]] || (f[pair[0]] = []);
        var a = prev ? prev[pair[1]] : '';
        var b = next ? next[pair[1]] : '';
        if (a === b) return;
        bump(list, a, -1);
        bump(list, b, 1);
      });
    }

    function sessionFilterSelect(dim, facetKey, allLabel, current, labelFn) {
      var list = ((state.sessions.facets || {})[facetKey] || []).filter(function(x) { return x.count > 0 || x.value === current; }).slice();
      if (dim === 'status') {
        ['active', 'completed'].forEach(function(v) { if (!list.some(function(x) { return x.value === v; })) list.push({ value: v, count: 0 }); });
      }
      if (current && !list.some(function(x) { return x.value === current; })) list.unshift({ value: current, count: 0 });
      var none = list.length === 0;
      var html = '<select id="ses-' + dim + '-filter" data-dim="' + dim + '" aria-label="Filter sessions by ' + dim + '"' + (none ? ' disabled title="No session has a' + (dim === 'agent' ? 'n agent id' : ' ' + dim) + ' yet"' : '') + '>';
      html += '<option value="">' + esc(none ? 'No ' + dim + 's' : allLabel) + '</option>';
      list.forEach(function(x) {
        html += '<option value="' + esc(x.value) + '"' + (current === x.value ? ' selected' : '') + '>' + esc(labelFn ? labelFn(x.value) : x.value) + ' (' + fmtNum(x.count) + ')</option>';
      });
      return html + '</select>';
    }

    function sessionToolbarHtml() {
      var f = state.sessions.filters;
      var html = '<div class="toolbar mem-filters">';
      html += '<input type="search" id="ses-search" placeholder="Search prompt, project, id or agent (press /)" value="' + esc(f.q) + '" aria-label="Search sessions">';
      html += sessionFilterSelect('project', 'projects', 'All projects', f.project, function(v) { return String(v).split('/').pop(); });
      html += sessionFilterSelect('agent', 'agents', 'All agents', f.agent);
      html += sessionFilterSelect('status', 'statuses', 'Any status', f.status);
      return html + '</div>';
    }

    function bindSessionToolbar() {
      var input = document.getElementById('ses-search');
      if (input && !input.__bound) {
        input.__bound = true;
        bindImeSafeSearch(input, 1, function(v) { setSessionFilter('q', v); });
      }
      ['project', 'agent', 'status'].forEach(function(dim) {
        var sel = document.getElementById('ses-' + dim + '-filter');
        if (sel && !sel.__bound) {
          sel.__bound = true;
          sel.addEventListener('change', function() { setSessionFilter(dim, this.value); });
        }
      });
    }

    function sessionFilterDescription() {
      var f = state.sessions.filters;
      var parts = [];
      if (String(f.q || '').trim()) parts.push('the search &ldquo;' + esc(f.q) + '&rdquo;');
      if (f.project) parts.push('project <b>' + esc(f.project) + '</b>');
      if (f.agent) parts.push('agent <b>' + esc(f.agent) + '</b>');
      if (f.status) parts.push('status <b>' + esc(f.status) + '</b>');
      return parts.join(', ');
    }

    function sessionRowHtml(s) {
      var id = sessionId(s);
      var f = state.sessions.filters;
      var selected = state.sessions.selectedId === id;
      var dur = sessionDuration(s);
      var html = '<div class="session-item' + (selected ? ' selected' : '') + '" data-action="select-session" data-session-id="' + esc(id) + '" role="button" tabindex="0" aria-current="' + (selected ? 'true' : 'false') + '">';
      html += '<div class="session-top"><span class="session-project">' + esc(sessionDisplayName(s)) + '</span>';
      html += '<span class="badge ' + (s.status === 'active' ? 'badge-green' : s.status === 'completed' ? 'badge-blue' : 'badge-muted') + '">' + esc(s.status || 'unknown') + '</span></div>';
      var preview = s.firstPrompt || summaryText(s.summary) || '';
      html += preview ? '<div class="session-preview clamp-2">' + esc(preview) + '</div>' : '<div class="session-preview none">No prompt recorded</div>';
      html += '<div class="mem-chips">';
      if (s.agentId) html += '<button type="button" class="mem-chip' + (f.agent === s.agentId ? ' on' : '') + '" data-action="ses-filter" data-dim="agent" data-value="' + esc(s.agentId) + '" title="Show only sessions of agent ' + esc(s.agentId) + '">@' + esc(s.agentId) + '</button>';
      html += '<span>' + fmtNum(s.observationCount || 0) + ' obs</span><span>&middot;</span>';
      html += '<span title="' + esc(formatTime(s.startedAt)) + '">' + esc(timeAgo(s.startedAt) || '-') + ' (' + esc(absTime(s.startedAt)) + ')</span><span>&middot;</span>';
      html += dur.running ? '<span class="running-dot" title="' + esc(dur.title) + '">running</span>' : '<span title="' + esc(dur.title) + '">' + esc(dur.label) + '</span>';
      html += '<span class="ses-id-mini" title="' + esc(id) + '">' + esc(shortId(id, 18)) + '</span>';
      return html + '</div></div>';
    }

    function sessionListHtml(rows) {
      var s = state.sessions;
      var c = store.counts || {};
      var filtered = sessionFiltersActive();
      var html = '';
      if (filtered) {
        var q = s.query;
        var summary = q && q.loading ? 'Filtering on the server…' : q && q.failed ? 'The filter request failed. Change a filter to retry.' : fmtNum(rows.length) + (q && q.nextCursor ? '+' : '') + ' matching session' + (rows.length === 1 ? '' : 's');
        html += '<div class="mem-filter-note"><span>' + summary + ' for ' + sessionFilterDescription() + '</span><button type="button" class="btn" data-action="ses-clear-filters">Clear all</button></div>';
      }
      if (rows.length === 0) {
        if (filtered && s.query && s.query.loading) return html + skeleton(6);
        if (filtered) {
          html += emptyState({
            icon: '&#128269;',
            title: 'No sessions match',
            what: 'This list shows sessions that match the search box and the project, agent and status filters. The filters run on the server over every session, not only the loaded page.',
            why: 'No session matches ' + sessionFilterDescription() + '.',
            steps: [{ label: 'Run the same query from a terminal:', cmd: curlGet(sessionQueryPath().replace('limit=50', 'limit=20')) }]
          });
          return html + '<div style="margin-top:10px;"><button type="button" class="btn" data-action="ses-clear-filters">Clear search and filters</button></div>';
        }
        return html + emptyState({
          icon: '&#128466;',
          title: 'No sessions yet',
          what: 'A session is one run of an agent in a project, from start to end. Every observation (file read, edit, command, error) belongs to one, and memories and lessons distilled from the work link back to it.',
          why: 'No agent with agentmemory hooks has started a session on this install yet.',
          steps: [
            { label: 'Connect an agent with hooks so each run is recorded (Claude Code shown):', cmd: connectCmd() },
            { label: 'Or start one by hand and record an observation:', cmd: curlPost('session/start', { sessionId: 'demo-1', project: 'my-project', cwd: '/path/to/project' }) + '\n\n' + curlPost('observe', { hookType: 'post_tool_use', sessionId: 'demo-1', project: 'my-project', cwd: '/path/to/project', timestamp: new Date().toISOString(), data: { tool_name: 'Read', tool_input: { file_path: 'README.md' } } }) }
          ],
          link: { href: 'https://github.com/rohitg00/agentmemory#quick-start', text: 'Connect an agent' }
        });
      }
      rows.forEach(function(row) { html += sessionRowHtml(row); });
      var cursor = s.query ? s.query.nextCursor : s.nextCursor;
      var total = filtered ? null : c.sessions;
      html += '<div class="load-more">Showing ' + fmtNum(rows.length) + (typeof total === 'number' ? ' of ' + fmtNum(Math.max(total, rows.length)) : '') + (filtered ? ' matching' : '') + ' sessions, newest first';
      if (cursor) html += '<button class="btn" data-action="sessions-load-more"' + (s.loadingMore ? ' disabled' : '') + '>' + (s.loadingMore ? 'Loading…' : 'Load more') + '</button>';
      return html + '</div>';
    }

    function renderSessions() {
      var el = document.getElementById('view-sessions');
      var s = state.sessions;
      if (!el.querySelector('#session-list')) {
        el.innerHTML = '<div class="inline-note"><strong>Sessions</strong> ' + help('session') + ' are single runs of an agent in a project. Pick one to see its observations ' + help('observation') + ' in order, the files it touched, and the memories and lessons it produced. New sessions and observations appear here live.</div>' +
          '<div id="session-toolbar"></div><div class="sessions-layout" id="sessions-layout"><div id="session-list" class="session-list"></div><div id="session-detail"></div></div>';
        el.__renderedHtml = null;
      }
      var focus = captureSearchFocus(['ses-search']);
      setViewHtml(document.getElementById('session-toolbar'), sessionToolbarHtml());
      bindSessionToolbar();
      restoreSearchFocus(focus);
      var layout = document.getElementById('sessions-layout');
      if (!store.loaded.session) {
        layout.classList.add('has-detail');
        setViewHtml(document.getElementById('session-list'), skeleton(8));
        setViewHtml(document.getElementById('session-detail'), '<div class="detail-panel ses-detail">' + skeleton(10) + '</div>');
        return;
      }
      var rows = sessionRows();
      if (s.autoSelected && s.selectedId && !rows.some(function(r) { return sessionId(r) === s.selectedId; })) {
        s.selectedId = null;
        s.autoSelected = false;
      }
      if (!s.selectedId && !s.closed && rows.length > 0 && window.matchMedia('(min-width: 1101px)').matches) {
        s.selectedId = sessionId(rows[0]);
        s.autoSelected = true;
      }
      setViewHtml(document.getElementById('session-list'), sessionListHtml(rows));
      renderSessionDetailPanel();
      layout.classList.toggle('has-detail', !!document.getElementById('session-detail').firstElementChild);
    }

    function selectSession(id, opts) {
      opts = opts || {};
      var s = state.sessions;
      if (s.selectedId === id && !s.autoSelected && !opts.force) {
        if (!opts.keep) {
          s.selectedId = null;
          s.closed = true;
        }
      } else {
        s.selectedId = id;
        s.closed = false;
      }
      s.autoSelected = false;
      setRouteEntity('sessions', s.selectedId);
      renderSessions();
      if (s.selectedId && window.matchMedia('(max-width: 1100px)').matches) {
        var panel = document.getElementById('session-detail');
        if (panel && panel.scrollIntoView) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function closeSessionDetail() {
      state.sessions.selectedId = null;
      state.sessions.autoSelected = false;
      state.sessions.closed = true;
      setRouteEntity('sessions', '');
      renderSessions();
    }

    function newSessionDetail(id) {
      return { id: id, obs: [], total: 0, nextCursor: null, loading: true, loadingMore: false, failed: false, type: '', minImp: 0, types: {}, rev: 0, focusObs: '', produced: { memories: [], loading: true, failed: false, total: 0 } };
    }

    function detailObsPath(d, cursor) {
      var p = 'observations?sessionId=' + encodeURIComponent(d.id) + '&limit=' + SESSION_OBS_PAGE;
      if (d.type) p += '&type=' + encodeURIComponent(d.type);
      if (d.minImp) p += '&minImportance=' + d.minImp;
      if (cursor) p += '&cursor=' + encodeURIComponent(cursor);
      return p;
    }

    function noteObsTypes(d, list) {
      list.forEach(function(o) { d.types[obsType(o)] = true; });
    }

    async function loadSessionObservations(d, more) {
      var path = detailObsPath(d, more ? d.nextCursor : '');
      var key = d.type + '|' + d.minImp;
      if (more) d.loadingMore = true;
      else { d.loading = true; d.obs = []; d.nextCursor = null; }
      d.rev++;
      renderSessionObs();
      var res = await apiGet(path);
      if (state.sessions.detail !== d || d.type + '|' + d.minImp !== key) return;
      d.loading = false;
      d.loadingMore = false;
      if (!res) {
        d.failed = true;
      } else {
        d.failed = false;
        var seen = {};
        d.obs.forEach(function(o) { seen[o.id] = true; });
        (res.observations || []).forEach(function(o) { if (!seen[o.id]) d.obs.push(o); });
        noteObsTypes(d, d.obs);
        d.total = typeof res.total === 'number' ? res.total : d.obs.length;
        d.nextCursor = res.nextCursor || null;
      }
      d.rev++;
      renderSessionHead();
      renderSessionObs();
      revealFocusObs(d);
    }

    async function loadSessionProduced(d) {
      var res = await apiGet('memories?latest=true&sessionId=' + encodeURIComponent(d.id) + '&limit=50');
      if (state.sessions.detail !== d) return;
      d.produced.loading = false;
      if (!res) d.produced.failed = true;
      else {
        d.produced.memories = res.memories || [];
        d.produced.total = typeof res.total === 'number' ? res.total : d.produced.memories.length;
      }
      renderSessionProduced();
    }

    var sessionLookups = {};
    async function lookupSession(id) {
      if (sessionLookups[id]) return;
      sessionLookups[id] = 'loading';
      var res = await apiGet('sessions?limit=20&q=' + encodeURIComponent(id));
      var hit = res && (res.sessions || []).find(function(r) { return sessionKey(r) === id; });
      if (hit) mergeSessionRows([hit]);
      sessionLookups[id] = hit ? 'found' : 'missing';
      if (state.activeTab === 'sessions') renderSessions();
    }

    function ensureSessionDetail(id) {
      var s = state.sessions;
      if (s.detail && s.detail.id === id) return s.detail;
      var d = newSessionDetail(id);
      if (s.pendingObs && s.pendingObs.sid === id) {
        d.focusObs = s.pendingObs.obs;
        s.pendingObs = null;
      }
      s.detail = d;
      Promise.all([ensureLoaded('lesson'), ensureLoaded('crystal')]).then(function() { if (state.sessions.detail === d) renderSessionProduced(); });
      loadSessionObservations(d, false);
      loadSessionProduced(d);
      return d;
    }

    function renderSessionDetailPanel() {
      var panel = document.getElementById('session-detail');
      if (!panel) return;
      var s = state.sessions;
      var id = s.selectedId;
      if (!id) { setViewHtml(panel, ''); panel.__sid = ''; return; }
      var row = store.entities.session[id];
      if (!row) {
        if (!sessionLookups[id]) lookupSession(id);
        panel.__sid = '';
        if (sessionLookups[id] === 'missing') {
          setViewHtml(panel, '<div class="detail-panel ses-detail"><div class="mem-detail-head"><span>Session</span>' + sessionCloseBtn() + '</div>' + emptyState({
            compact: true,
            icon: '&#128269;',
            title: 'Session not found',
            what: 'Session links anywhere in the viewer open this panel by id.',
            why: 'No session has the id <code>' + esc(id) + '</code>. It was deleted, or the link comes from another install.',
            steps: [{ label: 'Check from a terminal:', cmd: curlGet('sessions?limit=20&q=' + encodeURIComponent(id)) }]
          }) + '</div>');
        } else {
          setViewHtml(panel, '<div class="detail-panel ses-detail"><div class="mem-detail-head"><span>Loading session ' + esc(shortId(id, 22)) + '…</span>' + sessionCloseBtn() + '</div>' + skeleton(8) + '</div>');
        }
        return;
      }
      ensureSessionDetail(id);
      if (panel.__sid !== id || !panel.querySelector('#ses-head')) {
        panel.innerHTML = '<div class="detail-panel ses-detail" data-detail-id="' + esc(id) + '"><div id="ses-head"></div><div id="ses-produced"></div><div id="ses-obs"></div></div>';
        panel.__renderedHtml = null;
        panel.__sid = id;
      }
      renderSessionHead();
      renderSessionProduced();
      renderSessionObs();
    }

    function sessionCloseBtn() {
      return '<button type="button" class="icon-btn icon-close" data-action="ses-close" aria-label="Close session details">close</button>';
    }

    function sessionToolStats(d) {
      var tools = {};
      var files = {};
      d.obs.forEach(function(o) {
        var t = obsType(o);
        var tool = o.toolName || (o.origin && o.origin.channel === 'tool' ? o.origin.detail : '') || (t !== 'conversation' && t !== 'other' ? o.title : '');
        if (tool) tools[tool] = (tools[tool] || 0) + 1;
        (o.files || []).forEach(function(f) { files[f] = (files[f] || 0) + 1; });
        var ti = o.toolInput;
        if (ti && typeof ti === 'object' && (ti.file_path || ti.path)) files[ti.file_path || ti.path] = (files[ti.file_path || ti.path] || 0) + 1;
      });
      return { tools: tools, files: files };
    }

    function relPath(f, cwd) {
      var p = String(f || '');
      if (cwd && p.indexOf(cwd + '/') === 0) return p.slice(cwd.length + 1);
      return p;
    }

    function sessionSummaryHtml(sum) {
      if (!sum) return '';
      if (typeof sum === 'string') return '<div class="mem-section"><div class="mem-section-title">Summary</div><div class="ses-summary">' + esc(sum) + '</div></div>';
      var html = '<div class="mem-section"><div class="mem-section-title">Summary</div>';
      if (sum.title) html += '<div class="ses-summary"><b>' + esc(sum.title) + '</b></div>';
      if (sum.narrative) html += '<div class="ses-summary">' + esc(sum.narrative) + '</div>';
      if (Array.isArray(sum.keyDecisions) && sum.keyDecisions.length) html += '<ul class="obs-facts">' + sum.keyDecisions.map(function(k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul>';
      return html + '</div>';
    }

    function sessionHeadHtml(s, d) {
      var id = sessionId(s);
      var dur = sessionDuration(s);
      var stats = sessionToolStats(d);
      var toolKeys = Object.keys(stats.tools).sort(function(a, b) { return stats.tools[b] - stats.tools[a]; });
      var fileKeys = Object.keys(stats.files).sort(function(a, b) { return stats.files[b] - stats.files[a]; });
      var partial = d.nextCursor || d.type || d.minImp;
      var html = '<div class="mem-detail-head"><span class="badge ' + (s.status === 'active' ? 'badge-green' : 'badge-blue') + '">' + esc(s.status || 'unknown') + '</span>' + help('sessionStatus');
      html += '<span>' + esc(sessionDisplayName(s)) + '</span>';
      if (s.agentId) html += '<span>· @' + esc(s.agentId) + '</span>';
      html += '<span>· started ' + relTime(s.startedAt) + '</span>' + sessionCloseBtn() + '</div>';
      var prompt = s.firstPrompt || summaryText(s.summary) || '';
      html += prompt ? '<div class="mem-detail-content ses-prompt">' + esc(truncate(prompt, 600)) + '</div>' : '<div class="mem-detail-content ses-prompt none">No first prompt was recorded for this session.</div>';

      html += '<div class="mem-actions">';
      html += copyBtn(id, 'session id').replace('>copy<', '>copy id<');
      html += copyBtn(curlGet('observations?sessionId=' + encodeURIComponent(id) + '&limit=50'), 'curl command').replace('>copy<', '>copy curl<');
      html += copyBtn('memory_timeline { "anchor": ' + JSON.stringify(s.startedAt || '') + ', "project": ' + JSON.stringify(s.project || '') + ', "after": 20 }', 'MCP call').replace('>copy<', '>copy MCP call<');
      html += '<a class="btn" href="#replay" data-replay-session="' + esc(id) + '">Replay</a>';
      html += '<span class="ses-danger-actions">';
      if (s.status === 'active') html += '<button type="button" class="btn btn-danger" data-action="ses-end" data-session-id="' + esc(id) + '">End session…</button>';
      html += '<button type="button" class="btn" data-action="ses-summarize" data-session-id="' + esc(id) + '"' + (state.sessions.summarizing === id ? ' disabled' : '') + '>' + (state.sessions.summarizing === id ? 'Summarizing…' : 'Summarize…') + '</button>';
      html += '</span></div>';
      if (state.sessions.notice && state.sessions.notice.id === id) html += '<div class="mem-note' + (state.sessions.notice.err ? ' err' : '') + '" role="status">' + state.sessions.notice.html + '</div>';

      html += '<div class="ses-stats">';
      html += '<div><span>' + fmtNum(s.observationCount || d.total || 0) + '</span><small>Observations ' + help('observation') + '</small></div>';
      html += '<div><span>' + fmtNum(toolKeys.length) + '</span><small>Tools used' + (partial ? '*' : '') + '</small></div>';
      html += '<div><span>' + fmtNum(fileKeys.length) + '</span><small>Files touched' + (partial ? '*' : '') + '</small></div>';
      html += '<div title="' + esc(dur.title) + '"><span>' + esc(dur.running ? (dur.span ? dur.span + '+' : 'running') : dur.label) + '</span><small>' + (dur.running ? 'Running so far' : 'Duration') + '</small></div>';
      html += '</div>';
      if (partial) html += '<div class="ses-foot">* counted over the ' + fmtNum(d.obs.length) + ' observation' + (d.obs.length === 1 ? '' : 's') + ' loaded below' + (d.type || d.minImp ? ' with the current filter' : '') + '. Load more to widen it.</div>';

      html += '<div class="mem-section"><div class="mem-section-title">Details</div><dl class="mem-meta">';
      html += '<dt>Id</dt><dd>' + idChip('session', id) + '</dd>';
      html += '<dt>Project ' + help('project') + '</dt><dd>' + (s.project ? '<button type="button" class="mem-chip" data-action="ses-filter" data-dim="project" data-value="' + esc(s.project) + '" title="Show only this project">' + esc(s.project) + '</button>' : '<span style="color:var(--ink-faint);">none</span>') + '</dd>';
      html += '<dt>Agent ' + help('agent') + '</dt><dd>' + (s.agentId ? '<button type="button" class="mem-chip" data-action="ses-filter" data-dim="agent" data-value="' + esc(s.agentId) + '" title="Show only this agent">@' + esc(s.agentId) + '</button>' : '<span style="color:var(--ink-faint);">not recorded</span>') + '</dd>';
      html += '<dt>Started</dt><dd>' + relTime(s.startedAt) + ' <span style="color:var(--ink-faint);">(' + esc(formatTime(s.startedAt)) + ')</span></dd>';
      if (s.endedAt && s.status !== 'active') html += '<dt>Ended</dt><dd>' + relTime(s.endedAt) + ' <span style="color:var(--ink-faint);">(' + esc(formatTime(s.endedAt)) + ')</span></dd>';
      else html += '<dt>Last activity</dt><dd>' + relTime(s.updatedAt || s.startedAt) + ' <span style="color:var(--ink-faint);">(still running; updates live)</span></dd>';
      if (s.cwd) html += '<dt>Directory</dt><dd><code>' + esc(s.cwd) + '</code></dd>';
      if (s.model) html += '<dt>Model</dt><dd>' + esc(s.model) + '</dd>';
      if (asTags(s.tags).length) html += '<dt>Tags</dt><dd>' + asTags(s.tags).map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join(' ') + '</dd>';
      if (toolKeys.length) html += '<dt>Tools</dt><dd class="tag-list" style="margin:0;">' + toolKeys.slice(0, 16).map(function(t) { return '<span class="tag">' + esc(t) + ' &times;' + stats.tools[t] + '</span>'; }).join('') + '</dd>';
      if (fileKeys.length) {
        html += '<dt>Files</dt><dd class="tag-list" style="margin:0;">' + fileKeys.slice(0, 24).map(function(f) { return '<span class="tag file-tag" title="' + esc(f) + ' (' + stats.files[f] + '&times;)">' + esc(relPath(f, s.cwd)) + '</span>'; }).join('') + (fileKeys.length > 24 ? '<span class="ses-foot">+' + (fileKeys.length - 24) + ' more</span>' : '') + '</dd>';
      }
      html += '</dl></div>';
      html += sessionSummaryHtml(s.summary);
      return html;
    }

    function renderSessionHead() {
      var host = document.getElementById('ses-head');
      var d = state.sessions.detail;
      if (!host || !d) return;
      var s = store.entities.session[d.id];
      if (!s) return;
      setViewHtml(host, sessionHeadHtml(s, d));
    }

    function sessionLessons(id) {
      var memIds = {};
      var d = state.sessions.detail;
      if (d && d.id === id) d.produced.memories.forEach(function(m) { memIds[m.id] = true; });
      entityList('memory').forEach(function(m) { if ((m.sessionIds || []).indexOf(id) >= 0) memIds[m.id] = true; });
      var crystalIds = {};
      entityList('crystal').forEach(function(c) { if (c.sessionId === id) crystalIds[c.id] = true; });
      return sortByTimeDesc(entityList('lesson').filter(function(l) {
        if (l.deleted) return false;
        return (l.sourceIds || []).some(function(src) { return src === id || crystalIds[src] || memIds[src]; });
      }), ['updatedAt', 'createdAt']);
    }

    function sessionProducedHtml(d) {
      var s = store.entities.session[d.id] || {};
      var p = d.produced;
      var lessons = sessionLessons(d.id);
      var html = '<div class="mem-section"><div class="mem-section-title">Produced from this session ' + help('provenance') + '</div>';
      if (p.loading) return html + skeleton(2) + '</div>';
      if (!p.memories.length && !lessons.length) {
        var newest = d.obs[0];
        html += '<div class="empty-step-label">Nothing links back here yet. A memory links to this session when it is distilled from its observations by consolidation (needs an LLM) or saved with <code>sourceObservationIds</code>; a lesson links here when it is crystallized from this session.' + (p.failed ? ' The lookup failed; reopen the session to retry.' : '') + '</div>';
        if (newest) html += cmdBlock(curlPost('remember', { content: 'What the agent learned in this session', type: 'fact', project: s.project || undefined, sourceObservationIds: [newest.id] }));
        return html + '</div>';
      }
      html += '<dl class="mem-meta">';
      if (p.memories.length) {
        html += '<dt>Memories ' + help('memory') + '</dt><dd><ul class="ses-links">' + p.memories.slice(0, 12).map(function(m) {
          return '<li><span class="badge ' + (TYPE_BADGES[m.type] || 'badge-muted') + '">' + esc(m.type || 'memory') + '</span> ' + entityLink('memory', m.id, truncate(memoryHeadline(m).head, 110)) + '</li>';
        }).join('') + '</ul>' + (p.total > 12 ? '<div class="ses-foot">+' + fmtNum(p.total - 12) + ' more. ' + copyBtn(curlGet('memories?latest=true&sessionId=' + encodeURIComponent(d.id)), 'curl command').replace('>copy<', '>copy curl for all<') + '</div>' : '') + '</dd>';
      }
      if (lessons.length) {
        html += '<dt>Lessons ' + help('lesson') + '</dt><dd><ul class="ses-links">' + lessons.slice(0, 8).map(function(l) {
          return '<li>' + entityLink('lesson', l.id, truncate(l.content || l.id, 110)) + '</li>';
        }).join('') + '</ul></dd>';
      }
      return html + '</dl></div>';
    }

    function renderSessionProduced() {
      var host = document.getElementById('ses-produced');
      var d = state.sessions.detail;
      if (!host || !d) return;
      setViewHtml(host, sessionProducedHtml(d));
    }

    function splitNarrative(n) {
      var text = String(n || '');
      if (text.charAt(0) !== '{') return { input: null, output: text };
      var at = text.indexOf('} | ');
      while (at >= 0) {
        try {
          var parsed = JSON.parse(text.slice(0, at + 1));
          if (parsed && typeof parsed === 'object') return { input: parsed, output: text.slice(at + 4) };
        } catch (_) {}
        at = text.indexOf('} | ', at + 1);
      }
      try {
        var whole = JSON.parse(text);
        if (whole && typeof whole === 'object') return { input: whole, output: '' };
      } catch (_) {}
      return { input: null, output: text };
    }

    function obsCodeHtml(text, label) {
      var str = String(text);
      var lines = str.split('\n').length;
      return '<div class="obs-block"><div class="obs-block-label">' + esc(label) + (lines > 12 ? ' <span>' + fmtNum(lines) + ' lines, scroll</span>' : '') + '</div><pre class="obs-code">' + esc(truncate(str, 20000)) + '</pre></div>';
    }

    function obsFieldsHtml(input, cwd, skip) {
      if (input === null || input === undefined || input === '') return '';
      if (typeof input !== 'object') return obsCodeHtml(input, 'Input');
      var keys = Object.keys(input);
      if (!keys.length) return '';
      var inline = [];
      var blocks = [];
      keys.forEach(function(k) {
        var v = input[k];
        var label = k.replace(/_/g, ' ');
        if (v !== null && typeof v === 'object') { blocks.push(obsCodeHtml(JSON.stringify(v, null, 2), label)); return; }
        var sv = String(v);
        if (sv.length > 140 || sv.indexOf('\n') >= 0) { blocks.push(obsCodeHtml(sv, label)); return; }
        if (skip && sv === skip) return;
        var shown = /path$|^file/.test(k) ? relPath(sv, cwd) : sv;
        inline.push('<dt>' + esc(label) + '</dt><dd><code title="' + esc(sv) + '">' + esc(shown) + '</code></dd>');
      });
      return (inline.length ? '<dl class="obs-fields">' + inline.join('') + '</dl>' : '') + blocks.join('');
    }

    function obsBodyHtml(o, cwd, sub) {
      var type = obsType(o);
      var html = '';
      if (o.toolInput !== undefined || o.toolOutput !== undefined || o.userPrompt) {
        if (o.userPrompt) html += '<div class="obs-prompt">' + esc(o.userPrompt) + '</div>';
        var ti = o.toolInput;
        if (typeof ti === 'string') { try { var pj = JSON.parse(ti); if (pj && typeof pj === 'object') ti = pj; } catch (_) {} }
        html += obsFieldsHtml(ti, cwd, sub);
        var out = o.toolOutput !== undefined ? o.toolOutput : o.error;
        if (out !== undefined && out !== null && out !== '') html += obsCodeHtml(typeof out === 'string' ? out : JSON.stringify(out, null, 2), type === 'error' ? 'Error' : 'Output');
        return html;
      }
      if (o.narrative) {
        if (type === 'conversation') return '<div class="obs-prompt">' + esc(o.narrative) + '</div>';
        var parts = splitNarrative(o.narrative);
        if (parts.input) {
          html += obsFieldsHtml(parts.input, cwd, sub);
          if (parts.output) html += obsCodeHtml(parts.output, type === 'error' ? 'Error' : 'Output');
        } else {
          html += '<div class="obs-narrative">' + esc(humanizeNarrative(o.narrative)) + '</div>';
        }
      }
      if (o.facts && o.facts.length) html += '<ul class="obs-facts">' + o.facts.map(function(f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
      return html;
    }

    function obsItemHtml(o, cwd, sid) {
      var type = obsType(o);
      var color = OBS_TYPE_COLORS[type] || '#666666';
      var title = o.title || o.toolName || (o.hookType ? o.hookType.replace(/_/g, ' ') : 'Observation');
      if (type === 'conversation' && (title === 'prompt_submit' || o.hookType === 'prompt_submit')) title = 'User prompt';
      var sub = o.subtitle ? humanizeSubtitle(o.subtitle) : '';
      if (!sub && o.toolInput && typeof o.toolInput === 'object') sub = o.toolInput.file_path || o.toolInput.path || o.toolInput.command || o.toolInput.pattern || '';
      if (sub && sub.charAt(0) === '{') sub = '';
      if (!sub && o.narrative && obsType(o) !== 'conversation') {
        var pin = splitNarrative(o.narrative).input;
        if (pin) sub = pin.file_path || pin.path || pin.command || pin.pattern || pin.url || pin.query || '';
      }
      sub = typeof sub === 'string' ? sub : '';
      var imp = typeof o.importance === 'number' ? o.importance : null;
      var focus = state.sessions.detail && state.sessions.detail.focusObs === o.id;
      var html = '<li class="obs-item' + (focus ? ' focus' : '') + '" id="obs-' + esc(o.id) + '" data-obs-id="' + esc(o.id) + '" style="--obs-color:' + color + ';">';
      html += '<div class="obs-item-head">';
      html += '<span class="obs-type-chip">' + esc(type.replace(/_/g, ' ')) + '</span>';
      html += '<span class="obs-item-title">' + esc(title) + '</span>';
      if (sub) html += '<span class="obs-item-sub" title="' + esc(sub) + '">' + esc(relPath(sub, cwd)) + '</span>';
      html += '<span class="obs-item-meta">';
      if (imp !== null) html += '<span class="obs-importance imp-' + imp + '" title="Importance ' + imp + ' of 10. ' + (imp >= 7 ? 'High' : imp >= 4 ? 'Medium' : 'Low') + '.">' + imp + '</span>';
      else html += '<span class="obs-importance raw" title="Just captured. Importance is set when the observation is compressed.">·</span>';
      html += copyBtn(o.id, 'observation id').replace('>copy<', '>copy id<');
      html += '<a class="obs-time" href="#sessions/' + encodeURIComponent(sid) + '?obs=' + encodeURIComponent(o.id) + '" title="' + esc(formatTime(o.timestamp)) + '. Link to this observation.">' + esc(shortTime(o.timestamp)) + '</a>';
      html += '</span></div>';
      html += '<div class="obs-item-body">' + obsBodyHtml(o, cwd, sub);
      var files = (o.files || []).filter(function(f) { return relPath(f, cwd) !== relPath(sub, cwd); });
      if (files.length || (o.concepts && o.concepts.length)) {
        html += '<div class="tag-list">' + (o.concepts || []).map(function(c) { return '<span class="tag">' + esc(c) + '</span>'; }).join('') + files.map(function(f) { return '<span class="tag file-tag" title="' + esc(f) + '">' + esc(relPath(f, cwd)) + '</span>'; }).join('') + '</div>';
      }
      return html + '</div></li>';
    }

    function sessionObsControlsHtml(d) {
      var html = '<div class="type-chips">';
      html += '<span class="type-chip' + (!d.type ? ' active' : '') + '" role="button" tabindex="0" data-action="ses-obs-type" data-type-filter="">All' + (!d.type && !d.minImp ? ' (' + fmtNum(d.total) + ')' : '') + '</span>';
      Object.keys(d.types).sort().forEach(function(t) {
        var color = OBS_TYPE_COLORS[t] || '#666666';
        var on = d.type === t;
        html += '<span class="type-chip' + (on ? ' active' : '') + '" role="button" tabindex="0" data-action="ses-obs-type" data-type-filter="' + esc(t) + '" style="' + (on ? 'background:' + color + ';border-color:' + color + ';' : 'border-color:' + color + ';color:' + color + ';') + '">' + esc(t.replace(/_/g, ' ')) + (on ? ' (' + fmtNum(d.total) + ')' : '') + '</span>';
      });
      html += '<select id="ses-obs-imp" aria-label="Minimum importance"><option value="0">Any importance</option>';
      [4, 7].forEach(function(i) { html += '<option value="' + i + '"' + (d.minImp === i ? ' selected' : '') + '>importance ' + i + '+</option>'; });
      return html + '</select></div>';
    }

    function sessionObsHtml(d) {
      var s = store.entities.session[d.id] || {};
      var html = '<div class="mem-section"><div class="mem-section-title">Observations ' + help('observation') + ' <span class="ses-live-note">newest first · importance ' + help('importance') + ' · updates live</span></div>';
      html += sessionObsControlsHtml(d);
      if (d.loading) return html + skeleton(6) + '</div>';
      if (!d.obs.length) {
        if (d.type || d.minImp) {
          html += emptyState({
            compact: true,
            icon: '&#128337;',
            title: 'No observations match',
            what: 'The type chips and the importance picker narrow this list on the server.',
            why: 'No observation in this session is ' + (d.type ? 'of type <b>' + esc(d.type.replace(/_/g, ' ')) + '</b>' : '') + (d.type && d.minImp ? ' with ' : '') + (d.minImp ? 'importance ' + d.minImp + ' or higher' : '') + '.',
            steps: [{ label: 'Pick All, or choose Any importance.' }]
          });
        } else {
          html += emptyState({
            compact: true,
            icon: '&#128337;',
            title: d.failed ? 'Observations could not be loaded' : 'No observations yet',
            what: 'Observations are the individual things the agent did: prompts, file reads and edits, commands, searches, errors.',
            why: d.failed ? 'The request failed. Check that agentmemory is running, then reopen the session.' : s.status === 'active' ? 'The session is running but no tool use was captured yet. New ones appear here the moment they arrive.' : 'This session ended before any tool use was captured.',
            steps: [{ label: 'Record one by hand to watch it arrive live:', cmd: curlPost('observe', { hookType: 'post_tool_use', sessionId: d.id, project: s.project || 'my-project', cwd: s.cwd || '/path/to/project', timestamp: new Date().toISOString(), data: { tool_name: 'Read', tool_input: { file_path: 'README.md' } } }) }]
          });
        }
        return html + '</div>';
      }
      html += '<ol class="obs-timeline" id="ses-obs-list">';
      d.obs.forEach(function(o) { html += obsItemHtml(o, s.cwd, d.id); });
      html += '</ol>';
      html += '<div class="load-more" id="ses-obs-more">' + sessionObsMoreHtml(d) + '</div>';
      return html + '</div>';
    }

    function sessionObsMoreHtml(d) {
      var html = 'Showing ' + fmtNum(d.obs.length) + ' of ' + fmtNum(Math.max(d.total, d.obs.length)) + (d.type || d.minImp ? ' matching' : '') + ' observations';
      if (d.nextCursor) html += '<button class="btn" data-action="ses-obs-more"' + (d.loadingMore ? ' disabled' : '') + '>' + (d.loadingMore ? 'Loading…' : 'Load ' + SESSION_OBS_PAGE + ' more') + '</button>';
      return html;
    }

    function renderSessionObs() {
      var host = document.getElementById('ses-obs');
      var d = state.sessions.detail;
      if (!host || !d) return;
      if (host.__rev === d.rev && host.__detail === d) return;
      host.__rev = d.rev;
      host.__detail = d;
      host.innerHTML = sessionObsHtml(d);
      host.__renderedHtml = null;
      var sel = document.getElementById('ses-obs-imp');
      if (sel) sel.addEventListener('change', function() { setSessionObsFilter(d.type, parseInt(this.value, 10) || 0); });
    }

    function setSessionObsFilter(type, minImp) {
      var d = state.sessions.detail;
      if (!d) return;
      d.type = type;
      d.minImp = minImp;
      loadSessionObservations(d, false);
      renderSessionHead();
    }

    function obsMatchesDetail(d, o) {
      if (d.type && obsType(o) !== d.type) return false;
      if (d.minImp && !(typeof o.importance === 'number' && o.importance >= d.minImp)) return false;
      return true;
    }

    function liveSessionObservation(o) {
      var d = state.sessions.detail;
      if (!d || d.id !== o.sessionId || d.loading) return;
      var s = store.entities.session[d.id] || {};
      var idx = d.obs.findIndex(function(x) { return x.id === o.id; });
      var list = document.getElementById('ses-obs-list');
      var inView = state.activeTab === 'sessions' && list && document.getElementById('ses-obs').__detail === d;
      if (idx >= 0) {
        d.obs[idx] = o.narrative || o.type ? o : Object.assign({}, d.obs[idx], o);
        d.types[obsType(d.obs[idx])] = true;
        var node = inView ? document.getElementById('obs-' + o.id) : null;
        if (node) node.outerHTML = obsItemHtml(d.obs[idx], s.cwd, d.id);
        else d.rev++;
      } else {
        if (!obsMatchesDetail(d, o)) return;
        var newType = !d.types[obsType(o)];
        d.types[obsType(o)] = true;
        d.obs.unshift(o);
        d.total++;
        if (inView && !newType) {
          list.insertAdjacentHTML('afterbegin', obsItemHtml(o, s.cwd, d.id).replace('class="obs-item', 'class="obs-item fresh'));
          var more = document.getElementById('ses-obs-more');
          if (more) more.innerHTML = sessionObsMoreHtml(d);
        } else {
          d.rev++;
        }
      }
      if (state.activeTab === 'sessions') {
        renderSessionObs();
        renderSessionHead();
      }
    }

    function noteSessionProduced(change) {
      var d = state.sessions.detail;
      if (!d || d.produced.loading) return;
      var list = d.produced.memories;
      var idx = list.findIndex(function(m) { return m.id === change.id; });
      var row = change.row;
      var links = !!row && row.isLatest !== false && ((row.sessionIds || []).indexOf(d.id) >= 0 || (row.sourceObservationIds || []).some(function(oid) { return d.obs.some(function(o) { return o.id === oid; }); }));
      if (idx >= 0 && !links) {
        list.splice(idx, 1);
        d.produced.total = Math.max(0, d.produced.total - 1);
      } else if (idx >= 0) {
        list[idx] = row;
      } else if (links) {
        list.unshift(row);
        d.produced.total++;
      } else {
        return;
      }
      if (state.activeTab === 'sessions') renderSessionProduced();
    }

    function revealFocusObs(d) {
      if (!d.focusObs || d.loading) return;
      var hit = d.obs.some(function(o) { return o.id === d.focusObs; });
      if (!hit) {
        if (d.nextCursor && !d.loadingMore && (d.focusPages || 0) < 40) {
          d.focusPages = (d.focusPages || 0) + 1;
          loadSessionObservations(d, true);
        } else if (!d.nextCursor) {
          state.sessions.notice = { id: d.id, err: true, html: 'Observation <code>' + esc(d.focusObs) + '</code> is not in this session' + (d.type || d.minImp ? ' with the current filter' : '') + '.' };
          d.focusObs = '';
          renderSessionHead();
        }
        return;
      }
      if (state.activeTab !== 'sessions') return;
      var el = document.getElementById('obs-' + d.focusObs);
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    }

    function focusSessionObservation(sid, obsId) {
      var s = state.sessions;
      if (s.detail && s.detail.id === sid) {
        s.detail.focusObs = obsId;
        s.detail.focusPages = 0;
        s.detail.rev++;
        renderSessionObs();
        revealFocusObs(s.detail);
      } else {
        s.pendingObs = { sid: sid, obs: obsId };
      }
    }

    function openEndSessionModal(id) {
      var s = store.entities.session[id];
      if (!s) return;
      var llm = store.provider !== 'noop';
      openModal('<h3>End this session?</h3>' +
        '<p>Marks <b>' + esc(sessionDisplayName(s)) + '</b> (<code>' + esc(shortId(id, 22)) + '</code>) as completed and records the end time now. It does not stop the agent: if it keeps working, its observations are still recorded under this session id.</p>' +
        '<p>Ending runs the same wrap-up as the agent&rsquo;s own stop hook: ' + (llm ? 'an LLM summary of the session, knowledge-graph extraction and, when consolidation is on, crystals and lessons.' : 'with no LLM provider configured, the summary and graph extraction are skipped, so ending only changes the status.') + '</p>' +
        '<p style="font-size:11px;">Same call from a terminal: <code>' + esc(curlPost('session/end', { sessionId: id }).replace(/\s*\\\n\s*/g, ' ')) + '</code></p>' +
        '<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="ses-confirm-end" data-session-id="' + esc(id) + '">End session</button></div>');
    }

    function openSummarizeModal(id) {
      var s = store.entities.session[id];
      if (!s) return;
      var llm = store.provider !== 'noop';
      var body = '<h3>Summarize this session?</h3>' +
        '<p>An LLM reads the observations of <b>' + esc(sessionDisplayName(s)) + '</b> (' + fmtNum(s.observationCount || 0) + ') and writes a short summary: a title, what happened and the key decisions. The summary is shown here and in the session list, and later feeds consolidation into facts and procedures. Running it again replaces the old summary.</p>';
      if (!llm) {
        body += '<div class="mem-note err">No LLM provider is configured, so Summarize would do nothing. Set a key and restart agentmemory:</div>' + cmdBlock('export ANTHROPIC_API_KEY=sk-ant-...\nnpx @agentmemory/agentmemory');
        body += '<div class="modal-actions" style="margin-top:14px;"><button class="btn" data-action="close-modal">Close</button></div>';
      } else {
        body += '<p style="font-size:11px;">Same call from a terminal: <code>' + esc(curlPost('summarize', { sessionId: id }).replace(/\s*\\\n\s*/g, ' ')) + '</code></p>';
        body += '<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="ses-confirm-summarize" data-session-id="' + esc(id) + '">Summarize</button></div>';
      }
      openModal(body, llm ? '[data-action="ses-confirm-summarize"]' : '[data-action="close-modal"]');
    }

    async function endSession(id) {
      closeModal();
      var res = await apiPost('session/end', { sessionId: id });
      state.sessions.notice = res && res.success !== false
        ? { id: id, html: 'Session ended. The wrap-up (summary, graph, consolidation) runs in the background and its results appear here live.' }
        : { id: id, err: true, html: 'Ending the session failed. Check that agentmemory is running and try again.' };
      renderSessionHead();
    }

    var SUMMARIZE_ERRORS = {
      no_provider: 'No LLM provider is configured, so nothing was summarized. Set ANTHROPIC_API_KEY (or another provider key) and restart agentmemory.',
      no_observations: 'This session has no observations to summarize yet.',
      session_not_found: 'agentmemory does not know this session any more.'
    };

    async function summarizeSession(id) {
      closeModal();
      state.sessions.summarizing = id;
      state.sessions.notice = null;
      renderSessionHead();
      var res = await apiPost('summarize', { sessionId: id });
      state.sessions.summarizing = '';
      if (res && res.success !== false) {
        state.sessions.notice = { id: id, html: 'Summary saved. It is shown under Details below.' };
        if (res.summary && store.entities.session[id]) store.entities.session[id].summary = res.summary;
      } else {
        var code = res && res.error;
        state.sessions.notice = { id: id, err: true, html: esc(SUMMARIZE_ERRORS[code] || ('Summarize failed' + (code ? ': ' + code : '. Check that agentmemory is running.'))) };
      }
      renderSessionHead();
    }

    function handleSessionAction(action, target) {
      var id = target.getAttribute('data-session-id') || '';
      if (action === 'ses-close') { closeSessionDetail(); return; }
      if (action === 'ses-filter') {
        var dim = target.getAttribute('data-dim');
        var value = target.getAttribute('data-value') || '';
        if (dim) setSessionFilter(dim, state.sessions.filters[dim] === value ? '' : value);
        return;
      }
      if (action === 'ses-clear-filters') { clearSessionFilters(); return; }
      if (action === 'ses-obs-type') {
        var d = state.sessions.detail;
        if (d) setSessionObsFilter(target.getAttribute('data-type-filter') || '', d.minImp);
        return;
      }
      if (action === 'ses-obs-more') {
        if (state.sessions.detail) loadSessionObservations(state.sessions.detail, true);
        return;
      }
      if (action === 'ses-end') { openEndSessionModal(id); return; }
      if (action === 'ses-confirm-end') { endSession(id); return; }
      if (action === 'ses-summarize') { openSummarizeModal(id); return; }
      if (action === 'ses-confirm-summarize') { summarizeSession(id); return; }
    }

    function isFresh(id) {
      var at = state.freshRows[id];
      return !!at && Date.now() - at < 3000;
    }

    function confColor(pct) {
      return pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--yellow)' : 'var(--red)';
    }

    function listDetailShell(el, kind, note) {
      if (!el.querySelector('#' + kind + '-list')) {
        el.innerHTML = '<div id="' + kind + '-note"></div><div id="' + kind + '-toolbar"></div><div class="list-detail" id="' + kind + '-layout"><div id="' + kind + '-list"></div><div class="ld-detail" id="' + kind + '-detail"></div></div>';
        el.__renderedHtml = null;
      }
      setViewHtml(document.getElementById(kind + '-note'), note || '');
