    function mountGraphCanvas() {
      var canvas = document.getElementById('graph-canvas');
      var stage = document.getElementById('graph-stage');
      if (!canvas || !stage) return;
      graphSim.canvas = canvas;
      graphSim.ctx = canvas.getContext('2d');
      function resize() {
        var r = stage.getBoundingClientRect();
        if (!r.width || !r.height) return;
        var dpr = window.devicePixelRatio || 1;
        var w = Math.round(r.width), h = Math.round(r.height);
        if (graphSim.w === w && graphSim.h === h && graphSim.dpr === dpr) return;
        graphSim.w = w;
        graphSim.h = h;
        graphSim.dpr = dpr;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        if (!graphSim.fitted) { layoutIsolated(); fitGraph(); }
        drawGraph();
      }
      if (graphSim.ro) graphSim.ro.disconnect();
      if (window.ResizeObserver) {
        graphSim.ro = new ResizeObserver(resize);
        graphSim.ro.observe(stage);
      } else {
        window.addEventListener('resize', resize);
      }
      resize();
      bindGraphPointer(canvas);
    }

    function bindGraphPointer(canvas) {
      var down = null;
      var tooltip = document.getElementById('graph-tooltip');
      function local(e) {
        var r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      function showTip(s, p) {
        if (!tooltip) return;
        if (!s) { tooltip.classList.remove('visible'); return; }
        var n = state.graph.nodeMap[s.id];
        if (!n) return;
        tooltip.innerHTML = '<div class="tt-name">' + esc(n.name) + '</div><div class="tt-meta">' + shapeSvg(n.type, 11) + esc(n.type) + ' · ' + fmtNum(graphDegree(n.id)) + ' relation' + (graphDegree(n.id) === 1 ? '' : 's') + '</div><div class="tt-hint">click for relations and sources</div>';
        var x = Math.min(p.x + 14, graphSim.w - 240);
        var y = p.y + 14 > graphSim.h - 70 ? p.y - 70 : p.y + 14;
        tooltip.style.left = Math.max(4, x) + 'px';
        tooltip.style.top = Math.max(4, y) + 'px';
        tooltip.classList.add('visible');
      }
      canvas.addEventListener('pointerdown', function(e) {
        var p = local(e);
        graphSim.pointers[e.pointerId] = p;
        var ids = Object.keys(graphSim.pointers);
        if (ids.length === 2) {
          var a = graphSim.pointers[ids[0]], b = graphSim.pointers[ids[1]];
          down = { pinch: Math.hypot(a.x - b.x, a.y - b.y), zoom: graphSim.zoom, moved: true };
          graphSim.drag = null;
          return;
        }
        var hit = graphHit(p.x, p.y);
        down = { x: p.x, y: p.y, panX: graphSim.panX, panY: graphSim.panY, node: hit, moved: false };
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      });
      canvas.addEventListener('pointermove', function(e) {
        var p = local(e);
        if (graphSim.pointers[e.pointerId]) graphSim.pointers[e.pointerId] = p;
        if (down && down.pinch) {
          var ids = Object.keys(graphSim.pointers);
          if (ids.length === 2) {
            var a = graphSim.pointers[ids[0]], b = graphSim.pointers[ids[1]];
            var dist = Math.hypot(a.x - b.x, a.y - b.y);
            zoomGraphAt((down.zoom * dist / down.pinch) / graphSim.zoom, (a.x + b.x) / 2, (a.y + b.y) / 2);
          }
          return;
        }
        if (down) {
          var dx = p.x - down.x, dy = p.y - down.y;
          if (!down.moved && dx * dx + dy * dy > 16) down.moved = true;
          if (!down.moved) return;
          if (down.node) {
            var s = down.node;
            graphSim.drag = s;
            s.x = (p.x - graphSim.panX) / graphSim.zoom;
            s.y = (p.y - graphSim.panY) / graphSim.zoom;
            if (s.isolated) s.pinned = 'user';
            reheatGraph(0.12);
          } else {
            graphSim.panX = down.panX + dx;
            graphSim.panY = down.panY + dy;
            requestGraphDraw();
          }
          showTip(null);
          return;
        }
        var hit = graphHit(p.x, p.y);
        var id = hit ? hit.id : null;
        canvas.style.cursor = hit ? 'pointer' : 'grab';
        if (id !== graphSim.hoverId) {
          graphSim.hoverId = id;
          requestGraphDraw();
        }
        showTip(hit, p);
      });
      function end(e) {
        delete graphSim.pointers[e.pointerId];
        if (!down) return;
        if (down.pinch) { if (!Object.keys(graphSim.pointers).length) down = null; return; }
        var d = down;
        down = null;
        graphSim.drag = null;
        if (d.moved) return;
        if (e.type === 'pointercancel') return;
        if (d.node) selectGraphNode(d.node.id, { focusDetail: e.pointerType !== 'mouse' });
        else if (state.graph.selectedId) selectGraphNode(null);
      }
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);
      canvas.addEventListener('pointerleave', function() {
        if (graphSim.hoverId) { graphSim.hoverId = null; requestGraphDraw(); }
        showTip(null);
      });
      canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        var p = local(e);
        zoomGraphAt(Math.exp(-e.deltaY * 0.0015), p.x, p.y);
      }, { passive: false });
      canvas.addEventListener('keydown', function(e) {
        var k = e.key;
        if (k === '+' || k === '=') zoomGraphAt(1.25);
        else if (k === '-' || k === '_') zoomGraphAt(0.8);
        else if (k === '0') fitGraph();
        else if (k === 'ArrowLeft') { graphSim.panX += 60; requestGraphDraw(); }
        else if (k === 'ArrowRight') { graphSim.panX -= 60; requestGraphDraw(); }
        else if (k === 'ArrowUp') { graphSim.panY += 60; requestGraphDraw(); }
        else if (k === 'ArrowDown') { graphSim.panY -= 60; requestGraphDraw(); }
        else if (k === 'Escape' && state.graph.selectedId) selectGraphNode(null);
        else return;
        e.preventDefault();
        e.stopPropagation();
      });
    }

    function bindGraphChrome() {
      var input = document.getElementById('graph-search');
      if (input) {
        bindImeSafeSearch(input, 120, function(v) {
          var g = state.graph;
          g.search = v;
          g.searchOpen = !!v.trim();
          g.searchIndex = 0;
          renderGraphSearchResults();
          requestGraphDraw();
        });
        input.addEventListener('focus', function() {
          if (state.graph.search.trim()) { state.graph.searchOpen = true; renderGraphSearchResults(); }
        });
        input.addEventListener('keydown', function(e) {
          var g = state.graph;
          var hits = graphSearchMatches(8);
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            if (!hits.length) return;
            g.searchOpen = true;
            g.searchIndex = (g.searchIndex + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length;
            renderGraphSearchResults();
            e.preventDefault();
          } else if (e.key === 'Enter') {
            g.search = input.value;
            var list = graphSearchMatches(8);
            var pick = list[Math.min(g.searchIndex, list.length - 1)];
            if (pick) {
              g.searchOpen = false;
              renderGraphSearchResults();
              selectGraphNode(pick.id, { center: true });
            } else if (g.truncated && input.value.trim()) {
              searchGraphRemote(input.value.trim());
            }
            e.preventDefault();
          } else if (e.key === 'Escape') {
            if (g.searchOpen) { g.searchOpen = false; renderGraphSearchResults(); }
            else if (input.value) { input.value = ''; g.search = ''; requestGraphDraw(); }
            e.preventDefault();
            e.stopPropagation();
          }
        });
        input.addEventListener('blur', function() {
          setTimeout(function() {
            var box = document.getElementById('graph-search-results');
            if (box && box.contains(document.activeElement)) return;
            state.graph.searchOpen = false;
            renderGraphSearchResults();
          }, 150);
        });
      }
      var sel = document.getElementById('graph-type-filter');
      if (sel) {
        sel.addEventListener('change', function() {
          var g = state.graph;
          var v = sel.value;
          if (v === '__custom') return;
          g.hidden = {};
          if (v) graphTypeCounts().forEach(function(t) { if (t.type !== v) g.hidden[t.type] = true; });
          afterGraphFilter();
        });
      }
    }

    function afterGraphFilter() {
      var g = state.graph;
      if (g.selectedId && g.nodeMap[g.selectedId] && g.hidden[g.nodeMap[g.selectedId].type]) selectGraphNode(null);
      graphSim.fitted = false;
      fitGraph();
      renderGraphToolbar();
      renderGraphOverview();
    }

    async function searchGraphRemote(q) {
      var g = state.graph;
      var box = document.getElementById('graph-search-results');
      if (box) { box.hidden = false; box.innerHTML = '<div class="gs-empty">Searching all nodes…</div>'; }
      var res = await apiPost('graph/query', { query: q, limit: 50 });
      if (!res) {
        if (box) box.innerHTML = '<div class="gs-empty">The server search failed.</div>';
        return;
      }
      mergeGraphRows(res.nodes || [], res.edges || []);
      syncGraphSim(false);
      g.search = q;
      g.searchOpen = true;
      g.searchIndex = 0;
      renderGraphView();
      var first = graphSearchMatches(1)[0];
      if (first) selectGraphNode(first.id, { center: true });
    }

    function handleGraphAction(action, target) {
      var g = state.graph;
      var id = target.getAttribute('data-node-id');
      if (action === 'graph-select' && id) {
        g.searchOpen = false;
        renderGraphSearchResults();
        selectGraphNode(id, { center: true, focusDetail: true });
        return true;
      }
      if (action === 'graph-close') {
        selectGraphNode(null);
        var canvas = document.getElementById('graph-canvas');
        if (canvas) canvas.focus({ preventScroll: true });
        return true;
      }
      if (action === 'graph-center' && id) { centerGraphOn(id); return true; }
      if (action === 'graph-refresh-detail' && id) { fetchGraphDetail(id); return true; }
      if (action === 'graph-toggle-type') {
        var type = target.getAttribute('data-type');
        if (!type) return true;
        if (g.hidden[type]) delete g.hidden[type];
        else g.hidden[type] = true;
        afterGraphFilter();
        var again = document.querySelector('#graph-overview [data-action="graph-toggle-type"][data-type="' + cssEscape(type) + '"]');
        if (again) again.focus({ preventScroll: true });
        return true;
      }
      if (action === 'graph-retry') { g.loaded = false; loadGraph(); return true; }
      if (action === 'graph-search-remote') {
        var input = document.getElementById('graph-search');
        if (input && input.value.trim()) searchGraphRemote(input.value.trim());
        return true;
      }
      return false;
    }

    window.zoomGraph = function(dir) {
      zoomGraphAt(dir > 0 ? 1.25 : 0.8);
    };
    window.recenterGraph = function() {
      fitGraph();
    };

    var graphRebuilding = false;
    async function rebuildGraph() {
      if (graphRebuilding) return;
      var ok = window.confirm(
        'Rebuild the knowledge graph from every stored observation?\n\n' +
        'This replays the whole corpus and can take several minutes on a large store. ' +
        'With LLM extraction on it also spends provider tokens.'
      );
      if (!ok) return;
      graphRebuilding = true;
      var g = state.graph;
      g.rebuildResult = 'Rebuilding from stored observations…';
      renderGraphOverview();
      try {
        var result = await apiPost('graph/build', {});
        g.rebuildResult = result && result.success
          ? 'Rebuilt from ' + (result.sessions || 0) + ' sessions: ' + (result.nodes || 0) + ' nodes and ' + (result.edges || 0) + ' relations extracted. New ones arrive on the live stream.'
          : 'The rebuild failed. Check the server log.';
      } finally {
        graphRebuilding = false;
        renderGraphView();
      }
    }

    function memoryRows() {
      var m = state.memories;
      var rows;
      if (m.searchIds) {
        rows = m.searchIds.map(function(id) { return store.entities.memory[id]; }).filter(Boolean);
      } else {
        rows = sortByTimeDesc(entityList('memory').filter(function(x) { return x && x.isLatest !== false; }), ['updatedAt', 'createdAt']);
      }
      return rows.filter(memoryMatchesFilters);
    }

    var MEMORY_TYPES = ['architecture', 'bug', 'fact', 'pattern', 'preference', 'workflow'];

    function memoryFiltersActive() {
      var m = state.memories;
      return !!(m.typeFilter || m.projectFilter || m.agentFilter);
    }

    function memoryMatchesFilters(mem) {
      var m = state.memories;
      if (!mem || mem.isLatest === false) return false;
      if (m.typeFilter && mem.type !== m.typeFilter) return false;
      if (m.projectFilter && mem.project !== m.projectFilter) return false;
      if (m.agentFilter && mem.agentId !== m.agentFilter) return false;
      return true;
    }

    function memoryQueryPath(extra) {
      var m = state.memories;
      var path = 'memories?latest=true&limit=100';
      if (m.projectFilter) path += '&project=' + encodeURIComponent(m.projectFilter);
      if (m.agentFilter) path += '&agentId=' + encodeURIComponent(m.agentFilter);
      if (m.typeFilter) path += '&type=' + encodeURIComponent(m.typeFilter);
      return path + (extra || '');
    }

    function mergeMemoryRows(rows) {
      (rows || []).forEach(function(r) {
        if (r && r.id) store.entities.memory[r.id] = Object.assign({}, store.entities.memory[r.id] || {}, r);
      });
    }

    function strengthScore(m) {
      var raw = Number(m.strength) || 0;
      var score = raw <= 1 ? raw * 10 : raw;
      return Math.max(0, Math.min(10, Math.round(score * 10) / 10));
    }

    function memoryParentId(m) {
      return (m && (m.parentId || (m.supersedes && m.supersedes[0]))) || '';
    }

    function memoryHeadline(mem) {
      var content = String(mem.content || '').replace(/\s+/g, ' ').trim();
      var title = String(mem.title || '').replace(/\s+/g, ' ').trim().replace(/(\.\.\.|…)$/, '').replace(/[;:,]+$/, '');
      if (title && content.indexOf(title) !== 0) {
        return { head: title, excerpt: content === title ? '' : content };
      }
      var end = -1;
      var re = /[.!?;](\s|$)/g;
      var hit;
      while ((hit = re.exec(content))) {
        if (hit.index >= 24) { end = hit.index + 1; break; }
      }
      if (end > 0 && end <= 150) {
        return { head: content.slice(0, end).replace(/[;:,]+$/, ''), excerpt: content.slice(end).trim() };
      }
      if (content.length <= 150) return { head: content, excerpt: '' };
      var cut = content.lastIndexOf(' ', 120);
      if (cut < 60) cut = 120;
      return { head: content.slice(0, cut) + '…', excerpt: '…' + content.slice(cut).trim() };
    }

    function memoryFacetList(dim) {
      var f = state.memories.facets;
      var key = dim === 'project' ? 'projects' : dim === 'agent' ? 'agents' : 'types';
      if (f && f[key]) return f[key];
      var counts = {};
      entityList('memory').forEach(function(x) {
        if (!x || x.isLatest === false) return;
        var v = dim === 'project' ? x.project : dim === 'agent' ? x.agentId : x.type;
        if (v) counts[v] = (counts[v] || 0) + 1;
      });
      return Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a] || a.localeCompare(b); }).map(function(v) { return { value: v, count: counts[v] }; });
    }

    function adjustMemoryFacets(prev, next) {
      var f = state.memories.facets;
      if (!f) return;
      function bump(row, delta) {
        if (!row || row.isLatest === false) return;
        [['projects', row.project], ['agents', row.agentId], ['types', row.type]].forEach(function(pair) {
          if (!pair[1] || !f[pair[0]]) return;
          var list = f[pair[0]];
          var item = list.filter(function(x) { return x.value === pair[1]; })[0];
          if (!item) { if (delta < 0) return; item = { value: pair[1], count: 0 }; list.push(item); }
          item.count = Math.max(0, item.count + delta);
        });
      }
      bump(prev, -1);
      bump(next, 1);
    }

    function noteMemoryChange(prev, next, id) {
      var m = state.memories;
      adjustMemoryFacets(prev, next);
      if (m.query && typeof m.query.total === 'number') {
        m.query.total += (memoryMatchesFilters(next) ? 1 : 0) - (memoryMatchesFilters(prev) ? 1 : 0);
      }
      if (!next && m.checked[id]) delete m.checked[id];
      if (next && next.isLatest === false && m.checked[id]) delete m.checked[id];
      if (next && m.pendingId && next.id === m.pendingId) m.pendingId = null;
    }

    var memorySearchSeq = 0;
    async function runMemorySearch(q) {
      var query = String(q || '').trim();
      state.memories.search = q;
      var seq = ++memorySearchSeq;
      if (!query) {
        state.memories.searchIds = null;
        state.memories.searchMode = '';
        state.memories.searching = false;
        applyMemoryFilters();
        return;
      }
      state.memories.searching = true;
      renderMemories();
      var res = await apiGet(memoryQueryPath('&q=' + encodeURIComponent(query)));
      if (seq !== memorySearchSeq) return;
      state.memories.searching = false;
      if (!res) {
        state.memories.searchIds = [];
        state.memories.searchMode = 'failed';
      } else {
        var rows = res.memories || [];
        mergeMemoryRows(rows);
        state.memories.searchIds = rows.map(function(r) { return r.id; });
        state.memories.searchMode = (res.search && res.search.mode) || 'keyword';
      }
      renderMemories();
    }

    var memoryFilterSeq = 0;
    async function applyMemoryFilters() {
      var m = state.memories;
      m.checked = {};
      if (String(m.search || '').trim()) {
        runMemorySearch(m.search);
        return;
      }
      var seq = ++memoryFilterSeq;
      if (!memoryFiltersActive()) {
        m.query = null;
        renderMemories();
        return;
      }
      m.query = { loading: true, total: null, nextCursor: null };
      renderMemories();
      var res = await apiGet(memoryQueryPath());
      if (seq !== memoryFilterSeq) return;
      if (res) {
        mergeMemoryRows(res.memories);
        m.query = { loading: false, total: typeof res.total === 'number' ? res.total : null, nextCursor: res.nextCursor || null };
      } else {
        m.query = { loading: false, failed: true, total: null, nextCursor: null };
      }
      renderMemories();
    }

    function setMemoryFilter(dim, value) {
      var m = state.memories;
      if (dim === 'project') m.projectFilter = value;
      else if (dim === 'agent') m.agentFilter = value;
      else if (dim === 'type') m.typeFilter = value;
      applyMemoryFilters();
    }

    function clearMemoryFilters() {
      var m = state.memories;
      m.projectFilter = '';
      m.agentFilter = '';
      m.typeFilter = '';
      m.search = '';
      m.searchIds = null;
      m.searchMode = '';
      m.searching = false;
      memorySearchSeq++;
      var input = document.getElementById('mem-search');
      if (input) input.value = '';
      applyMemoryFilters();
    }

    async function loadMoreMemories() {
      var m = state.memories;
      var cursor = m.query ? m.query.nextCursor : m.nextCursor;
      if (!cursor || m.loadingMore) return;
      m.loadingMore = true;
      renderMemories();
      var res = await apiGet(memoryQueryPath('&cursor=' + encodeURIComponent(cursor)));
      m.loadingMore = false;
      if (res) {
        mergeMemoryRows(res.memories);
        if (m.query) m.query.nextCursor = res.nextCursor || null;
        else m.nextCursor = res.nextCursor || null;
      }
      renderMemories();
    }

    async function fetchMemoryVersion(id) {
      var m = state.memories;
      if (!id || m.fetches[id]) return;
      m.fetches[id] = 'loading';
      var res = await apiGet('memories/' + encodeURIComponent(id));
      if (res && res.memory) {
        mergeMemoryRows([res.memory]);
        m.fetches[id] = 'done';
      } else {
        m.fetches[id] = 'missing';
      }
      if (state.activeTab === 'memories') renderMemories();
    }

    function renderMemories() {
      var el = document.getElementById('view-memories');
      var m = state.memories;
      if (!el.querySelector('#memory-list')) {
        el.innerHTML = '<div class="inline-note"><strong>Memories</strong> ' + help('memory') + ' are durable facts, architecture notes, conventions and preferences agents keep across sessions. Saving a near-duplicate, or editing one here, creates a new version ' + help('version') + ' and keeps the old one as history. Click a row for provenance, versions, edits and copy actions. Longer-lived facts and procedures are distilled from sessions by <a class="empty-link" href="#health/consolidation">consolidation &rarr;</a></div>' +
          '<div id="memory-toolbar"></div><div class="memories-layout"><div id="memory-list"></div><div id="memory-detail"></div></div>';
        el.__renderedHtml = null;
      }
      var focus = captureSearchFocus(['mem-search']);
      setViewHtml(document.getElementById('memory-toolbar'), memoryToolbarHtml());
      bindMemoryToolbar();
      restoreSearchFocus(focus);
      var layout = el.querySelector('.memories-layout');
      if (!store.loaded.memory) {
        layout.classList.remove('has-detail');
        setViewHtml(document.getElementById('memory-list'), skeleton(10));
        setViewHtml(document.getElementById('memory-detail'), '');
        return;
      }
      setViewHtml(document.getElementById('memory-list'), memoryListHtml());
      renderMemoryDetailPanel();
      layout.classList.toggle('has-detail', !!document.getElementById('memory-detail').firstElementChild);
    }

    function memoryFilterSelect(dim, allLabel, current) {
      var list = memoryFacetList(dim).slice();
      if (dim === 'type') {
        MEMORY_TYPES.forEach(function(t) {
          if (!list.some(function(x) { return x.value === t; })) list.push({ value: t, count: 0 });
        });
      }
      if (current && !list.some(function(x) { return x.value === current; })) list.unshift({ value: current, count: 0 });
      var none = list.length === 0;
      var html = '<select id="mem-' + dim + '-filter" data-dim="' + dim + '" aria-label="Filter by ' + dim + '"' + (none ? ' disabled title="No memory has a' + (dim === 'agent' ? 'n agent id' : ' ' + dim) + ' yet"' : '') + '>';
      html += '<option value="">' + esc(none ? 'No ' + dim + 's' : allLabel) + '</option>';
      list.forEach(function(x) {
        var label = dim === 'project' ? String(x.value).split('/').pop() : x.value;
        html += '<option value="' + esc(x.value) + '"' + (current === x.value ? ' selected' : '') + '>' + esc(label) + ' (' + fmtNum(x.count) + ')</option>';
      });
      return html + '</select>';
    }

    function memoryToolbarHtml() {
      var m = state.memories;
      var html = '<div class="toolbar mem-filters">';
      html += '<input type="search" id="mem-search" placeholder="Search memories by meaning or keyword (press /)" value="' + esc(m.search) + '" aria-label="Search memories">';
      html += memoryFilterSelect('project', 'All projects', m.projectFilter);
      html += memoryFilterSelect('agent', 'All agents', m.agentFilter);
      html += memoryFilterSelect('type', 'All types', m.typeFilter);
      return html + '</div>';
    }

    function memoryFilterDescription() {
      var m = state.memories;
      var parts = [];
      if (String(m.search || '').trim()) parts.push('the search &ldquo;' + esc(m.search) + '&rdquo;');
      if (m.projectFilter) parts.push('project <b>' + esc(m.projectFilter) + '</b>');
      if (m.agentFilter) parts.push('agent <b>' + esc(m.agentFilter) + '</b>');
      if (m.typeFilter) parts.push('type <b>' + esc(m.typeFilter) + '</b>');
      return parts.join(', ');
    }

    function memoryRowHtml(mem) {
      var m = state.memories;
      var hl = memoryHeadline(mem);
      var selected = m.selectedId === mem.id;
      var checked = !!m.checked[mem.id];
      var score = strengthScore(mem);
      var barColor = score >= 7 ? 'var(--green)' : score >= 4 ? 'var(--yellow)' : 'var(--red)';
      var version = mem.version || 1;
      var html = '<tr class="memory-row' + (selected ? ' selected' : '') + (checked ? ' checked' : '') + '" data-action="select-memory" data-memory-id="' + esc(mem.id) + '" role="button" tabindex="0" aria-expanded="' + (selected ? 'true' : 'false') + '" style="cursor:pointer;">';
      html += '<td class="mem-check"><input type="checkbox" data-action="mem-check" data-memory-id="' + esc(mem.id) + '" aria-label="Select this memory"' + (checked ? ' checked' : '') + '></td>';
      html += '<td style="max-width:0;width:100%;"><div class="mem-head clamp-2">' + esc(hl.head) + '</div>';
      if (hl.excerpt) html += '<div class="mem-excerpt">' + esc(hl.excerpt) + '</div>';
      html += '<div class="mem-chips">';
      if (mem.project) html += '<button type="button" class="mem-chip' + (m.projectFilter === mem.project ? ' on' : '') + '" data-action="mem-filter" data-dim="project" data-value="' + esc(mem.project) + '" title="Show only project ' + esc(mem.project) + '">' + esc(String(mem.project).split('/').pop()) + '</button>';
      if (mem.agentId) html += '<button type="button" class="mem-chip' + (m.agentFilter === mem.agentId ? ' on' : '') + '" data-action="mem-filter" data-dim="agent" data-value="' + esc(mem.agentId) + '" title="Show only memories written by agent ' + esc(mem.agentId) + '">@' + esc(mem.agentId) + '</button>';
      if (version > 1) html += '<span class="ver-badge" title="Version ' + version + ': ' + (version - 1) + ' earlier version' + (version === 2 ? '' : 's') + ' kept as history">v' + version + '</span>';
      (mem.concepts || []).slice(0, 3).forEach(function(cn) { html += '<span class="tag">' + esc(cn) + '</span>'; });
      html += '<span class="mob-only">' + score + '/10 · ' + esc(timeAgo(mem.updatedAt || mem.createdAt)) + '</span>';
      html += '</div></td>';
      html += '<td><span class="badge ' + (TYPE_BADGES[mem.type] || 'badge-muted') + '">' + esc(mem.type) + '</span></td>';
      html += '<td class="col-opt" style="white-space:nowrap;" title="Strength ' + score + ' of 10"><div class="strength-bar"><div class="fill" style="width:' + (score * 10) + '%;background:' + barColor + '"></div></div> <span class="strength-num">' + score + '/10</span></td>';
      html += '<td class="col-opt">' + relTime(mem.updatedAt || mem.createdAt) + '</td>';
      return html + '</tr>';
    }

    function memoryListHtml() {
      var m = state.memories;
      var c = store.counts || {};
      var rows = memoryRows();
      var filtered = memoryFiltersActive();
      var searching = !!m.searchIds || m.searching;
      var html = '';
      if (searching || filtered) {
        var summary;
        if (searching) {
          summary = m.searching ? 'Searching…' : fmtNum(rows.length) + ' result' + (rows.length === 1 ? '' : 's') + ' · ' + (m.searchMode === 'hybrid' ? 'meaning + keyword search' : m.searchMode === 'failed' ? 'search failed, try again' : 'keyword search (no embeddings configured)');
        } else if (m.query && m.query.loading) {
          summary = 'Filtering on the server…';
        } else if (m.query && m.query.failed) {
          summary = 'The filter request failed. Change a filter to retry.';
        } else {
          var total = m.query && typeof m.query.total === 'number' ? m.query.total : rows.length;
          summary = fmtNum(total) + ' matching memor' + (total === 1 ? 'y' : 'ies');
        }
        html += '<div class="mem-filter-note"><span>' + summary + ' for ' + memoryFilterDescription() + '</span><button type="button" class="btn" data-action="mem-clear-filters">Clear all</button></div>';
      }
      var checkedIds = Object.keys(m.checked);
      if (checkedIds.length > 0) {
        html += '<div class="bulk-bar" role="region" aria-label="Bulk actions"><span class="bulk-count">' + fmtNum(checkedIds.length) + ' selected</span>' +
          '<button type="button" class="btn" data-action="mem-export">Export JSON</button>' +
          '<button type="button" class="btn btn-danger" data-action="mem-bulk-forget">Forget ' + fmtNum(checkedIds.length) + '…</button>' +
          '<button type="button" class="btn" data-action="mem-uncheck-all">Clear selection</button></div>';
      }

      if (rows.length === 0) {
        if ((m.query && m.query.loading) || m.searching) return html + skeleton(6);
        if (searching || filtered) {
          var q = String(m.search || '').trim();
          html += emptyState({
            icon: '&#128269;',
            title: 'No memories match',
            what: 'This list shows the latest version of every memory that matches the search box and the project, agent and type filters. Filters and search run on the server over all memories, not only the loaded page.',
            why: 'No latest memory matches ' + memoryFilterDescription() + '.',
            steps: [
              { label: 'Run the same query from a terminal:', cmd: curlGet(memoryQueryPath(q ? '&q=' + encodeURIComponent(q) : '').replace('limit=100', 'limit=20')) },
              { label: 'Or save a memory that matches:', cmd: curlPost('remember', { content: q || 'Describe the fact to keep', type: m.typeFilter || 'fact', project: m.projectFilter || undefined, agentId: m.agentFilter || undefined }) }
            ]
          });
          html += '<div style="margin-top:10px;"><button type="button" class="btn" data-action="mem-clear-filters">Clear search and filters</button></div>';
          return html;
        }
        return html + emptyState({
          icon: '&#128218;',
          title: 'No memories yet',
          what: 'Memories are distilled facts agentmemory keeps across sessions: file locations, architecture decisions, conventions, user preferences. Agents recall them at the start of every session.',
          why: 'No agent has saved one yet. Hooks save them during coding sessions once an agent runs with agentmemory.',
          steps: [
            { label: 'From an agent, call the MCP function:', cmd: 'memory_save { "content": "src/middleware/auth.ts validates JWTs with jose", "type": "architecture" }' },
            { label: 'Or from a terminal:', cmd: curlPost('remember', { content: 'src/middleware/auth.ts validates JWTs with jose', type: 'architecture' }) }
          ],
          link: { href: 'https://github.com/rohitg00/agentmemory#memories', text: 'Memory types' }
        });
      }

      var allChecked = rows.every(function(r) { return !!m.checked[r.id]; });
      html += '<div class="table-wrap"><table class="mem-table"><tr><th class="mem-check"><input type="checkbox" data-action="mem-check-all" aria-label="Select all shown memories"' + (allChecked ? ' checked' : '') + '></th><th>Memory</th><th>Type</th><th class="col-opt">Strength ' + help('strength') + '</th><th class="col-opt">Updated</th></tr>';
      rows.forEach(function(mem) { html += memoryRowHtml(mem); });
      html += '</table></div>';

      if (!searching) {
        var shownTotal = m.query ? m.query.total : c.latestMemories;
        var cursor = m.query ? m.query.nextCursor : m.nextCursor;
        html += '<div class="load-more">Showing ' + fmtNum(rows.length) + (typeof shownTotal === 'number' ? ' of ' + fmtNum(Math.max(shownTotal, rows.length)) : '') + (filtered ? ' matching' : ' latest') + ' memories';
        if (cursor) html += '<button class="btn" data-action="memories-load-more"' + (m.loadingMore ? ' disabled' : '') + '>' + (m.loadingMore ? 'Loading…' : 'Load 100 more') + '</button>';
        html += '</div>';
      }
      if (!filtered && !searching && rows.length < 12) html += usageCard('memory');
      return html;
    }

    function memoryCloseBtn() {
      return '<button type="button" class="icon-btn icon-close" data-action="mem-close" aria-label="Close memory details">close</button>';
    }

    function renderMemoryDetailPanel() {
      var panel = document.getElementById('memory-detail');
      if (!panel) return;
      var m = state.memories;
      var id = m.selectedId;
      if (!id) { setViewHtml(panel, ''); return; }
      var e = m.editing;
      if (e && e.id === id && panel.querySelector('#mem-edit-text') && panel.__editRev === e.rev) return;
      var mem = store.entities.memory[id];
      if (!mem) {
        if (m.pendingId === id) {
          setViewHtml(panel, '<div class="detail-panel mem-detail"><div class="mem-detail-head"><span>Saving the new version</span>' + memoryCloseBtn() + '</div><div class="mem-note">Saved. Waiting for the new version to arrive on the live stream…</div>' + skeleton(4) + '</div>');
          return;
        }
        if (!m.fetches[id]) fetchMemoryVersion(id);
        if (m.fetches[id] === 'missing') {
          setViewHtml(panel, '<div class="detail-panel mem-detail"><div class="mem-detail-head"><span>Memory</span>' + memoryCloseBtn() + '</div>' + emptyState({
            compact: true,
            icon: '&#128269;',
            title: 'Memory not found',
            what: 'Memory links anywhere in the viewer open this panel by id.',
            why: 'No memory has the id <code>' + esc(id) + '</code>. It was forgotten, or the link comes from another install.',
            steps: [{ label: 'Check from a terminal:', cmd: curlGet('memories/' + encodeURIComponent(id)) }]
          }) + '</div>');
          return;
        }
        setViewHtml(panel, '<div class="detail-panel mem-detail"><div class="mem-detail-head"><span>Loading memory ' + esc(shortId(id)) + '…</span>' + memoryCloseBtn() + '</div>' + skeleton(5) + '</div>');
        return;
      }
      setViewHtml(panel, renderMemoryDetail(mem));
      if (e && e.id === id) {
        panel.__editRev = e.rev;
        var ta = document.getElementById('mem-edit-text');
        var typeSel = document.getElementById('mem-edit-type');
        if (ta) ta.addEventListener('input', function() { e.content = ta.value; });
        if (typeSel) typeSel.addEventListener('change', function() { e.type = typeSel.value; });
      }
    }

    function memoryChain(mem) {
      var seen = {};
      seen[mem.id] = true;
      var older = [];
      var missing = '';
      var cur = mem;
      for (var i = 0; i < 50; i++) {
        var pid = memoryParentId(cur);
        if (!pid || seen[pid]) break;
        seen[pid] = true;
        var parent = store.entities.memory[pid];
        if (!parent) { missing = pid; break; }
        older.push(parent);
        cur = parent;
      }
      var all = entityList('memory');
      var newer = [];
      cur = mem;
      for (var j = 0; j < 50; j++) {
        var child = null;
        for (var k = 0; k < all.length; k++) {
          if (all[k] && !seen[all[k].id] && memoryParentId(all[k]) === cur.id) { child = all[k]; break; }
        }
        if (!child) break;
        seen[child.id] = true;
        newer.unshift(child);
        cur = child;
      }
      return { versions: newer.concat([mem], older), older: older, missing: missing };
    }

    function diffWordsHtml(before, after) {
      var a = String(before || '').split(/(\s+)/).filter(Boolean);
      var b = String(after || '').split(/(\s+)/).filter(Boolean);
      var n = a.length;
      var w = b.length;
      if (n * w > 4000000) return null;
      var dp = [];
      for (var i = 0; i <= n; i++) dp.push(new Uint32Array(w + 1));
      for (i = n - 1; i >= 0; i--) {
        for (var j = w - 1; j >= 0; j--) {
          dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }
      var ops = [];
      function push(op, tok) {
        var last = ops[ops.length - 1];
        if (last && last.op === op) last.text += tok;
        else ops.push({ op: op, text: tok });
      }
      i = 0;
      j = 0;
      while (i < n && j < w) {
        if (a[i] === b[j]) { push('=', a[i]); i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) { push('-', a[i]); i++; }
        else { push('+', b[j]); j++; }
      }
      while (i < n) push('-', a[i++]);
      while (j < w) push('+', b[j++]);
      var added = 0;
      var removed = 0;
      var html = ops.map(function(o) {
        var words = o.text.trim() ? o.text.trim().split(/\s+/).length : 0;
        if (o.op === '+') { added += words; return '<ins>' + esc(o.text) + '</ins>'; }
        if (o.op === '-') { removed += words; return '<del>' + esc(o.text) + '</del>'; }
        return esc(o.text);
      }).join('');
      return { html: html, added: added, removed: removed };
    }

    function memoryDiffHtml(prev, next) {
      var diff = diffWordsHtml(prev.content, next.content);
      var html = '';
      if (prev.type !== next.type) html += '<div class="mem-diff-sum">Type changed: <b>' + esc(prev.type) + '</b> &rarr; <b>' + esc(next.type) + '</b></div>';
      if (!diff) return html + '<div class="mem-diff">' + esc(next.content || '') + '</div><div class="mem-diff-sum">Too long to compare word by word; showing the new text.</div>';
      if (!diff.added && !diff.removed) return html + '<div class="mem-diff-sum">The text did not change.</div>';
      return html + '<div class="mem-diff">' + diff.html + '</div><div class="mem-diff-sum">+' + fmtNum(diff.added) + ' word' + (diff.added === 1 ? '' : 's') + ' added, &minus;' + fmtNum(diff.removed) + ' removed</div>';
    }

    function memoryVersionsHtml(mem, chain) {
      var m = state.memories;
      var versions = chain.versions;
      if (chain.missing && !m.fetches[chain.missing]) fetchMemoryVersion(chain.missing);
      var html = '<div class="mem-section"><div class="mem-section-title">Versions ' + help('version') + '</div>';
      if (versions.length === 1 && !chain.missing) {
        return html + '<div class="empty-step-label">Only one version so far. Editing it here, or saving a near-duplicate with memory_save, creates v' + ((mem.version || 1) + 1) + ' and keeps this text as history.</div></div>';
      }
      var diffable = versions.filter(function(v, idx) { return idx < versions.length - 1 && memoryParentId(v) === versions[idx + 1].id; });
      var diffId = m.diffId && diffable.some(function(v) { return v.id === m.diffId; }) ? m.diffId : (diffable.some(function(v) { return v.id === mem.id; }) ? mem.id : (diffable[0] && diffable[0].id));
      html += '<ul class="ver-list">';
      versions.forEach(function(v) {
        var canDiff = diffable.indexOf(v) >= 0;
        html += '<li class="ver-item' + (v.id === mem.id ? ' current' : '') + '"><span class="ver-badge">v' + (v.version || 1) + '</span>';
        html += '<a href="#memories/' + encodeURIComponent(v.id) + '" title="Open version ' + (v.version || 1) + ' (' + esc(v.id) + ')"><span class="ver-text">' + esc(memoryHeadline(v).head) + '</span></a>';
        html += '<span class="ver-tools">' + relTime(v.createdAt) + (v.isLatest !== false ? ' <span class="badge badge-green">latest</span>' : '');
        if (canDiff) html += ' <button type="button" class="linkish" data-action="mem-diff" data-memory-id="' + esc(v.id) + '" aria-pressed="' + (v.id === diffId ? 'true' : 'false') + '" title="Compare with the version before it">changes</button>';
        html += '</span></li>';
      });
      if (chain.missing) {
        html += '<li class="ver-item"><span class="ver-badge">…</span><span class="ver-text">' + (m.fetches[chain.missing] === 'missing' ? 'An older version (' + esc(shortId(chain.missing)) + ') was forgotten.' : 'Loading older versions…') + '</span><span></span></li>';
      }
      html += '</ul>';
      if (diffId) {
        var idx = -1;
        versions.forEach(function(v, i) { if (v.id === diffId) idx = i; });
        var next = versions[idx];
        var prev = versions[idx + 1];
        html += '<div class="mem-section-title" style="margin-top:10px;">Changes from v' + (prev.version || 1) + ' to v' + (next.version || 1) + ' ' + help('diff') + '</div>' + memoryDiffHtml(prev, next);
      }
      return html + '</div>';
    }

    var obsLocations = {};

      html += '<dt>Strength ' + help('strength') + '</dt><dd>' + score + ' of 10</dd>';

      if (mem.forgetAfter) html += '<dt>Expires</dt><dd>' + relTime(mem.forgetAfter) + ' <span style="color:var(--ink-faint);">(' + esc(formatTime(mem.forgetAfter)) + ')</span></dd>';
      if (mem.files && mem.files.length) html += '<dt>Files</dt><dd class="tag-list" style="margin:0;">' + mem.files.slice(0, 12).map(function(f) { return '<span class="tag file-tag" title="' + esc(f) + '">' + esc(String(f).split('/').pop()) + '</span>'; }).join('') + '</dd>';
      if (mem.concepts && mem.concepts.length) html += '<dt>Concepts</dt><dd class="tag-list" style="margin:0;">' + mem.concepts.slice(0, 12).map(function(cn) { return '<span class="tag">' + esc(cn) + '</span>'; }).join('') + '</dd>';

    var modalReturnFocus = null;
    function openModal(html, focusSelector) {
      var modal = document.getElementById('modal');
      var overlay = document.getElementById('modal-overlay');
      if (!overlay.classList.contains('open')) modalReturnFocus = document.activeElement;
      modal.innerHTML = html;
      var title = modal.querySelector('h3');
      if (title) {
        title.id = 'modal-title';
        modal.setAttribute('aria-labelledby', 'modal-title');
      } else {
        modal.removeAttribute('aria-labelledby');
      }
      overlay.classList.add('open');
      var focusEl = modal.querySelector(focusSelector || '[data-action="close-modal"]');
      if (focusEl) focusEl.focus();
    }

    function modalFocusables() {
      var modal = document.getElementById('modal');
      return Array.prototype.slice.call(modal.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), summary, [tabindex]:not([tabindex="-1"])')).filter(function(el) { return el.offsetParent !== null; });
    }

    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Tab' || !document.getElementById('modal-overlay').classList.contains('open')) return;
      var items = modalFocusables();
      if (!items.length) { e.preventDefault(); return; }
      var first = items[0];
      var last = items[items.length - 1];
      var inside = document.getElementById('modal').contains(document.activeElement);
      if (e.shiftKey && (document.activeElement === first || !inside)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (document.activeElement === last || !inside)) { e.preventDefault(); first.focus(); }
    });

    function startMemoryEdit(id) {
      var mem = store.entities.memory[id];
      if (!mem) return;
      var m = state.memories;
      m.error = '';

      renderMemories();
      var ta = document.getElementById('mem-edit-text');
      if (ta) ta.focus();
    }

    function reviewMemoryEdit() {
      var m = state.memories;
      var e = m.editing;
      var mem = e && store.entities.memory[e.id];
      if (!mem) return;
      var ta = document.getElementById('mem-edit-text');
      var typeSel = document.getElementById('mem-edit-type');
      if (ta) e.content = ta.value;
      if (typeSel) e.type = typeSel.value;
      if (!e.content.trim()) {
        m.error = 'The memory text cannot be empty. Use Forget to delete a memory.';
        e.rev++;
        renderMemories();
        return;
      }
      if (e.content === mem.content && e.type === mem.type) {
        m.error = 'Nothing changed yet. Edit the text or the type, or press Cancel.';
        e.rev++;
        renderMemories();
        return;
      }
      var version = mem.version || 1;
      openModal('<h3>Save as version ' + (version + 1) + '?</h3>' +
        '<p>agentmemory keeps v' + version + ' as history and removes it from search. Agents recall v' + (version + 1) + ' from now on. This is the same call as <code>POST /agentmemory/evolve</code>.</p>' +
        memoryDiffHtml(mem, { content: e.content, type: e.type }) +
        '<div class="modal-actions" style="margin-top:14px;"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="mem-confirm-edit">Save v' + (version + 1) + '</button></div>', '[data-action="mem-confirm-edit"]');
    }

      m.saving = true;
      m.error = '';

      var res = await api('evolve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), readErrorBody: true });

        ids.forEach(function(id) { delete m.checked[id]; });
