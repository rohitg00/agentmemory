    function sourceItemHtml(id) {
      var kind = idKind(id);
      var text = '';
      if (kind === 'session') {
        var s = store.entities.session[id];
        text = s ? sessionDisplayName(s) + (s.firstPrompt ? ': ' + s.firstPrompt : '') : '';
      } else if (kind === 'memory') {
        var m = store.entities.memory[id];
        text = m ? memoryHeadline(m).head : '';
      } else if (kind === 'crystal') {
        var c = store.entities.crystal[id];
        text = c ? c.narrative || '' : '';
      } else if (kind === 'action') {
        var a = store.entities.action[id];
        text = a ? a.title || '' : '';
      }
      return '<li><span class="kind-tag">' + esc(ID_KIND_LABELS[kind] || 'record') + '</span>' + anyIdChip(id) + (text ? '<span class="src-text" title="' + esc(text) + '">' + esc(text) + '</span>' : '') + '</li>';
    }

    function lessonRows() {
      var l = state.lessons;
      var search = String(l.search || '').trim().toLowerCase();
      return sortByTimeDesc(entityList('lesson').filter(function(x) {
        if (!x || x.deleted === true) return false;
        if (l.projectFilter && (x.project || '') !== l.projectFilter) return false;
        if (search && (String(x.content || '') + ' ' + String(x.context || '') + ' ' + asTags(x.tags).join(' ')).toLowerCase().indexOf(search) < 0) return false;
        return true;
      }), ['updatedAt', 'createdAt']);
    }

    function lessonToolbarHtml(total) {
      var l = state.lessons;
      var projects = {};
      entityList('lesson').forEach(function(x) { if (x && !x.deleted) projects[x.project || ''] = (projects[x.project || ''] || 0) + 1; });
      var html = '<div class="toolbar mem-filters">';
      html += '<input id="lessons-search" type="search" placeholder="Filter lessons by text, reason or tag (press /)" value="' + esc(l.search) + '" aria-label="Filter lessons">';
      html += '<select id="lessons-project" aria-label="Filter lessons by project"><option value="">All projects</option>';
      Object.keys(projects).sort().forEach(function(p) {
        html += '<option value="' + esc(p) + '"' + (l.projectFilter === p && p ? ' selected' : '') + (p ? '' : ' disabled') + '>' + esc(p || 'no project') + ' (' + projects[p] + ')</option>';
      });
      html += '</select><span class="tb-count">' + fmtNum(total) + ' lesson' + (total === 1 ? '' : 's') + '</span>';
      return html + '</div>';
    }

    function lessonRowHtml(x) {
      var pct = Math.round((x.confidence || 0) * 100);
      var selected = state.lessons.selectedId === x.id;
      var html = '<tr class="lesson-row' + (selected ? ' row-select' : '') + (isFresh(x.id) ? ' fresh' : '') + '" data-action="select-lesson" data-lesson-id="' + esc(x.id) + '" role="button" tabindex="0" aria-expanded="' + (selected ? 'true' : 'false') + '" style="cursor:pointer;">';
      html += '<td style="max-width:0;width:100%;"><div class="mem-head clamp-2">' + esc(x.content) + '</div>' + (x.context ? '<div class="mem-excerpt">' + esc(x.context) + '</div>' : '');
      html += '<div class="mem-chips">' + (x.project ? '<span class="mem-chip" style="cursor:default;">' + esc(x.project) + '</span>' : '') + '<span class="badge badge-' + (x.source === 'crystal' ? 'purple' : x.source === 'consolidation' ? 'yellow' : 'blue') + '">' + esc(x.source || 'manual') + '</span>' + ((x.sourceIds || []).length ? '<span>' + x.sourceIds.length + ' source' + (x.sourceIds.length === 1 ? '' : 's') + '</span>' : '') + '<span class="mob-only">' + pct + '% · ' + (x.reinforcements || 0) + ' uses</span></div></td>';
      html += '<td class="col-opt" style="white-space:nowrap;" title="Confidence ' + pct + '%"><div class="strength-bar"><div class="fill" style="width:' + pct + '%;background:' + confColor(pct) + '"></div></div> <span class="strength-num">' + pct + '%</span></td>';
      html += '<td class="col-opt" style="text-align:center;font-family:var(--font-mono);font-size:12px;">' + (x.reinforcements || 0) + '</td>';
      html += '<td class="col-opt">' + relTime(x.updatedAt || x.createdAt) + '</td>';
      return html + '</tr>';
    }

    function lessonDetailHtml(x) {
      var pct = Math.round((x.confidence || 0) * 100);
      var html = '<div class="detail-panel mem-detail" data-detail-id="' + esc(x.id) + '">';
      html += '<div class="mem-detail-head"><span class="badge badge-' + (x.source === 'crystal' ? 'purple' : x.source === 'consolidation' ? 'yellow' : 'blue') + '">' + esc(x.source || 'manual') + '</span><span>lesson</span><span>· learned ' + relTime(x.createdAt) + '</span><button type="button" class="icon-btn icon-close" data-action="lesson-close" aria-label="Close lesson details">close</button></div>';
      html += '<div class="mem-detail-content">' + esc(x.content) + '</div>';
      if (state.lessons.notice && state.lessons.notice.id === x.id) html += '<div class="mem-note' + (state.lessons.notice.err ? ' err' : '') + '" role="status">' + state.lessons.notice.html + '</div>';
      html += '<div class="mem-actions">';
      html += '<button type="button" class="btn" data-action="lesson-strengthen" data-lesson-id="' + esc(x.id) + '"' + (state.lessons.busy === x.id ? ' disabled' : '') + ' title="Record one more use: confidence rises and the decay clock restarts">' + (state.lessons.busy === x.id ? 'Saving…' : 'Strengthen') + '</button>';
      html += copyBtn(x.id, 'lesson id').replace('>copy<', '>copy id<');
      html += copyBtn('memory_lesson_recall { "query": ' + JSON.stringify(String(x.content || '').slice(0, 60)) + ' }', 'MCP recall call').replace('>copy<', '>copy MCP call<');
      html += copyBtn(curlPost('lessons/search', { query: String(x.content || '').slice(0, 60) }), 'curl command').replace('>copy<', '>copy curl<');
      html += '<button type="button" class="btn btn-danger" data-action="lesson-delete" data-lesson-id="' + esc(x.id) + '">Delete…</button>';
      html += '</div>';
      html += '<div class="mem-section"><div class="mem-section-title">Details</div><dl class="mem-meta">';
      if (x.context) html += '<dt>Why learned</dt><dd>' + esc(x.context) + '</dd>';
      html += '<dt>Confidence ' + help('confidence') + '</dt><dd><span class="conf-line"><span class="hbar' + (pct < 40 ? ' bad' : pct < 70 ? ' warn' : '') + '"><span style="width:' + pct + '%"></span></span><b>' + pct + '%</b></span></dd>';
      html += '<dt>Uses ' + help('reinforcements') + '</dt><dd>' + fmtNum(x.reinforcements || 0) + (x.lastReinforcedAt ? ', last ' + relTime(x.lastReinforcedAt) : ', never confirmed again yet') + '</dd>';
      var baseline = x.lastDecayedAt || x.lastReinforcedAt || x.createdAt;
      var weeks = baseline ? (Date.now() - new Date(baseline).getTime()) / (7 * 86400000) : 0;
      var rate = typeof x.decayRate === 'number' ? x.decayRate : 0.05;
      var daysLeft = Math.max(1, Math.ceil((1 - weeks) * 7));
      var points = Math.round(rate * 100);
      html += '<dt>Decay ' + help('decay') + '</dt><dd>' + (weeks < 1
        ? 'Starts in ' + daysLeft + ' day' + (daysLeft === 1 ? '' : 's') + ' if it stays unused, then &minus;' + points + ' points a week.'
        : 'Unused for ' + Math.floor(weeks) + ' week' + (Math.floor(weeks) === 1 ? '' : 's') + '; loses ' + points + ' points a week until an agent uses it again.') + '</dd>';
      html += '<dt>Project ' + help('project') + '</dt><dd>' + (x.project ? esc(x.project) : '<span style="color:var(--ink-faint);">all projects</span>') + '</dd>';
      if (asTags(x.tags).length) html += '<dt>Tags</dt><dd class="tag-list" style="margin:0;">' + asTags(x.tags).map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</dd>';
      html += '<dt>Id</dt><dd>' + idChip('lesson', x.id) + '</dd>';
      html += '<dt>Updated</dt><dd>' + relTime(x.updatedAt || x.createdAt) + '</dd>';
      html += '</dl></div>';
      var src = x.sourceIds || [];
      html += '<div class="mem-section"><div class="mem-section-title">Sources ' + help('lessonSources') + '</div>';
      if (!src.length) {
        html += '<div class="empty-step-label">No sources recorded. This lesson was saved by hand without <code>sourceIds</code>. Link it to the session or memory it came from by saving it again with them; the lesson is strengthened and the sources are added:</div>' + cmdBlock(curlPost('lessons', { content: x.content, sourceIds: ['ses_...', 'mem_...'] }));
      } else {
        var obs = src.filter(function(id) { return idKind(id) === 'observation'; });
        if (obs.length) locateObservations(obs);
        html += '<ul class="src-list">' + src.slice(0, 30).map(sourceItemHtml).join('') + '</ul>' + (src.length > 30 ? '<div class="ses-foot">+' + (src.length - 30) + ' more</div>' : '');
      }
      html += '</div>';
      html += '<details style="margin-top:12px;"><summary style="cursor:pointer;font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);">raw record</summary><pre class="gd-raw">' + esc(JSON.stringify(x, null, 2)) + '</pre></details>';
      return html + '</div>';
    }

    function renderLessons() {
      var el = document.getElementById('view-lessons');
      var l = state.lessons;
      if (!store.loaded.lesson) {
        listDetailShell(el, 'lessons', '');
        setViewHtml(document.getElementById('lessons-list'), skeleton(8));
        return;
      }
      var all = entityList('lesson').filter(function(x) { return x && x.deleted !== true; });
      var rows = lessonRows();
      listDetailShell(el, 'lessons', all.length ? '<div class="inline-note"><strong>Lessons</strong> ' + help('lesson') + ' are short rules learned from past work. Confidence ' + help('confidence') + ' rises each time an agent uses a lesson and decays when it goes unused; uses ' + help('reinforcements') + ' counts those confirmations. Pick a row for its sources and actions.</div>' : '');
      var focus = captureSearchFocus(['lessons-search']);
      setViewHtml(document.getElementById('lessons-toolbar'), all.length ? lessonToolbarHtml(rows.length) : '');
      var input = document.getElementById('lessons-search');
      if (input && !input.__bound) {
        input.__bound = true;
        bindImeSafeSearch(input, 200, function(v) { state.lessons.search = v; renderLessons(); });
      }
      var proj = document.getElementById('lessons-project');
      if (proj && !proj.__bound) {
        proj.__bound = true;
        proj.addEventListener('change', function() { state.lessons.projectFilter = this.value; renderLessons(); });
      }
      restoreSearchFocus(focus);
      var html = '';
      if (!all.length) {
        html = emptyState({
          icon: '&#128161;',
          title: 'No lessons yet',
          what: 'Lessons are short rules learned from past work, such as a mistake you corrected once that an agent should not repeat. Agents recall the matching ones before they start a task.',
          why: 'No agent has saved a lesson, and no crystal or transcript import has produced one on this install yet.',
          steps: [
            { label: 'From an agent, call the MCP function:', cmd: 'memory_lesson_save { "content": "Run tsc before committing", "context": "CI failed twice on type errors" }' },
            { label: 'Or from a terminal, linked to the session it came from:', cmd: curlPost('lessons', { content: 'Run tsc before committing', context: 'CI failed twice on type errors', sourceIds: ['ses_...'] }) },
            { label: 'Crystallizing finished actions and importing transcripts on the Replay page also produce lessons.' }
          ],
          link: { href: 'https://github.com/rohitg00/agentmemory#lessons', text: 'Lesson decay and scoring' }
        });
      } else if (!rows.length) {
        html = emptyState({
          icon: '&#128269;',
          title: 'No lessons match',
          what: 'The filter matches lesson text, the reason it was learned and its tags, within the chosen project.',
          why: 'None of the ' + fmtNum(all.length) + ' lessons match' + (l.search ? ' &ldquo;' + esc(l.search) + '&rdquo;' : '') + (l.projectFilter ? ' in project <b>' + esc(l.projectFilter) + '</b>' : '') + '.',
          steps: [{ label: 'Search by meaning on the server instead:', cmd: curlPost('lessons/search', { query: l.search || 'deploy', project: l.projectFilter || undefined }) }]
        }) + '<div style="margin-top:10px;"><button type="button" class="btn" data-action="lesson-clear-filters">Clear filters</button></div>';
      } else {
        html = '<div class="table-wrap"><table class="mem-table"><thead><tr><th>Lesson</th><th class="col-opt">Confidence ' + help('confidence') + '</th><th class="col-opt">Uses ' + help('reinforcements') + '</th><th class="col-opt">Updated</th></tr></thead><tbody>';
        rows.forEach(function(x) { html += lessonRowHtml(x); });
        html += '</tbody></table></div>';
        if (all.length < 8) html += usageCard('lesson');
      }
      setViewHtml(document.getElementById('lessons-list'), html);
      var sel = l.selectedId ? store.entities.lesson[l.selectedId] : null;
      var detail = document.getElementById('lessons-detail');
      if (l.selectedId && !sel) {
        setViewHtml(detail, '<div class="detail-panel mem-detail" id="lesson-detail"><div class="mem-detail-head"><span>Lesson</span><button type="button" class="icon-btn icon-close" data-action="lesson-close" aria-label="Close lesson details">close</button></div>' + emptyState({
          compact: true,
          icon: '&#128269;',
          title: 'Lesson not found',
          what: 'Lesson links anywhere in the viewer open this panel by id.',
          why: 'No current lesson has the id <code>' + esc(l.selectedId) + '</code>. It was deleted or decayed away, or the link comes from another install.',
          steps: [{ label: 'List lessons from a terminal:', cmd: curlGet('lessons') }]
        }) + '</div>');
      } else {
        setViewHtml(detail, sel ? lessonDetailHtml(sel).replace('<div class="detail-panel mem-detail"', '<div id="lesson-detail" class="detail-panel mem-detail"') : '');
      }
      document.getElementById('lessons-layout').classList.toggle('has-detail', !!detail.firstElementChild);
    }

    async function strengthenLesson(id) {
      var l = state.lessons;
      l.busy = id;
      renderLessons();
      var res = await apiPost('lessons/strengthen', { lessonId: id });
      l.busy = '';
      l.notice = res && res.success !== false
        ? { id: id, html: 'Recorded one more use. Confidence and uses update here from the live stream.' }
        : { id: id, err: true, html: 'Strengthen failed' + (res && res.error ? ': ' + esc(res.error) : '. Check that agentmemory is running.') };
      renderLessons();
    }

    function openLessonDeleteModal(id) {
      var x = store.entities.lesson[id];
      if (!x) return;
      openModal('<h3>Delete this lesson?</h3>' +
        '<p>&ldquo;' + esc(truncate(x.content, 140)) + '&rdquo; stops being recalled by agents. It is soft-deleted and recorded in the audit log; saving the same text again later creates it fresh.</p>' +
        '<p style="font-size:11px;">Same call from a terminal: <code>' + esc(curlPost('lessons/delete', { lessonId: id }).replace(/\s*\\\n\s*/g, ' ')) + '</code></p>' +
        '<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="lesson-confirm-delete" data-lesson-id="' + esc(id) + '">Delete lesson</button></div>');
    }

    async function deleteLesson(id) {
      closeModal();
      var res = await apiPost('lessons/delete', { lessonId: id });
      if (res && res.success !== false) {
        state.lessons.selectedId = null;
        setRouteEntity('lessons', '');
      } else {
        state.lessons.notice = { id: id, err: true, html: 'Delete failed' + (res && res.error ? ': ' + esc(res.error) : '. Check that agentmemory is running.') };
      }
      renderLessons();
    }

    function actionRows() {
      var a = state.actions;
      var search = String(a.search || '').trim().toLowerCase();
      return entityList('action').filter(function(x) {
        if (!x) return false;
        if (a.statusFilter && x.status !== a.statusFilter) return false;
        if (search && (String(x.title || '') + ' ' + String(x.description || '') + ' ' + asTags(x.tags).join(' ')).toLowerCase().indexOf(search) < 0) return false;
        return true;
      }).sort(function(p, q) { return (q.priority || 0) - (p.priority || 0) || String(q.updatedAt || '').localeCompare(String(p.updatedAt || '')); });
    }

    function actionRowHtml(x, ready) {
      var selected = state.actions.selectedId === x.id;
      var html = '<tr class="lesson-row' + (selected ? ' row-select' : '') + (isFresh(x.id) ? ' fresh' : '') + '" data-action="select-action" data-action-id="' + esc(x.id) + '" role="button" tabindex="0" aria-expanded="' + (selected ? 'true' : 'false') + '" style="cursor:pointer;">';
      html += '<td style="max-width:0;width:100%;"><div class="mem-head clamp-2">' + esc(x.title) + '</div>' + (x.description ? '<div class="mem-excerpt">' + esc(x.description) + '</div>' : '');

      html += '<td><span class="badge ' + (ACTION_STATUS_BADGES[x.status] || 'badge-muted') + '">' + esc(x.status) + '</span>' + (ready ? ' <span class="ready-badge" title="' + esc(GLOSSARY.frontierReady.text) + '">ready</span>' : '') + '</td>';

    function handlePageAction(action, target) {
      if (action === 'lesson-close') { state.lessons.selectedId = null; setRouteEntity('lessons', ''); renderLessons(); return true; }
      if (action === 'lesson-strengthen') { strengthenLesson(target.getAttribute('data-lesson-id')); return true; }
      if (action === 'lesson-delete') { openLessonDeleteModal(target.getAttribute('data-lesson-id')); return true; }
      if (action === 'lesson-confirm-delete') { deleteLesson(target.getAttribute('data-lesson-id')); return true; }
      if (action === 'lesson-clear-filters') { state.lessons.search = ''; state.lessons.projectFilter = ''; var li = document.getElementById('lessons-search'); if (li) li.value = ''; renderLessons(); return true; }
      if (action === 'select-action') {
        var aid = target.getAttribute('data-action-id');
        state.actions.selectedId = state.actions.selectedId === aid ? null : aid;
        setRouteEntity('actions', state.actions.selectedId);
        renderActions();
        if (state.actions.selectedId && window.matchMedia('(max-width: 1100px)').matches) {
          var ad = document.getElementById('action-detail');
          if (ad && ad.scrollIntoView) ad.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        return true;
      }
      if (action === 'action-close') { state.actions.selectedId = null; setRouteEntity('actions', ''); renderActions(); return true; }
      if (action === 'action-set-status') { setActionStatus(target.getAttribute('data-action-id'), target.getAttribute('data-status')); return true; }
      if (action === 'action-clear-filters') { state.actions.search = ''; state.actions.statusFilter = ''; var ai = document.getElementById('actions-search'); if (ai) ai.value = ''; renderActions(); return true; }
      if (action === 'activity-type' || action === 'activity-file' || action === 'activity-day' || action === 'activity-clear') { handleActivityAction(action, target); return true; }
      if (action.indexOf('profile-') === 0) { handleProfileAction(action, target); return true; }
      if (action === 'replay-jump') { jumpReplay(parseInt(target.getAttribute('data-replay-idx') || '0', 10)); return true; }
      return false;
    }

    function auditVerb(op) {
      return AUDIT_VERBS[op] || String(op || 'change').replace(/_/g, ' ');
    }

    function auditTargetSummary(ids) {
      var counts = {};
      (ids || []).forEach(function(id) {
        var k = ID_KIND_LABELS[idKind(id)] || 'record';
        counts[k] = (counts[k] || 0) + 1;
      });
      return Object.keys(counts).map(function(k) {
        var n = counts[k];
        var plural = k === 'memory' ? 'memories' : k + 's';
        return n + ' ' + (n === 1 ? k : plural);
      }).join(', ');
    }

    function auditDetailScalars(details) {
      var out = [];
      Object.keys(details || {}).forEach(function(k) {
        var v = details[k];
        if (v === null || v === undefined || v === '' || typeof v === 'object') return;
        out.push({ key: k, value: String(v) });
      });
      return out;
    }

    function recordName(id) {
      var kind = idKind(id);
      var row;
      if (kind === 'memory' && (row = store.entities.memory[id])) return memoryHeadline(row).head;
      if (kind === 'lesson' && (row = store.entities.lesson[id])) return row.content || '';
      if (kind === 'action' && (row = store.entities.action[id])) return row.title || '';
      if (kind === 'crystal' && (row = store.entities.crystal[id])) return row.narrative || '';
      if (kind === 'session' && (row = store.entities.session[id])) return sessionDisplayName(row) + (row.firstPrompt ? ': ' + row.firstPrompt : '');
      return '';
    }

    function auditSummaryHtml(a) {
      var html = esc(auditVerb(a.operation));
      var ids = a.targetIds || [];
      var name = ids.length === 1 ? recordName(ids[0]) : '';
      if (name) html += ': ' + esc('“' + truncate(name, 90) + '”');
      else if (ids.length > 1) html += ': ' + esc(auditTargetSummary(ids));
      var d = a.details || {};
      var note = d.reason || d.source || d.tier || d.message || '';
      if (typeof note === 'string' && note) html += ' <span style="color:var(--ink-muted);">(' + esc(truncate(note, 80)) + ')</span>';
      return html;
    }

    function auditFilterActive() {
      var a = state.audit;
      return !!(a.opFilter || a.from || a.to || String(a.q || '').trim());
    }

    function auditRange() {
      var a = state.audit;
      var from = a.from ? new Date(a.from + 'T00:00:00').getTime() : null;
      var to = a.to ? new Date(a.to + 'T23:59:59.999').getTime() : null;
      return { from: from !== null && isFinite(from) ? from : null, to: to !== null && isFinite(to) ? to : null };
    }

    function auditMatches(e) {
      var a = state.audit;
      if (!e) return false;
      if (a.opFilter && e.operation !== a.opFilter) return false;
      var r = auditRange();
      var t = new Date(e.timestamp).getTime();
      if (r.from !== null && !(t >= r.from)) return false;
      if (r.to !== null && !(t <= r.to)) return false;
      var q = String(a.q || '').trim().toLowerCase();
      if (q && ![e.functionId].concat(e.targetIds || []).some(function(v) { return String(v || '').toLowerCase().indexOf(q) >= 0; })) return false;
      return true;
    }

    function auditFilterKey() {
      var a = state.audit;
      return [a.opFilter, a.from, a.to, String(a.q || '').trim()].join('|');
    }

    function auditQueryPath(extra) {
      var a = state.audit;
      var r = auditRange();
      var p = 'audit?limit=' + AUDIT_PAGE;
      if (a.opFilter) p += '&operation=' + encodeURIComponent(a.opFilter);
      if (r.from !== null) p += '&dateFrom=' + encodeURIComponent(new Date(r.from).toISOString());
      if (r.to !== null) p += '&dateTo=' + encodeURIComponent(new Date(r.to).toISOString());
      if (String(a.q || '').trim()) p += '&q=' + encodeURIComponent(String(a.q).trim());
      return p + (extra || '');
    }

    function mergeAuditRows(rows) {
      var added = 0;
      (rows || []).forEach(function(r) {
        if (!r || !r.id) return;
        if (!store.entities.audit[r.id]) added++;
        store.entities.audit[r.id] = r;
      });
      return added;
    }

    function auditRows() {
      var rows = entityList('audit');
      if (auditFilterActive()) rows = rows.filter(auditMatches);
      return sortByTimeDesc(rows, ['timestamp']);
    }

    var auditQuerySeq = 0;
    async function applyAuditFilters() {
      var a = state.audit;
      var key = auditFilterKey();
      a.selectedIdx = null;
      if (!auditFilterActive()) { a.query = null; renderAudit(); return; }
      var seq = ++auditQuerySeq;
      a.query = { key: key, loading: true, failed: false };
      renderAudit();
      var res = await apiGet(auditQueryPath());
      if (seq !== auditQuerySeq) return;
      a.query.loading = false;
      if (!res) a.query.failed = true;
      else {
        mergeAuditRows(res.entries);
        if ((res.entries || []).length < AUDIT_PAGE) a.exhausted[key] = true;
      }
      renderAudit();
    }
    var applyAuditFiltersSoon = debounce(applyAuditFilters, 300);

    async function loadMoreAudit() {
      var a = state.audit;
      var key = auditFilterKey();
      var rows = auditRows();
      if (a.loadingMore || a.exhausted[key] || !rows.length) return;
      a.loadingMore = true;
      renderAudit();
      var oldest = rows[rows.length - 1].timestamp;
      var path = auditFilterActive() ? auditQueryPath() : 'audit?limit=' + AUDIT_PAGE;
      path = path.replace(/&dateTo=[^&]*/, '') + '&dateTo=' + encodeURIComponent(oldest);
      var res = await apiGet(path);
      a.loadingMore = false;
      if (res) {
        var added = mergeAuditRows(res.entries);
        if ((res.entries || []).length < AUDIT_PAGE || added === 0) a.exhausted[key] = true;
      }
      renderAudit();
    }

    function clearAuditFilters() {
      var a = state.audit;
      a.opFilter = '';
      a.from = '';
      a.to = '';
      a.q = '';
      a.query = null;
      auditQuerySeq++;
      renderAudit();
    }

    function auditFilterDescription() {

      var parts = [];
      if (a.opFilter) parts.push('operation <b>' + esc(a.opFilter) + '</b>');
      if (a.from) parts.push('from <b>' + esc(a.from) + '</b>');

    function auditDetailHtml(a) {
      var d = a.details || {};
      var html = '<div class="audit-more" id="audit-detail-' + esc(a.id) + '"><dl class="mem-meta">';
      html += '<dt>When</dt><dd>' + esc(formatTime(a.timestamp)) + '</dd>';
      html += '<dt>Function</dt><dd><code>' + esc(a.functionId || '') + '</code></dd>';
      if (a.userId) html += '<dt>User</dt><dd>' + esc(a.userId) + '</dd>';
      if (typeof a.qualityScore === 'number') html += '<dt>Quality</dt><dd>' + esc(String(a.qualityScore)) + '</dd>';
      html += '<dt>Entry</dt><dd>' + '<span class="id-chip"><code>' + esc(shortId(a.id, 22)) + '</code>' + copyBtn(a.id, 'audit entry id') + '</span></dd>';
      if ((a.targetIds || []).length) {
        html += '<dt>Targets ' + help('auditTargets') + '</dt><dd style="display:flex;gap:6px;flex-wrap:wrap;">' + a.targetIds.slice(0, 40).map(function(id) { return anyIdChip(id); }).join('') + (a.targetIds.length > 40 ? '<span class="ses-foot">+' + (a.targetIds.length - 40) + ' more</span>' : '') + '</dd>';
      }
      Object.keys(d).forEach(function(k) {
        var v = d[k];
        if (v === null || v === undefined || v === '') return;
        var label = k.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ');
        if (Array.isArray(v) && v.length && v.every(function(x) { return typeof x === 'string' && idKind(x); })) {
          html += '<dt>' + esc(label) + '</dt><dd style="display:flex;gap:6px;flex-wrap:wrap;">' + v.slice(0, 20).map(function(id) { return anyIdChip(id); }).join('') + '</dd>';
        } else if (typeof v === 'object') {
          html += '<dt>' + esc(label) + '</dt><dd><pre class="obs-code" style="max-height:160px;">' + esc(truncate(JSON.stringify(v, null, 2), 4000)) + '</pre></dd>';
        } else {
          html += '<dt>' + esc(label) + '</dt><dd>' + (typeof v === 'string' && idKind(v) ? anyIdChip(v) : esc(String(v))) + '</dd>';

    function consolidationWhyEmpty(cs, c) {
      if (!cs.llmConfigured) return { text: 'No LLM provider is configured on this instance, so no session summaries are written and consolidation never runs. Semantic facts and procedures stay at zero.', cmd: "echo 'ANTHROPIC_API_KEY=sk-ant-...' >> ~/.agentmemory/.env" };
      if (!cs.enabled) return { text: 'CONSOLIDATION_ENABLED is set to false, so consolidation is switched off even though an LLM key exists. Remove that line from ~/.agentmemory/.env (or set it to true) and restart. Find it with:', cmd: 'grep -n CONSOLIDATION_ENABLED ~/.agentmemory/.env' };
      var t = cs.thresholds || {};
      if ((c.semantic || 0) === 0 && cs.summaries < (t.semanticMinSummaries || 5)) return { text: 'Not enough finished sessions yet: semantic facts need ' + (t.semanticMinSummaries || 5) + ' session summaries and there are ' + cs.summaries + '. End sessions normally (the Stop hook does it) so each one gets a summary.', cmd: curlPost('session/end', { sessionId: 'ses_...' }) };
      if ((c.procedural || 0) === 0 && cs.recurringPatterns < (t.proceduralMinPatterns || 2)) return { text: 'Procedures need ' + (t.proceduralMinPatterns || 2) + ' pattern memories that each appear in ' + (t.proceduralMinSessionsPerPattern || 2) + '+ sessions; there are ' + cs.recurringPatterns + '. They build up as the same workflow repeats across sessions.', cmd: '' };
      return null;
    }

    async function runConsolidation() {
      if (state.health.consolidating) return;
      state.health.consolidating = true;
      markDirty(['health']);
      renderTab('health');
      try {
        var res = await apiPost('consolidate-pipeline', { tier: 'all' });
        state.health.error = res && res.success === false && res.reason ? res.reason : null;
      } finally {
        state.health.consolidating = false;
        markDirty(['health']);
        if (state.activeTab === 'health') renderTab('health');
      }
    }

    function profileProjects() {
      var map = {};
      entityList('session').forEach(function(x) {
        if (!x.project) return;
        var p = map[x.project] || (map[x.project] = { project: x.project, count: 0, lastAt: '', cwd: '' });
        p.count++;
        var at = String(x.updatedAt || x.startedAt || '');
        if (at > p.lastAt) { p.lastAt = at; if (x.cwd) p.cwd = x.cwd; }
        if (!p.cwd && x.cwd) p.cwd = x.cwd;
      });
      return Object.keys(map).map(function(k) { return map[k]; }).sort(function(a, b) { return b.lastAt.localeCompare(a.lastAt) || b.count - a.count; });
    }

    async function ensureProfileData(refresh) {
      var pr = state.profile;
      var project = pr.selectedProject;
      if (!project || pr.loadingProject === project || (!refresh && pr.dataProject === project)) return;
      pr.loadingProject = project;
      if (!refresh) pr.data = null;
      renderProfile();
      var result = await apiGet('profile?project=' + encodeURIComponent(project) + (refresh ? '&refresh=true' : ''));
      pr.loadingProject = '';
      if (pr.selectedProject !== project) return;
      pr.dataProject = project;
      pr.data = result && result.profile !== undefined ? result.profile : result;
      pr.cached = !!(result && result.cached);
      pr.notice = refresh ? (result ? { html: 'Rebuilt just now from the latest sessions and memories.' } : { err: true, html: 'Rebuild failed. Check that agentmemory is running.' }) : null;
      if (state.activeTab === 'profile') renderProfilePage();
    }

    function profileBarsHtml(items, labelFn, titleFn, color, action, attr) {
      var max = Math.max.apply(null, items.map(function(x) { return x.frequency; })) || 1;

        var label = labelFn(x);
        var inner = '<span class="bar-label">' + esc(label) + '</span><span class="bar-track"><span class="bar-fill" style="display:block;width:' + Math.round((x.frequency / max) * 100) + '%;background:' + color + ';"></span></span><span class="bar-value">' + x.frequency + '</span>';
        if (!action) return '<div class="bar-row" title="' + esc(titleFn(x)) + '">' + inner + '</div>';
        return '<button type="button" class="bar-row linkrow" data-action="' + action + '" ' + attr + '="' + esc(label) + '" title="' + esc(titleFn(x)) + '">' + inner + '</button>';
      }).join('') + '</div>';
    }

        }));

        html += '<div class="empty-step-label" style="margin-top:8px;">Record a convention you already know as a preference memory; agents recall it with the rest:</div>' + cmdBlock(curlPost('remember', { content: 'Use named CSS grid areas in checkout', type: 'preference', project: project }));

      html += '<dt>Observations ' + help('observation') + '</dt><dd>' + fmtNum(p.totalObservations || 0) + ' in the last ' + Math.min(20, p.sessionCount || 0) + ' sessions</dd>';

    function handleProfileAction(action, target) {

        var concept = target.getAttribute('data-concept') || '';

        switchTab('memories');

        runMemorySearch(concept);
        return;

      if (action === 'profile-memories') {
        state.memories.projectFilter = project;
        switchTab('memories');
        applyMemoryFilters();
        return;

      if (action === 'profile-sessions') {
        state.sessions.filters.project = project;
        switchTab('sessions');
        applySessionFilters();
      }

    var wsReconnectTimer = null;
    var wsRetries = 0;
    var directFailed = true;
    var directFailures = 0;
    var wsHasConnected = false;
    var wsOpenedAt = null;
    var DIRECT_FAILURE_THRESHOLD = 2;
    var OFFLINE_AFTER_RETRIES = 3;
    var HEALTH_STALE_MS = 90000;
    var conn = { state: 'connecting', nextRetryAt: 0, lostAt: 0 };

    function reconnectDelay(attempt) {
      var n = Math.max(1, attempt || 1);
      return Math.min(30000, 1000 * Math.pow(2, n - 1));
    }

    function setWsStatus(text, cls) {
      var el = document.getElementById('ws-status');
      if (!el) return;
      el.textContent = text;
      el.className = 'ws-status ' + cls;
    }

    function setConnection(next) {
      conn.state = next;
      if (next === 'live') conn.lostAt = 0;
      else if (!conn.lostAt && wsHasConnected) conn.lostAt = Date.now();
      document.body.classList.toggle('is-stale', next !== 'live' && next !== 'connecting');
      renderConnection();
      if (store.snapshot) {
        markDirty(['health']);
        if (state.activeTab === 'health') renderTab('health');
      }
    }

    function renderConnection() {
      var secs = conn.nextRetryAt ? Math.max(0, Math.ceil((conn.nextRetryAt - Date.now()) / 1000)) : 0;
      var healthStale = conn.state === 'live' && store.lastHealthAt && Date.now() - store.lastHealthAt > HEALTH_STALE_MS;
      if (conn.state === 'live') setWsStatus(healthStale ? 'live · health quiet' : 'live', healthStale ? 'stale-health' : 'connected');
      else if (conn.state === 'connecting') setWsStatus('connecting', 'connecting');
      else if (conn.state === 'reconnecting') setWsStatus('reconnecting' + (secs ? ' · ' + secs + 's' : ''), 'reconnecting');
      else setWsStatus('offline' + (secs ? ' · retry ' + secs + 's' : ''), 'offline');
      var chip = document.getElementById('ws-status');
      if (chip) chip.title = healthStale
        ? 'Connected, but no health update arrived for ' + Math.round((Date.now() - store.lastHealthAt) / 1000) + 's. The worker may be busy.'
        : GLOSSARY.live.text;
      var banner = document.getElementById('offline-banner');
      if (!banner) return;
      var showBanner = conn.state === 'reconnecting' || conn.state === 'offline';
      if (!showBanner) { banner.hidden = true; banner.innerHTML = ''; return; }
      var asOf = store.snapshotAt ? new Date(conn.lostAt || store.snapshotAt).toLocaleTimeString() : '';
      banner.hidden = false;
      banner.className = 'offline-banner' + (conn.state === 'offline' ? ' offline' : '');
      banner.innerHTML = '<strong>' + (conn.state === 'offline' ? 'agentmemory is unreachable.' : 'Live updates paused.') + '</strong>' +
        '<span>' + (asOf ? 'Showing data as of ' + esc(asOf) + '.' : 'No data loaded yet.') + ' ' + (secs ? 'Next reconnect attempt in ' + secs + 's.' : 'Reconnecting now.') + '</span>' +
        (conn.state === 'offline' ? '<span style="color:var(--ink-muted);">Check that the server is running:</span>' + cmdBlock('npx @agentmemory/agentmemory status') : '') +
        '<button class="btn" data-action="reconnect-now">Reconnect now</button>';
    }

    var healthStaleTimer = null;
    function scheduleHealthStaleCheck() {
      if (healthStaleTimer) clearTimeout(healthStaleTimer);
      healthStaleTimer = setTimeout(function() {
        healthStaleTimer = null;
        renderConnection();
        markDirty(['health', 'dashboard']);
        if (state.activeTab === 'health' || state.activeTab === 'dashboard') renderTab(state.activeTab);
      }, HEALTH_STALE_MS + 1000);
    }

    var countdownTimer = null;
    function scheduleCountdown() {
      if (countdownTimer) return;
      countdownTimer = setTimeout(function() {
        countdownTimer = null;
        if (conn.state === 'reconnecting' || conn.state === 'offline') {
          renderConnection();
          scheduleCountdown();
        }
      }, 1000);
    }

    function scheduleReconnect() {
      wsRetries++;
      var delay = reconnectDelay(wsRetries);
      conn.nextRetryAt = Date.now() + delay;
      setConnection(wsRetries >= OFFLINE_AFTER_RETRIES ? 'offline' : 'reconnecting');
      scheduleCountdown();
      if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
      wsReconnectTimer = setTimeout(connectWs, delay);
    }

    function reconnectNow() {
      if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
      wsReconnectTimer = null;
      directFailures = 0;
      directFailed = true;
      conn.nextRetryAt = 0;
      var ws = state.ws;
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
      connectWs();
    }

    var WS_CONNECT_TIMEOUT_MS = 5000;

    function connectWs() {
      wsReconnectTimer = null;
      conn.nextRetryAt = 0;
      var useDirect = !directFailed;
      var ws;
      try {
        ws = new WebSocket(useDirect ? WS_DIRECT_URL : WS_URL);
        ws.__direct = useDirect;
      } catch (_) {
        scheduleReconnect();
        return;
      }
      var connectTimer = setTimeout(function() {
        if (ws.readyState === WebSocket.CONNECTING) {
          try { ws.close(); } catch {}
        }
      }, WS_CONNECT_TIMEOUT_MS);
      ws.onopen = function() {
        clearTimeout(connectTimer);
        if (state.ws !== ws) return;
        wsRetries = 0;
        if (!ws.__direct) {
          ws.send(JSON.stringify({
            type: 'join',
            data: {
              subscriptionId: 'viewer-' + Date.now(),
              streamName: 'mem-live',
              groupId: 'viewer'
            }
          }));
        }
        var firstConnect = !wsHasConnected;
        wsHasConnected = true;
        wsOpenedAt = Date.now();
        setConnection('live');
        updateFooter();
        resyncAfterConnect(firstConnect);
      };
      ws.onmessage = function(e) {
        if (state.ws !== ws) return;
        if (!ws.__usable) {
          ws.__usable = true;
          directFailures = 0;
        }
        store.lastEventAt = Date.now();
        try {
          var msg = JSON.parse(e.data);
          if (msg.type === 'stream' && msg.event) {
            handleStreamEvent(msg);
          } else if (msg.event_type && msg.data) {
            handleStreamEvent({ event: { type: 'create', data: msg.data, event_type: msg.event_type } });
          }
        } catch {}
      };
      ws.onclose = function() {
        clearTimeout(connectTimer);
        if (state.ws !== ws) return;
        wsOpenedAt = null;
        updateFooter();
        directFailures += 1;
        if (directFailures >= DIRECT_FAILURE_THRESHOLD) {
          directFailed = ws.__direct;
          directFailures = 0;
        }
        scheduleReconnect();
      };
      ws.onerror = function() {
        if (state.ws !== ws) return;
        try { ws.close(); } catch {}
      };
      state.ws = ws;
    }

    var resyncing = null;
    async function resyncAfterConnect(firstConnect) {
      openBootGate();
      if (resyncing) return resyncing;
      var reloadKinds = Object.keys(store.loaded).filter(function(k) { return store.loaded[k]; });
      resyncing = (async function() {
        try {
          await loadSnapshot();
          scheduleHealthStaleCheck();
          if (!firstConnect || reloadKinds.length) {
            reloadKinds.forEach(function(k) { store.loaded[k] = false; });
            await Promise.all(reloadKinds.map(ensureLoaded));
            state.graph.dirty = state.graph.loaded;
            state.activity.loaded = false;
            frontierStale = true;
            TAB_IDS.forEach(function(t) { tabDirty[t] = true; });
          }
          showTab(state.activeTab);
          updateFooter();
        } finally {
          resyncing = null;
        }
      })();
      return resyncing;
    }

    var LIVE_BUFFER_MAX = 200;

    function looksLikeObservation(obj) {
      return !!(obj && typeof obj === 'object' && obj.id && obj.timestamp);
    }

    function sessionKey(s) {
      return s && (s.id || s.sessionId);
    }

    function entityKey(kind, row) {
      if (!row) return '';
      if (kind === 'session') return sessionKey(row) || '';
      return row.id || '';
    }

    function applyEntityEvent(entities, kind, action, id, row) {
      var bucket = entities[kind];
      if (!bucket || !id) return false;
      var gone = action === 'deleted' || !row || (kind === 'lesson' && row.deleted === true);
      if (gone) {
        if (!bucket[id]) return false;
        delete bucket[id];
        return true;
      }
      bucket[id] = Object.assign({}, bucket[id] || {}, row);
      return true;
    }

    var ROW_EVENT_KINDS = ['lesson', 'action', 'crystal', 'semantic', 'procedural', 'audit'];

    function reduceLiveEvent(s, type, data) {
      var dot = type.indexOf('.');
      var kind = dot > 0 ? type.slice(0, dot) : type;
      var action = dot > 0 ? type.slice(dot + 1) : '';
      data = data || {};
      if (kind === 'memory') {
        var memId = data.memoryId || (data.memory && data.memory.id) || '';
        var memRow = action === 'deleted' ? null : (data.memory || null);
        if (!memRow && action !== 'deleted') return null;
        applyEntityEvent(s.entities, 'memory', action, memId, memRow);
        return { kind: 'memory', id: memId, action: action, row: memRow };
      }
      if (ROW_EVENT_KINDS.indexOf(kind) >= 0) {
        var row = action === 'deleted' ? null : (data[kind] || null);
        applyEntityEvent(s.entities, kind, action, data.id, row);
        return { kind: kind, id: data.id, action: action, row: row };
      }
      if (kind === 'session') {
        if (action === 'updated' && data.session) {
          var sid = sessionKey(data.session);
          applyEntityEvent(s.entities, 'session', 'updated', sid, data.session);
          return { kind: 'session', id: sid, action: 'updated', row: data.session };
        }
        if (action === 'deleted' && data.sessionId) {
          applyEntityEvent(s.entities, 'session', 'deleted', data.sessionId, null);
          return { kind: 'session', id: data.sessionId, action: 'deleted', row: null };
        }
        if (action === 'activity' && data.sessionId) {
          var existing = s.entities.session[data.sessionId];
          if (existing) {
            existing.observationCount = data.observationCount;
            if (data.updatedAt) existing.updatedAt = data.updatedAt;
          }
          return { kind: 'session', id: data.sessionId, action: 'activity', row: existing || null };
        }
        return null;
      }
      if (type === 'counts.changed' && data.counts) {
        s.counts = data.counts;
        return { kind: 'counts' };
      }
      if (type === 'health') {
        s.status = data.status || s.status;
        if (data.health) s.health = data.health;
        if (data.circuitBreaker !== undefined) s.circuitBreaker = data.circuitBreaker;
        if (Array.isArray(data.functionMetrics)) s.functionMetrics = data.functionMetrics;
        if (data.counts) s.counts = data.counts;
        if (data.indexes) s.indexes = data.indexes;
        if (data.report) s.report = data.report;
        s.lastHealthAt = Date.now();
        return { kind: 'health' };
      }
      if (type === 'graph.changed') {
        if (data.source === 'snapshot') {
          s.graph = { stats: data.stats || null, updatedAt: data.updatedAt, resetAt: data.resetAt || null };
        }
        return { kind: 'graph', source: data.source };
      }
      if (type === 'consolidation.run') {
        s.consolidation = { lastRun: data.lastRun || null };
        if (data.status) s.consolidationStatus = data.status;
        return { kind: 'consolidation' };
      }
      return null;
    }

    var KIND_TABS = {
      memory: ['memories', 'dashboard'],
      session: ['sessions', 'dashboard', 'profile', 'activity', 'replay'],
      lesson: ['lessons', 'crystals', 'sessions'],
      action: ['actions'],
      crystal: ['crystals', 'sessions'],
      semantic: ['dashboard', 'health'],
      procedural: ['dashboard', 'health'],
      audit: ['audit', 'dashboard'],
      counts: ['dashboard', 'memories', 'sessions', 'health'],
      health: ['dashboard', 'health'],
      graph: ['graph', 'dashboard', 'health'],
      consolidation: ['dashboard', 'health']
    };

    function feedPush(item) {
      item.fresh = true;
      item.at = item.at || new Date().toISOString();
      store.feed.unshift(item);
      if (store.feed.length > FEED_MAX) store.feed.length = FEED_MAX;
    }

    function auditFeedItem(a) {
      var ids = a.targetIds || [];
      var name = ids.length === 1 ? recordName(ids[0]) : '';
      var targets = name ? '“' + truncate(name, 70) + '”' : ids.length > 1 ? auditTargetSummary(ids) : '';
      var first = ids[0];
      var kind = first && (a.targetIds.length === 1) ? idKind(first) : '';
      var link = kind && kind !== 'observation' ? { kind: kind, id: first } : { kind: 'audit', id: a.id };
      return { at: a.timestamp, tag: String(a.operation || 'audit').replace(/_/g, ' '), badge: OP_BADGES[a.operation] || 'badge-muted', text: auditVerb(a.operation) + (targets ? ': ' + targets : ''), kind: link.kind, id: link.id };
    }

    function seedFeedFromAudit() {
      if (store.feed.length > 0) return;
      sortByTimeDesc(entityList('audit'), ['timestamp']).slice(0, 15).forEach(function(a) {
        var item = auditFeedItem(a);
        item.fresh = false;
        store.feed.push(item);
      });
    }

    function feedFromChange(change) {
      if (!change || !change.row) {
        if (change && change.kind === 'memory' && change.action === 'deleted') feedPush({ tag: 'forget', badge: 'badge-red', text: 'Memory deleted' });
        return;
      }
      var r = change.row;
      if (change.kind === 'memory' && change.action === 'created') feedPush({ tag: 'memory', badge: 'badge-green', text: truncate(r.title || r.content || 'Memory saved', 90), kind: 'memory', id: change.id });
      else if (change.kind === 'lesson' && change.action === 'created') feedPush({ tag: 'lesson', badge: 'badge-purple', text: truncate(r.content || 'Lesson learned', 90), kind: 'lesson', id: change.id });
      else if (change.kind === 'action' && change.action === 'created') feedPush({ tag: 'action', badge: 'badge-yellow', text: truncate(r.title || 'Action created', 90), kind: 'action', id: change.id });
      else if (change.kind === 'crystal' && change.action === 'created') feedPush({ tag: 'crystal', badge: 'badge-cyan', text: truncate(r.narrative || 'Crystal saved', 90), kind: 'crystal', id: change.id });
      else if (change.kind === 'audit' && change.action === 'created') feedPush(auditFeedItem(r));
      else if (change.kind === 'session' && change.action === 'updated') {
        var label = r.status === 'completed' ? 'Session ended' : 'Session running';
        feedPush({ tag: 'session', badge: r.status === 'active' ? 'badge-green' : 'badge-blue', text: label + ': ' + sessionDisplayName(r), kind: 'session', id: change.id });
      }
    }

    function recordEvent(type, data) {
      var dot = type.indexOf('.');
      var entry = { seq: ++eventSeq, type: type, kind: dot > 0 ? type.slice(0, dot) : type, data: data };
      eventLog.push(entry);
      if (eventLog.length > EVENT_LOG_MAX) eventLog.shift();
      return entry;
    }

    function handleLiveEvent(type, data) {
      recordEvent(type, data);
      var memPrev = null;
      if (type.indexOf('memory.') === 0 && data) {
        var memPrevId = data.memoryId || (data.memory && data.memory.id);
        if (memPrevId && store.entities.memory[memPrevId]) memPrev = Object.assign({}, store.entities.memory[memPrevId]);
      }
      var sesPrev = null;
      if ((type === 'session.updated' || type === 'session.deleted') && data) {
        var sesPrevId = type === 'session.deleted' ? data.sessionId : sessionKey(data.session);
        if (sesPrevId && store.entities.session[sesPrevId]) sesPrev = Object.assign({}, store.entities.session[sesPrevId]);
      }
      var change = reduceLiveEvent(store, type, data);
      if (!change) return;
      if (change.kind === 'memory') {
        noteMemoryChange(memPrev, store.entities.memory[change.id] || null, change.id);
        noteSessionProduced(change);
      }
      if (change.kind === 'audit' && change.action === 'created') state.audit.fresh[change.id] = Date.now();
      if ((change.kind === 'lesson' || change.kind === 'action' || change.kind === 'crystal') && change.action !== 'deleted' && change.id) state.freshRows[change.id] = Date.now();
      if (change.kind === 'session' && change.action !== 'activity') adjustSessionFacets(sesPrev, change.row);
      if (change.kind !== 'session' || change.action !== 'activity') feedFromChange(change);
      if (change.kind === 'action') frontierStale = true;
      if (change.kind === 'graph') handleGraphChange(data);
      if (change.kind === 'consolidation' && !store.consolidationStatus) ensureConsolidationStatus(true);
      if (change.kind === 'health') scheduleHealthStaleCheck();
      if (change.kind === 'counts' || change.kind === 'health') updateCountBadges();
      markDirty(KIND_TABS[change.kind] || []);
      if (state.activeTab === 'dashboard') markDirty(['dashboard']);
    }

    var LIVE_RENDER_THROTTLE_MS = 250;
    var pendingLiveRender = null;
    function scheduleLiveRender() {
      if (pendingLiveRender) return;
      pendingLiveRender = setTimeout(function() {
        pendingLiveRender = null;
        if (tabDirty[state.activeTab]) renderTab(state.activeTab);
        if (state.activeTab === 'actions') ensureFrontier();
      }, LIVE_RENDER_THROTTLE_MS);
    }

    function updateCountBadges() {
      var c = store.counts || {};
      document.querySelectorAll('.tab-count[data-count]').forEach(function(el) {
        var v = c[el.getAttribute('data-count')];
        el.textContent = typeof v === 'number' ? (v > 9999 ? Math.round(v / 1000) + 'k' : String(v)) : '';
      });
    }

    function handleStreamEvent(msg) {
      var evt = msg.event;
      var observation;
      if (!evt) return;
      if (evt.type === 'event' && evt.event && evt.event.type) {
        if (evt.event.type === 'raw_observation') {
          observation = evt.event.data && (evt.event.data.observation || evt.event.data);
          if (looksLikeObservation(observation)) routeWsMessage({ observation: observation });
          return;
        }
        handleLiveEvent(evt.event.type, evt.event.data || {});
        return;
      }
      if (evt.event_type && evt.event_type !== 'observation' && evt.event_type !== 'create' && evt.event_type !== 'update') {
        return;
      }
      if (evt.type === 'event' && evt.data) {
        observation = evt.data.observation || evt.data;
        if (looksLikeObservation(observation)) {
          routeWsMessage({ observation: observation });
        }
        return;
      }
      if ((evt.type === 'create' || evt.type === 'update') && evt.data) {
        var payload = evt.data;
        observation = payload.observation || payload;
        if (looksLikeObservation(observation)) {
          routeWsMessage({ observation: observation, fresh: true });
        }
      } else if (evt.type === 'sync') {
        var items = Array.isArray(evt.data) ? evt.data.slice(-LIVE_BUFFER_MAX) : [];
        items.forEach(function(item) {
          var payload = item.data || item;
          observation = payload.observation || payload;
          if (looksLikeObservation(observation)) {
            routeWsMessage({ observation: observation });
          }
        });
      }
    }

    function routeWsMessage(msg) {
      var o = msg.observation;
      if (!o) return;
      if (msg.fresh && (o.title || o.narrative)) {
        var obsSession = store.entities.session[o.sessionId];
        var obsWhat = (o.title || 'Observation') + (o.subtitle ? ': ' + humanizeSubtitle(o.subtitle) : '');
        feedPush({ at: o.timestamp, tag: String(o.type || 'observation').replace(/_/g, ' '), badge: 'badge-blue', text: truncate(obsWhat + (obsSession ? ' (' + sessionDisplayName(obsSession) + ')' : ''), 110), kind: 'session', id: o.sessionId });
        markDirty(['dashboard']);
      }
      liveSessionObservation(o);
      if (state.activity.loaded) {
        var idx = state.activity.observations.findIndex(function(x) { return x.id === o.id; });
        if (idx >= 0) state.activity.observations[idx] = o;
        else state.activity.observations.unshift(o);
        if (state.activity.observations.length > LIVE_BUFFER_MAX * 5) {
          state.activity.observations.length = LIVE_BUFFER_MAX * 5;
        }
        markDirty(['activity']);
      }
    }

    function closeNav() {
      var bar = document.getElementById('tab-bar');
      var toggle = document.getElementById('nav-toggle');
      if (bar) bar.classList.remove('open');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    }

    function toggleNav() {
      var bar = document.getElementById('tab-bar');
      var toggle = document.getElementById('nav-toggle');
      if (!bar) return;
      var open = !bar.classList.contains('open');
      bar.classList.toggle('open', open);
      if (toggle) toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) {
        var active = bar.querySelector('button.active');
        if (active) active.focus();
      }
    }

    document.querySelectorAll('.tab-bar button[data-tab]').forEach(function(b) {
      var panel = document.getElementById('view-' + b.dataset.tab);
      b.id = 'tab-' + b.dataset.tab;
      if (panel) {
        panel.setAttribute('aria-labelledby', b.id);
        panel.removeAttribute('aria-label');
        panel.tabIndex = -1;
      }
    });

    document.getElementById('tab-bar').addEventListener('click', function(e) {
      var btn = e.target instanceof Element ? e.target.closest('button[data-tab]') : null;
      if (btn) switchTab(btn.dataset.tab);
    });

    document.getElementById('tab-bar').addEventListener('keydown', function(e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'Home' && e.key !== 'End') return;
      var tabs = Array.prototype.slice.call(this.querySelectorAll('button[data-tab]'));
      var i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      e.preventDefault();
      var next = i;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (i + 1) % tabs.length;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = tabs.length - 1;
      tabs[next].focus();
    });

    document.querySelectorAll('[data-tab-link]').forEach(function(link) {
      link.addEventListener('click', function(e) {
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        switchTab(link.getAttribute('data-tab-link'));
      });
    });

    function syncTabFromRoute() {
      var route = parseRoute(window.location.hash);
      if (route.redirect) updateTabRoute(route.tab, true, route.id);
      switchTab(route.tab, { replaceRoute: true, skipRoute: true, id: route.id, obs: route.obs });
    }
    window.addEventListener('hashchange', syncTabFromRoute);
    window.addEventListener('popstate', syncTabFromRoute);

    function flagItems() {
      var items = [];
      if (store.provider === 'noop') {
        items.push({
          on: false,
          title: 'No LLM provider',
          key: 'ANTHROPIC_API_KEY',
          desc: 'Compression, summaries, consolidation and graph extraction stay off until an LLM key is set. Memories, search and sessions still work.',
          enable: 'export ANTHROPIC_API_KEY=sk-ant-...\n# then restart: npx @agentmemory/agentmemory',
          affects: ['Overview', 'Graph', 'Crystals']
        });
      }
      if (!store.embeddingProvider || store.embeddingProvider === 'none') {
        items.push({
          on: false,
          title: 'No embedding provider',
          key: 'OPENAI_API_KEY',
          desc: 'Search matches exact keywords only. With embeddings it also finds memories by meaning.',
          enable: 'export OPENAI_API_KEY=sk-...\n# or VOYAGE_API_KEY, COHERE_API_KEY, OLLAMA_HOST',
          affects: ['Memories', 'Health']
        });
      }
      (store.flags || []).forEach(function(f) {
        items.push({
          on: !!f.enabled && !f.inactiveReason,
          partial: !!f.enabled && !!f.inactiveReason,
          title: f.label,
          key: f.key,
          desc: (f.description || '') + (f.inactiveReason ? ' ' + f.inactiveReason : '') + (!f.enabled && f.needsLlm ? ' Needs an LLM provider key.' : ''),
          enable: f.enabled ? '' : f.enableHow,
          affects: f.affects || [],
          docs: f.docsHref
        });
      });
      return items;
    }

    function renderFlagsChip() {
      var host = document.getElementById('flags-chip');
      if (!host) return;
      var items = flagItems();
      var off = items.filter(function(i) { return !i.on; }).length;
      host.innerHTML = '<button type="button" class="chip ' + (off ? 'chip-warn' : 'chip-ok') + '" data-action="toggle-flags" aria-expanded="' + (state.flagsOpen ? 'true' : 'false') + '" aria-controls="flags-panel" title="Which optional features are on">' +
        (off ? off + ' feature' + (off === 1 ? '' : 's') + ' off' : 'all features on') + '</button>';
    }

    function renderFlagsPanel() {
      var panel = document.getElementById('flags-panel');
      if (!panel) return;
      if (!state.flagsOpen) { panel.hidden = true; return; }
      var items = flagItems();
      var html = '<div class="flags-panel-head"><h2>Features ' + help('flags') + '</h2><p>Off features explain empty panels on the pages listed. Turn one on with its setting, then restart agentmemory.</p><button class="icon-btn" data-action="toggle-flags" aria-label="Close features">close</button></div>';
      html += '<div class="flags-grid">';
      items.sort(function(a, b) { return (a.on ? 1 : 0) - (b.on ? 1 : 0); }).forEach(function(i) {
        html += '<div class="flag-item ' + (i.on ? 'on' : 'off') + '">' +
          '<div class="flag-item-title"><span class="badge ' + (i.on ? 'badge-green' : i.partial ? 'badge-yellow' : 'badge-muted') + '">' + (i.on ? 'on' : i.partial ? 'inactive' : 'off') + '</span>' + esc(i.title) + ' <code style="font-size:10px;color:var(--ink-faint);font-weight:400;">' + esc(i.key) + '</code></div>' +
          '<div class="flag-item-desc">' + esc(i.desc) + '</div>' +
          (i.affects && i.affects.length ? '<div class="flag-item-meta">Affects: ' + esc(i.affects.join(', ')) + '</div>' : '') +
          (i.enable ? cmdBlock(i.enable) : '') +
          (i.docs ? '<a class="empty-link" href="' + esc(i.docs) + '" target="_blank" rel="noopener" style="font-size:11px;">docs &rarr;</a>' : '') +
          '</div>';
      });
      html += '</div>';
      panel.innerHTML = html;
      panel.hidden = false;
    }

    function updateFooter() {
      var vEl = document.getElementById('footer-version');
      if (vEl && store.version) vEl.textContent = 'v' + store.version;

    function copyText(text, btn) {
      function done(ok) {
        if (!btn) return;
        var prev = btn.getAttribute('data-label') || btn.textContent;
        btn.setAttribute('data-label', prev);
        btn.textContent = ok ? 'copied' : 'copy failed';
        btn.classList.toggle('copied', ok);
        setTimeout(function() { btn.textContent = prev; btn.classList.remove('copied'); }, 1400);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { done(true); }, function() { done(fallbackCopy(text)); });
      } else {
        done(fallbackCopy(text));
      }
    }

    function fallbackCopy(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (_) {
        return false;
      }
    }

    var helpAnchor = null;
    function showHelpPop(btn) {
      var key = btn.getAttribute('data-help');
      var g = GLOSSARY[key];
      var pop = document.getElementById('help-pop');
      if (!g || !pop) return;
      pop.innerHTML = '<div class="help-pop-term">' + esc(g.term) + '</div><div>' + esc(g.text) + '</div>';
      pop.hidden = false;
      var r = btn.getBoundingClientRect();
      var w = Math.min(300, window.innerWidth - 24);
      pop.style.maxWidth = w + 'px';
      var left = Math.min(Math.max(12, r.left - 8), window.innerWidth - w - 12);
      var top = r.bottom + 8;
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      var ph = pop.getBoundingClientRect().height;
      if (top + ph > window.innerHeight - 8) pop.style.top = Math.max(8, r.top - ph - 8) + 'px';
      helpAnchor = btn;
      btn.setAttribute('aria-describedby', 'help-pop');
    }

    function hideHelpPop() {
      var pop = document.getElementById('help-pop');

      if (helpAnchor) helpAnchor.removeAttribute('aria-describedby');

    function closeAllOverlays() {
      var hadOverlay = document.getElementById('modal-overlay').classList.contains('open');

    var pendingGAt = 0;
    document.addEventListener('keydown', function(e) {
      if (e.defaultPrevented) return;
      var t = e.target;
      var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
      if (e.key === 'Escape') {
        var closed = closeAllOverlays();
        if (!closed && typing && t.blur) t.blur();
        if (!closed && !typing && state.activeTab === 'memories' && state.memories.selectedId && !state.memories.editing) {
          state.memories.selectedId = null;
          setRouteEntity('memories', '');
          renderMemories();
        } else if (!closed && !typing && state.activeTab === 'lessons' && state.lessons.selectedId) {
          handlePageAction('lesson-close', document.body);
        } else if (!closed && !typing && state.activeTab === 'actions' && state.actions.selectedId) {
          handlePageAction('action-close', document.body);
        } else if (!closed && !typing && state.activeTab === 'audit' && state.audit.selectedIdx) {
          toggleAuditDetail(state.audit.selectedIdx);
        }
        return;
      }
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (pendingGAt && Date.now() - pendingGAt < 1500) {
        pendingGAt = 0;
        var jump = TAB_SHORTCUTS[e.key.toLowerCase()];
        if (jump) {
          e.preventDefault();
          switchTab(jump);
        }
        return;
      }
      if (e.key === '/') {
        if (focusPageSearch()) e.preventDefault();
        return;
      }
      if (e.key === '?') {
        e.preventDefault();
        openHelpOverlay();
        return;
      }
      if (e.key === 'g') {
        pendingGAt = Date.now();
        return;
      }
      if (/^[1-9]$/.test(e.key) && state.activeTab !== 'replay') {
        var target = TAB_IDS[parseInt(e.key, 10) - 1];
        if (target) {
          e.preventDefault();
          switchTab(target);
        }
      }
    });

      }
      if (action === 'refresh-health') {

      }
      if (action === 'run-consolidation') {
        runConsolidation();
        return;
      }
      if (action === 'zoom-graph') {
        zoomGraph(parseInt(target.getAttribute('data-dir') || '0', 10));

      }
      if (action === 'recenter-graph') {
        recenterGraph();

      }
      if (action === 'rebuild-graph') {

        return;
      }
      if (action.indexOf('graph-') === 0 && handleGraphAction(action, target)) {

      }
      if (action.indexOf('mem-') === 0) {

      }

      if (action === 'save-viewer-token') {

      if (action.indexOf('ses-') === 0) {

        return;
      }
      if (action === 'goto-tab') {

      if (action === 'replay-toggle-play') { toggleReplayPlay(); return; }

        html += '<div class="inline-status" role="status">Loading the replay for ' + esc(shortId(r.selectedId, 24)) + '…</div>' + skeleton(6);
      } else if (r.selectedId && r.loadError) {
        html += '<div class="inline-status err" role="alert">' + r.loadError + '</div>';
      } else if (r.selectedId && tl && !(tl.events && tl.events.length)) {
        html += emptyState({
          compact: true,
          icon: '&#9654;',
          title: 'This session has nothing to replay',
          what: 'Replay steps through the prompts, responses and tool calls recorded in a session.',
          why: 'No prompt or tool call was captured for this session, so the timeline is empty.',
          steps: [{ label: 'Check its observations from a terminal:', cmd: curlGet('observations?sessionId=' + encodeURIComponent(r.selectedId) + '&limit=20') }]
        });
      } else if (tl && tl.events && tl.events.length) {
        var cursorEvent = tl.events[Math.min(r.cursor, tl.events.length - 1)];
        var progress = tl.totalDurationMs > 0 ? Math.min(100, (r.offsetAt / tl.totalDurationMs) * 100) : 0;
        html += '<div class="replay-controls" role="toolbar" aria-label="Playback">';
        html += '<button type="button" data-action="replay-step" data-dir="-1" aria-label="Previous event">&#9664;</button>';

        html += '<button type="button" data-action="replay-reset" aria-label="Back to the start">&#10226;</button><span class="sep"></span><span id="replay-speed-label">Speed</span>';
        ['0.5', '1', '2', '4'].forEach(function(sp) {
          var on = Math.abs(r.speed - parseFloat(sp)) < 0.01;
          html += '<button type="button" data-action="replay-speed" data-speed="' + sp + '" aria-pressed="' + (on ? 'true' : 'false') + '" aria-describedby="replay-speed-label">' + sp + '&times;</button>';
        });
        html += '<span class="sep"></span><span aria-live="polite">event ' + (r.cursor + 1) + ' of ' + tl.eventCount + ' · ' + (r.offsetAt / 1000).toFixed(1) + 's of ' + (tl.totalDurationMs / 1000).toFixed(1) + 's</span></div>';
        html += '<div class="replay-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(progress) + '" aria-label="Playback position"><div class="replay-progress-bar" style="width:' + progress.toFixed(1) + '%"></div></div>';
        html += '<div class="replay-grid"><div class="replay-list" id="replay-list">';
        tl.events.forEach(function(ev, i) {
          html += '<button type="button" class="replay-event replay-event-' + esc(ev.kind) + (i === r.cursor ? ' replay-event-active' : '') + '" data-action="replay-jump" data-replay-idx="' + i + '" aria-current="' + (i === r.cursor ? 'step' : 'false') + '">' +
            '<span class="replay-event-kind">' + esc(String(ev.kind || '').replace(/_/g, ' ')) + '</span><span class="replay-event-label">' + esc(ev.label) + '</span><span class="replay-event-time">' + (ev.offsetMs / 1000).toFixed(1) + 's</span></button>';
        });
        html += '</div><div class="replay-detail">' + replayDetailHtml(cursorEvent) + '</div></div>';
      } else {
        html += replayIntroHtml(sessions);
      }
      html += replayImportHtml();
      setViewHtml(el, html);
      var sel = document.getElementById('replay-session-select');
      if (sel && !sel.__bound) {
        sel.__bound = true;
        sel.addEventListener('change', function() { selectReplaySession(sel.value); });
      }
      var imp = document.getElementById('replay-import-path');
      if (imp && !imp.__bound) {
        imp.__bound = true;
        imp.addEventListener('input', function() { state.replay.importPath = imp.value; });
        imp.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); runReplayImport(); } });
      }
      var details = document.getElementById('replay-import');
      if (details && !details.__bound) {
        details.__bound = true;
        details.addEventListener('toggle', function() { state.replay.importOpen = details.open; });
      }
      var active = el.querySelector('.replay-event-active');
      var list = document.getElementById('replay-list');
      if (active && list) {
        var top = active.offsetTop - list.offsetTop;
        if (top < list.scrollTop || top > list.scrollTop + list.clientHeight - active.offsetHeight) list.scrollTop = Math.max(0, top - list.clientHeight / 2);
      }
      if (focusAction) {
        var again = el.querySelector('[data-action="' + focusAction + '"]' + (focusKey ? '[data-speed="' + focusKey + '"], [data-action="' + focusAction + '"][data-dir="' + focusKey + '"]' : ''));
        if (again && document.activeElement !== again) again.focus();
      }
    }

    async function selectReplaySession(id) {
      var r = state.replay;
      stopReplayTimer();
      r.selectedId = id;
      r.timeline = null;
      r.cursor = 0;
      r.offsetAt = 0;
      r.playing = false;
      r.loadError = '';
      if (!id) { renderReplay(); return; }
      r.loadingTimeline = true;
      renderReplay();
      var res = await apiGet('replay/load?sessionId=' + encodeURIComponent(id));
      if (r.selectedId !== id) return;
      r.loadingTimeline = false;
      if (res && res.success && res.timeline) r.timeline = res.timeline;
      else if (res && res.error) r.loadError = 'Could not load this session: ' + esc(res.error) + '.';
      else if (!res) r.loadError = 'The replay request failed. Check that agentmemory is running, then pick the session again.';
      else r.timeline = { events: [], eventCount: 0, totalDurationMs: 0 };
      renderReplay();
    }

    function toggleReplayPlay() {
      var r = state.replay;
      if (!r.timeline || !r.timeline.eventCount) return;
      if (r.playing) stopReplayTimer();
      else {
        if (r.offsetAt >= r.timeline.totalDurationMs) { r.cursor = 0; r.offsetAt = 0; }
        startReplayTimer();
      }
      renderReplay();
    }

    function startReplayTimer() {
      var r = state.replay;
      r.playing = true;
      r.startAt = Date.now();
      var baseOffset = r.offsetAt;
      if (r.timer) clearInterval(r.timer);
      r.timer = setInterval(function() {
        if (!r.timeline) return;
        r.offsetAt = baseOffset + (Date.now() - r.startAt) * r.speed;
        var events = r.timeline.events;
        var next = r.cursor;
        for (var i = next; i < events.length; i++) {
          if (events[i].offsetMs <= r.offsetAt) next = i;
          else break;
        }
        var changed = next !== r.cursor;
        r.cursor = next;
        if (r.offsetAt >= r.timeline.totalDurationMs) {
          r.offsetAt = r.timeline.totalDurationMs;
          stopReplayTimer();
          renderReplay();
          return;
        }
        if (changed) renderReplay();
      }, 100);
    }

    function stopReplayTimer() {
      state.replay.playing = false;
      if (state.replay.timer) {
        clearInterval(state.replay.timer);
        state.replay.timer = null;
      }
    }

    function jumpReplay(idx) {
      var r = state.replay;
      if (!r.timeline || !r.timeline.eventCount) return;
      stopReplayTimer();
      r.cursor = Math.max(0, Math.min(idx, r.timeline.eventCount - 1));
      r.offsetAt = r.timeline.events[r.cursor].offsetMs;
      renderReplay();
    }

    function stepReplay(dir) {
      if (!state.replay.timeline) return;
      jumpReplay(state.replay.cursor + dir);
    }

    function setReplaySpeed(sp) {
      if (!sp || sp <= 0) return;
      var wasPlaying = state.replay.playing;
      stopReplayTimer();
      state.replay.speed = sp;
      if (wasPlaying) startReplayTimer();
      renderReplay();
    }

    function resetReplay() {
      stopReplayTimer();
      state.replay.cursor = 0;
      state.replay.offsetAt = 0;
      renderReplay();
    }

    async function runReplayImport() {
      var r = state.replay;
      if (r.importing) return;
      var input = document.getElementById('replay-import-path');
      var pathVal = input ? input.value.trim() : String(r.importPath || '').trim();
      r.importPath = pathVal;
      r.importing = true;
      r.importOpen = true;
      r.importStatus = { html: 'Importing ' + esc(pathVal || '~/.claude/projects') + '… large folders can take a minute.' };
      renderReplay();
      var res = await api('replay/import-jsonl', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pathVal ? { path: pathVal } : {}), readErrorBody: true });
      r.importing = false;
      if (!res || res.success === false || res.error) {
        var reason = res && res.error ? String(res.error) : 'the request failed. Check that agentmemory is running.';
        var hint = /not found/.test(reason) ? ' Check the path; it is read on the machine agentmemory runs on.' : /\.jsonl/.test(reason) ? ' Point it at one .jsonl file or a folder that contains them.' : '';
        r.importStatus = { err: true, html: 'Import failed: ' + esc(reason.replace(/[.\s]+$/, '')) + '.' + hint };
      } else if (!res.imported) {
        r.importStatus = { err: true, html: 'No .jsonl transcripts found under ' + esc(pathVal || '~/.claude/projects') + '. Nothing was imported.' };
      } else {
        var ids = res.sessionIds || [];
        r.importStatus = { html: 'Imported ' + fmtNum(res.imported) + ' file' + (res.imported === 1 ? '' : 's') + ' with ' + fmtNum(res.observations || 0) + ' observations' + (res.truncated ? ' (stopped at ' + fmtNum(res.maxFiles) + ' files; pass maxFiles to import more)' : '') + '. ' + (ids.length ? 'New sessions: ' + ids.slice(0, 6).map(function(id) { return '<a class="entity-link" href="#replay" data-replay-session="' + esc(id) + '">' + esc(shortId(id, 18)) + '</a>'; }).join(' ') + (ids.length > 6 ? ' +' + (ids.length - 6) + ' more' : '') + '. They also appear on Sessions.' : '') };
      }
      renderReplay();
    }

    document.addEventListener('keydown', function(e) {
      if (state.activeTab !== 'replay') return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.tagName === 'SUMMARY' || (t.tagName === 'BUTTON' && e.key === ' '))) return;
      if (document.getElementById('modal-overlay').classList.contains('open')) return;
      if (e.key === ' ') { e.preventDefault(); toggleReplayPlay(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); stepReplay(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); stepReplay(1); }
    });

    var bootRoute = parseRoute(window.location.hash);
    switchTab(bootRoute.tab, { replaceRoute: true, skipRoute: !!bootRoute.obs && !bootRoute.redirect, id: bootRoute.id, obs: bootRoute.obs });
    (async function initWs() {
      try {
        var live = await api('livez', { signal: AbortSignal.timeout(5000) });
        if (live && typeof live.streamsPort === 'number' && live.streamsPort > 0) {
          WS_URL = wsProto + '//' + window.location.hostname + ':' + live.streamsPort;
          WS_DIRECT_URL = WS_URL + '/stream/mem-live/viewer';
        }
      } catch (_) {}
      connectWs();
    })();
    setTimeout(function() {
      if (wsHasConnected) return;
      openBootGate();
      loadSnapshot();
      showTab(state.activeTab);
    }, 4000);

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState !== 'visible') return;
      var ws = state.ws;
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
      wsRetries = 0;
      reconnectNow();
    });

    setInterval(function() {
      document.querySelectorAll('time.rel-time[datetime]').forEach(function(el) {
        var text = timeAgo(el.getAttribute('datetime'));
        if (el.textContent !== text) el.textContent = text;
      });
      if (conn.state === 'live') renderConnection();
    }, 15000);

    // Ambient background: an ordered-dither dot field that drifts very
    // slowly — the print-halftone cousin of the old static dot grid.
    // Renders at quarter resolution and ~12fps; a single static frame
    // under prefers-reduced-motion.
    (function ditherField() {
      var cv = document.getElementById('bg-dither');
      if (!cv || !cv.getContext) return;
      var ctx = cv.getContext('2d');
      var BAYER = [
        [0, 8, 2, 10],
        [12, 4, 14, 6],
        [3, 11, 1, 9],
        [15, 7, 13, 5]
      ];
      var CELL = 7;
      var t = 0;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function dotColor() {
        return document.documentElement.getAttribute('data-theme') === 'dark'
          ? 'rgba(150, 154, 162, 0.16)'
          : 'rgba(90, 90, 84, 0.14)';
      }

      function draw() {
        var w = cv.width = Math.ceil(window.innerWidth / 2);
        var h = cv.height = Math.ceil(window.innerHeight / 2);
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = dotColor();
        var cols = Math.ceil(w / CELL) + 1;
        var rows = Math.ceil(h / CELL) + 1;
        for (var y = 0; y < rows; y++) {
          for (var x = 0; x < cols; x++) {
            // Slow luminance swells drifting diagonally; the Bayer
            // threshold turns them into stable ordered-dither dots.
            var v =
              0.5 +
              0.5 *
                Math.sin(x * 0.11 + t * 0.013) *
                Math.cos(y * 0.13 - t * 0.011);
            if (v * 16 > BAYER[y % 4][x % 4] + 6.5) {
              ctx.fillRect(x * CELL, y * CELL, 1.4, 1.4);
            }
          }
        }
      }

      draw();
      var lastFrame = 0;
      function frame(now) {
        if (document.hidden) return;
        if (now - lastFrame >= 85) {
          lastFrame = now;
          t++;
          draw();
        }
        requestAnimationFrame(frame);
      }
      if (!reduced) {
        requestAnimationFrame(frame);
        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) requestAnimationFrame(frame);
        });
      }
      window.addEventListener('resize', draw);
      new MutationObserver(draw).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });
    })();
  </script>
</body>
</html>
