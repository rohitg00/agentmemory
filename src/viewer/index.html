<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agentmemory viewer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Removed Google Fonts <link> in #323: the viewer CSP is strict
       (default-src 'none', style-src 'unsafe-inline', font-src 'self')
       and external stylesheets from fonts.googleapis.com were blocked,
       producing console CSP violations that some browsers (Windows
       Edge in particular) escalate into broader script-execution
       issues. System-font fallbacks are already declared on every
       --font-* CSS variable below, so the viewer renders fine with
       Georgia / system serif / system sans / system mono. -->
  <style>
    :root {
      --bg: #F9F9F7;
      --bg-alt: #F0F0EC;
      --bg-subtle: #F4F4F0;
      --bg-inset: #E8E8E3;
      --border: #111111;
      --border-light: #D4D4CF;
      --border-heavy: #111111;
      --ink: #111111;
      --ink-secondary: #333333;
      --ink-muted: #666666;
      --ink-faint: #999999;
      --accent: #CC0000;
      --accent-light: #FF1A1A;
      --cream: #F5F0E8;
      --node-file: #2D6A4F;
      --node-function: #1D4E89;
      --node-concept: #B8860B;
      --node-error: #CC0000;
      --node-decision: #6B3FA0;
      --node-pattern: #2563EB;
      --node-library: #C2410C;
      --node-person: #111111;
      --green: #2D6A4F;
      --blue: #1D4E89;
      --yellow: #B8860B;
      --red: #CC0000;
      --purple: #6B3FA0;
      --orange: #C2410C;
      --cyan: #0E7490;
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-body: 'Lora', Georgia, serif;
      --font-ui: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    }
    html[data-theme="dark"] {
      --bg: #121316;
      --bg-alt: #1a1c20;
      --bg-subtle: #17181b;
      --bg-inset: #222428;
      --border: #33363b;
      --border-light: #26282c;
      --border-heavy: #c9cbd1;
      --ink: #eef0f3;
      --ink-secondary: #c6c9ce;
      --ink-muted: #94979d;
      --ink-faint: #6d7076;
      --accent: #f2555a;
      --accent-light: #ff7a70;
      --cream: #2a2520;
    }
    html[data-theme="dark"] .graph-tooltip {
      background: rgba(30,30,35,0.92);
      border-color: rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    html[data-theme="dark"] .graph-controls button {
      background: rgba(30,30,35,0.92);
      border-color: rgba(255,255,255,0.1);
    }
    html[data-theme="dark"] .graph-controls button:hover {
      background: var(--ink);
      color: var(--bg);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #bg-dither {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }
    .app-header, .tab-bar, .view, .flags-banner, footer, .app-footer { position: relative; z-index: 1; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink-secondary);
      line-height: 1.6;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); }

    .app-header {
      padding: 10px 24px;
      border-bottom: 4px solid var(--border-heavy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      flex: 0 0 auto;
      position: relative;
      z-index: 3;
    }
    .app-header .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .app-header .brand:hover h1,
    .app-header .brand:focus-visible h1 { color: var(--accent); }
    .app-header .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .app-header .brand h1 {
      font-size: 22px;
      color: var(--ink);
      font-weight: 900;
      font-family: var(--font-display);
      letter-spacing: -0.02em;
      text-transform: lowercase;
    }
    .app-header .brand .version {
      font-size: 10px;
      color: var(--ink-faint);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 720px) {
      .app-header { flex-wrap: wrap; row-gap: 6px; padding: 10px 16px; }
      .app-header .dateline { display: none; }
      .view { overflow-x: auto; }
    }
    .ws-status {
      font-size: 10px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      border: 1px solid var(--border-light);
    }
    .ws-status::before {
      content: '';
      width: 6px;
      height: 6px;
      display: inline-block;
    }
    .ws-status.connected { border-color: var(--green); color: var(--green); }
    .ws-status.connected::before { background: var(--green); animation: live-pulse 2.4s ease-in-out infinite; }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .ws-status.disconnected { border-color: var(--ink-faint); color: var(--ink-faint); }
    .ws-status.disconnected::before { background: var(--ink-faint); }

    .tab-bar {
      display: flex;
      height: 48px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg);
      overflow-x: auto;
      flex: 0 0 auto;
      position: relative;
      z-index: 2;
    }
    .tab-bar button {
      background: none;
      border: none;
      color: var(--ink-muted);
      padding: 10px 20px;
      font-size: 11px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-bar button:hover { color: var(--ink); }
    .tab-bar button.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    .view { display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 24px; }
    .view.active { display: block; animation: view-in 160ms ease-out; }
    @keyframes view-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .view.active { animation: none; }
      .ws-status.connected::before { animation: none; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .stat-card {
      background: var(--bg);
      padding: 16px 20px;
      border-right: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }
    .stat-card:last-child { border-right: none; }
    .stat-card[data-action] {
      cursor: pointer;
      transition: background 0.15s ease-out;
    }
    .stat-card[data-action]:hover { background: var(--bg-alt); }
    .stat-card[data-action]:hover .label { color: var(--accent); }
    .stat-card[data-action]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .stat-card[data-action]:active { background: var(--bg-inset); }
    .stat-card .label {
      font-size: 9px;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 4px;
      font-family: var(--font-ui);
      font-weight: 600;
    }
    .stat-card .value {
      font-size: 32px;
      font-weight: 900;
      color: var(--ink);
      font-family: var(--font-display);
      line-height: 1.1;
    }
    .stat-card .sub {
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 2px;
      font-family: var(--font-ui);
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 20px;
      margin-bottom: 16px;
      transition: box-shadow 0.15s;
    }
    .card:hover {
      box-shadow: 4px 4px 0px 0px var(--border);
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
    }

    .health-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .health-dot {
      width: 10px;
      height: 10px;
    }
    .health-dot.healthy { background: var(--green); }
    .health-dot.degraded { background: var(--yellow); }
    .health-dot.critical { background: var(--accent); }

    .badge {
      display: inline-block;
      font-size: 9px;
      padding: 2px 8px;
      font-weight: 600;
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid;
    }
    .badge-blue { border-color: var(--blue); color: var(--blue); background: transparent; }
    .badge-green { border-color: var(--green); color: var(--green); background: transparent; }
    .badge-yellow { border-color: var(--yellow); color: var(--yellow); background: transparent; }
    .badge-red { border-color: var(--accent); color: var(--accent); background: transparent; }
    .badge-purple { border-color: var(--purple); color: var(--purple); background: transparent; }
    .badge-orange { border-color: var(--orange); color: var(--orange); background: transparent; }
    .badge-cyan { border-color: var(--cyan); color: var(--cyan); background: transparent; }
    .badge-muted { border-color: var(--border-light); color: var(--ink-muted); background: transparent; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-family: var(--font-body);
      font-variant-numeric: tabular-nums;
    }
    th {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 2px solid var(--border);
      color: var(--ink);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      font-family: var(--font-ui);
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }
    tr:hover td { background: var(--bg-alt); }

    .strength-bar {
      width: 60px;
      height: 4px;
      background: var(--bg-inset);
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
    }
    .strength-bar .fill {
      height: 100%;
      transition: width 0.3s;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar input, .toolbar select, .search-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 7px 12px;
      font-size: 13px;
      outline: none;
      font-family: var(--font-ui);
    }
    .toolbar input:focus, .toolbar select:focus, .search-input:focus {
      border-color: var(--ink);
      box-shadow: 2px 2px 0px 0px var(--border);
    }
    .toolbar input { flex: 1; min-width: 200px; }

    .btn, .toolbar button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 7px 16px;
      font-size: 11px;
      cursor: pointer;
      transition: box-shadow 0.1s, transform 0.1s;
      font-family: var(--font-ui);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .btn:hover, .toolbar button:hover { box-shadow: 3px 3px 0px 0px var(--border); transform: translate(-1px, -1px); }
    .btn:active, .toolbar button:active { box-shadow: none; transform: translate(0, 0); }
    .btn-danger { border-color: var(--accent); color: var(--accent); }
    .btn-danger:hover { background: var(--accent); color: white; box-shadow: 3px 3px 0px 0px var(--border); }
    .btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .btn-primary:hover { background: var(--ink-secondary); box-shadow: 3px 3px 0px 0px var(--ink-muted); }

    .graph-container {
      display: flex;
      height: calc(100vh - 178px);
      min-height: 460px;
      margin: -24px;
      border-top: 1px solid var(--border-light);
    }
    .graph-canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }
    .graph-canvas-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .graph-sidebar {
      width: 260px;
      border-left: 2px solid var(--border);
      padding: 20px;
      overflow-y: auto;
      background: var(--bg);
    }
    .graph-sidebar h3 {
      font-size: 9px;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 12px;
      font-family: var(--font-ui);
      font-weight: 600;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-light);
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      font-size: 12px;
      cursor: pointer;
      font-family: var(--font-ui);
    }
    .filter-item input[type="checkbox"] {
      accent-color: var(--ink);
    }
    .filter-dot {
      width: 8px;
      height: 8px;
      display: inline-block;
    }
    .graph-info {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-light);
    }
    .graph-info .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 3px 0;
      font-family: var(--font-ui);
    }
    .graph-info .info-row .info-label { color: var(--ink-muted); }
    .graph-info .info-row .info-value { color: var(--ink); font-weight: 600; font-family: var(--font-mono); }

    .obs-card {
      background: var(--bg);
      border: 1px solid var(--border-light);
      padding: 16px 20px;
      margin-bottom: 12px;
      border-left: 3px solid var(--border-light);
      transition: box-shadow 0.15s;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }
    .obs-card:hover { box-shadow: 3px 3px 0px 0px var(--border-light); }
    .obs-card.imp-high { border-left-color: var(--accent); }
    .obs-card.imp-med { border-left-color: var(--yellow); }
    .obs-card.imp-low { border-left-color: var(--green); }
    .obs-card .obs-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 12px;
      margin-bottom: 6px;
    }
    .obs-card .obs-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .obs-card .obs-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .obs-card .obs-type-icon {
      flex: 0 0 auto;
    }
    .obs-card .obs-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      font-family: var(--font-display);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .obs-card .obs-time {
      font-size: 10px;
      color: var(--ink-faint);
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
    }
    .obs-card .obs-narrative {
      font-size: 13px;
      color: var(--ink-muted);
      margin-bottom: 6px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .obs-card pre {
      max-width: 100%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .obs-card .obs-facts {
      margin: 6px 0 6px 16px;
      font-size: 12px;
      color: var(--ink-muted);
    }
    .obs-card .obs-facts li { margin-bottom: 2px; }
    .tag-list { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    mark { background: rgba(204, 0, 0, 0.12); color: var(--ink); padding: 0 2px; border-radius: 2px; }
    .tag {
      font-size: 10px;
      padding: 1px 6px;
      border: 1px solid var(--blue);
      color: var(--blue);
      font-family: var(--font-mono);
      font-weight: 500;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tag.file-tag { border-color: var(--green); color: var(--green); }

    /* Two-pane sessions: list left, detail pinned right on wide screens.
       The detail panel previously rendered below the full list — selecting
       a session on any real corpus put the response off-screen. */
    .sessions-layout {
      display: grid;
      grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    .sessions-layout #session-detail { position: sticky; top: 0; min-width: 0; }
    .sessions-layout #session-detail .detail-panel { margin-top: 0; }
    @media (max-width: 1100px) {
      .sessions-layout { grid-template-columns: 1fr; }
      .sessions-layout #session-detail { position: static; }
    }
    .session-list { display: flex; flex-direction: column; gap: 0; }
    .session-item {
      background: var(--bg);
      border: 1px solid var(--border-light);
      border-bottom: none;
      border-left: 3px solid transparent;
      padding: 14px 20px;
      cursor: pointer;
      transition: background 0.15s ease-out, border-color 0.15s ease-out;
    }
    .session-item:last-child { border-bottom: 1px solid var(--border-light); }
    .session-item:hover { background: var(--bg-alt); border-left-color: var(--border-light); }
    .session-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .session-item:active { background: var(--bg-inset); }
    .session-item.selected { background: var(--bg-alt); border-left-color: var(--accent); }
    .session-item .session-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .session-item .session-project {
      font-weight: 700;
      color: var(--ink);
      font-size: 14px;
      font-family: var(--font-display);
    }
    .session-item .session-meta {
      font-size: 11px;
      color: var(--ink-muted);
      font-family: var(--font-mono);
    }

    .detail-panel {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 24px;
      margin-top: 20px;
    }
    .detail-panel h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 16px;
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }
    .detail-row {
      display: flex;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid var(--bg-inset);
    }
    .detail-row .dl { color: var(--ink-muted); width: 140px; flex-shrink: 0; font-family: var(--font-ui); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; padding-top: 2px; }
    .detail-row .dv { color: var(--ink); font-family: var(--font-body); }

    .audit-entry {
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }
    .audit-entry:last-child { border-bottom: none; }
    .audit-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .audit-detail {
      font-size: 12px;
      color: var(--ink-faint);
      margin-top: 4px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s;
    }
    .audit-detail.open { max-height: 200px; }
    .audit-detail pre {
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--bg-alt);
      padding: 10px;
      border: 1px solid var(--border-light);
      overflow-x: auto;
    }

    .bar-chart { margin-top: 8px; }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .bar-label { width: 120px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 11px; }
    .bar-track {
      flex: 1;
      height: 6px;
      background: var(--bg-inset);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.3s;
    }
    .bar-value { width: 30px; text-align: right; color: var(--ink-muted); font-size: 11px; font-family: var(--font-mono); font-weight: 500; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--ink-faint);
    }
    .empty-state .empty-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.4; }

    /* ---- Phase 2: locale picker + zh-CN CJK typography.
       The picker base styles below are the one intentional visual change
       in en mode (the control was previously an unstyled native select).
       Every other rule in this block is scoped to html[lang="zh-CN"],
       so lang="en" renders exactly as before. ---- */
    html:lang(zh-CN) .header-right { flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; }
    .locale-picker { display: inline-flex; align-items: center; }
    #locale-switcher {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0;
      padding: 3px 6px;
      max-width: 132px;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: box-shadow 0.1s, transform 0.1s;
    }
    #locale-switcher:hover { box-shadow: 3px 3px 0px 0px var(--border); transform: translate(-1px, -1px); }
    #locale-switcher:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--ink); box-shadow: 2px 2px 0px 0px var(--border); }
    @media (max-width: 720px) {
      #locale-switcher { max-width: 118px; }
    }
    @media (max-width: 420px) {
      #locale-switcher { padding: 2px 4px; max-width: 104px; }
    }

    /* ---- :lang(zh-CN) CJK overrides. :lang() inherits from
       documentElement.lang (set by setLocale), so no per-element
       [lang] attributes are needed. ---- */
    /* CJK font fallbacks live here — scoped, not on :root — so en keeps
       byte-identical font stacks and renders exactly as before. Latin
       fonts stay first; CJK families append after them. Serif stacks
       prefer a CJK serif, the UI stack a CJK sans, mono gets a CJK mono
       plus sans fallbacks for Han glyphs. All are local system fonts,
       so CSP font-src 'self' (no webfonts) is respected. */
    html:lang(zh-CN) {
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', 'Noto Serif SC', serif;
      --font-body: 'Lora', Georgia, 'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', 'Noto Serif SC', serif;
      --font-ui: 'Inter', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Noto Sans Mono CJK SC', 'Sarasa Mono SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', monospace;
    }
    /* Native controls (select popup, scrollbar) follow the OS theme by
       default; color-scheme pulls them into the viewer theme in zh mode. */
    html:lang(zh-CN) { color-scheme: light; }
    html:lang(zh-CN)[data-theme="dark"] { color-scheme: dark; }

    /* 1. Line height: Latin-tight leading clips CJK glyphs. Body is
       already 1.6, so it only moves to 1.7; tight display numerals and
       1.4/1.5 prose move up. Inline styles need !important; the selector
       is limited to divs so <pre> code blocks keep their leading. */
    html:lang(zh-CN) body { line-height: 1.7; }
    html:lang(zh-CN) .stat-card .value { line-height: 1.3; }
    html:lang(zh-CN) .flag-banner .flag-desc,
    html:lang(zh-CN) .viewer-auth-desc,
    html:lang(zh-CN) .empty-state .empty-lead { line-height: 1.7; }
    .view .prose { line-height: 1.5; }
    html:lang(zh-CN) .view .prose { line-height: 1.7; }
    .view .prose-tight { line-height: 1.4; }
    html:lang(zh-CN) .view .prose-tight { line-height: 1.7; }

    .dashboard-uptime { letter-spacing: 0.04em; }
    .dashboard-auto-refresh { letter-spacing: 0.08em; text-transform: uppercase; }
    .graph-section-title { text-transform: uppercase; letter-spacing: 0.12em; }
    .graph-sidebar h3.graph-section-title { text-transform: uppercase; letter-spacing: 0.12em; }
    .graph-stat-label { text-transform: uppercase; letter-spacing: 0.12em; }
    .timeline-count { text-transform: uppercase; letter-spacing: 0.06em; }
    .timeline-io-label { text-transform: uppercase; letter-spacing: 0.08em; }
    .sessions-stat-label { letter-spacing: 0.08em; }
    .lessons-why-learned { text-transform: uppercase; letter-spacing: 0.1em; }
    .crystals-section-label { text-transform: uppercase; letter-spacing: 0.08em; }

    /* 2. Letter spacing: Han characters must not be tracked out.
       Translatable micro-labels keep their English tracking in stylesheet
       classes and are neutralized by the html:lang(zh-CN) selectors below.
       Deliberately untouched: the agentmemory brand wordmark (.brand h1),
       version stamp (.brand .version), identifier/tag/mono elements (.tag,
       .bar-label, .metric-fn, .metric-num, .gauge-value,
       .graph-info .info-value, pre, code, .obs-importance), and other
       non-translatable Latin detail. No translatable JS-generated element
       retains inline letter-spacing. The only intentional !important
       override is #theme-toggle, whose text becomes Chinese (深色/浅色)
       while carrying an inline 0.1em style. */
    html:lang(zh-CN) .ws-status,
    html:lang(zh-CN) .tab-bar button,
    html:lang(zh-CN) .stat-card .label,
    html:lang(zh-CN) .card-title,
    html:lang(zh-CN) .badge,
    html:lang(zh-CN) th,
    html:lang(zh-CN) .metric-table th,
    html:lang(zh-CN) .detail-panel h3,
    html:lang(zh-CN) .detail-row .dl,
    html:lang(zh-CN) .graph-sidebar h3,
    html:lang(zh-CN) .replay-event-kind,
    html:lang(zh-CN) .cb-indicator,
    html:lang(zh-CN) .gauge-label,
    html:lang(zh-CN) .graph-tooltip .tt-type,
    html:lang(zh-CN) .type-chip,
    html:lang(zh-CN) .dateline,
    html:lang(zh-CN) .timeline-date-marker span,
    html:lang(zh-CN) .viewer-footer,
    html:lang(zh-CN) .obs-card .obs-time,
    html:lang(zh-CN) .btn,
    html:lang(zh-CN) .toolbar button,
    html:lang(zh-CN) .dashboard-kicker,
    html:lang(zh-CN) .dashboard-uptime,
    html:lang(zh-CN) .dashboard-auto-refresh,
    html:lang(zh-CN) .graph-section-title,
    html:lang(zh-CN) .graph-stat-label,
    html:lang(zh-CN) .timeline-count,
    html:lang(zh-CN) .timeline-io-label,
    html:lang(zh-CN) .sessions-stat-label,
    html:lang(zh-CN) .lessons-why-learned,
    html:lang(zh-CN) .crystals-section-label { letter-spacing: 0; }
    html:lang(zh-CN) #theme-toggle { letter-spacing: 0 !important; }

    /* 3. text-transform: no rule. Audited all 20 occurrences (19 in the
       style block + hardcoded English inline strings): uppercase is a
       no-op on Han characters, and every translated string is either pure
       Han (no-op) or an intentional Latin token whose case is part of the
       brutalist micro-detail (e.g. nav "Replay" rendering as "REPLAY",
       "MCP"/"API" tokens inside mixed labels). Neutralizing any of them
       would change Latin rendering in zh mode with no CJK gain. Revisit
       only if a future translation introduces case-sensitive mixed text. */

    /* 4. Overflow / line breaking: CJK has no spaces, so long strings
       need somewhere to break. line-break: strict only affects CJK
       breaking and is a no-op for Latin. Code, paths and identifiers
       (pre, code, .tag, .metric-fn, .bar-label) keep their existing
       ellipsis / break settings. */
    html:lang(zh-CN) .obs-card .obs-narrative,
    html:lang(zh-CN) .obs-card .obs-facts,
    html:lang(zh-CN) .flag-banner .flag-desc,
    html:lang(zh-CN) .viewer-auth-desc,
    html:lang(zh-CN) .empty-state .empty-lead,

      overflow-wrap: anywhere;
      line-break: strict;

    /* Flex children default to min-width: auto, which lets a long
       unbroken CJK string push past its container. */
    html:lang(zh-CN) .detail-row .dv,
    html:lang(zh-CN) .session-item .session-project { min-width: 0; }

    function bindImeSafeSearch(input, ms, onSearch) {
      var composing = false;

      input.addEventListener('compositionstart', function() { composing = true; });
      input.addEventListener('compositionend', function() {

    async function api(path, opts) {
      try {
        var url = REST + '/agentmemory/' + path;
        var headers = Object.assign({ 'Cache-Control': 'no-cache' }, (opts && opts.headers) || {});
        var viewerToken = getViewerToken();
        if (viewerToken && !headers.Authorization && !headers.authorization) {
          headers.Authorization = 'Bearer ' + viewerToken;
        }
        var fetchOpts = Object.assign({}, opts || {}, { headers: headers });
        var readErrorBody = fetchOpts.readErrorBody;
        delete fetchOpts.readErrorBody;
        var res = await fetch(url, fetchOpts);
        if (!res.ok) {
          if (res.status === 401) showViewerAuthPrompt();
          console.warn('[viewer] API ' + (fetchOpts.method || 'GET') + ' ' + path + ' returned ' + res.status);
          // Non-2xx responses resolve to null so callers can keep treating
          // null as "request failed" (e.g. loadGraph's disabled/error state).
          // The health endpoint opts out via readErrorBody: it intentionally
          // responds 503 with a valid JSON body when status is "critical"
          // (see #1019), and the dashboard badge needs that body.
          if (!readErrorBody) return null;
          try {
            return await res.json();
          } catch (parseErr) {
            console.debug('[viewer] API ' + path + ' non-2xx body was not JSON:', parseErr);
            return null;
          }
        }
        hideViewerAuthPrompt();
        return await res.json();
      } catch (err) {
        console.warn('[viewer] API error on ' + path + ':', err);
        return null;
      }
    }

    function normalizeTab(tab) {

    // Per-tab freshness stamps. Tabs refetch on entry (the loaded-once

    var tabFetchedAt = {};

    async function loadTab(tab) {
      var now = Date.now();
      if (tab !== 'replay' && tabFetchedAt[tab] && now - tabFetchedAt[tab] < TAB_FRESH_MS) {
        return;
      }
      tabFetchedAt[tab] = now;
      switch(tab) {
        case 'dashboard': await loadDashboard(); break;
        case 'graph': await loadGraph(); break;

    var dashboardTimer = null;
    function refreshDashboard() {
      state.dashboard.loaded = false;
      loadDashboard();
    }
    function startDashboardAutoRefresh() {
      if (dashboardTimer) clearInterval(dashboardTimer);
      dashboardTimer = setInterval(function() {
        if (pollTimer) return;
        if (state.activeTab === 'dashboard') refreshDashboard();
      }, 30000);
    }

    var graphSim = { nodes: [], edges: [], running: false, canvas: null, ctx: null, raf: null, panX: 0, panY: 0, zoom: 1, dragNode: null, mouseX: 0, mouseY: 0, tickCount: 0, quietTicks: 0 };
    function wakeGraphSim() {
      graphSim.quietTicks = 0;
      if (graphSim.running && !graphSim.raf) {
        graphSim.raf = requestAnimationFrame(runSimulation);
      }
    }

    // #753: previously POST'd `{}` and let the engine return the full
    // graph. On 10k+ nodes the payload exceeded the iii state channel
    // limit and the engine returned HTTP 500, leaving the tab blank
    // with no signal. Now we pass an explicit `limit`, distinguish
    // server error from empty-corpus, and render an actionable banner
    // when the request itself fails instead of falling silent.
    var GRAPH_INITIAL_LIMIT = 500;

    async function loadGraph() {
      var el = document.getElementById('view-graph');
      el.innerHTML = '<div class="graph-container"><div class="graph-canvas-wrap"><canvas id="graph-canvas"></canvas><div class="graph-controls"><button title="' + t('graph.controls.zoomIn') + '" data-action="zoom-graph" data-dir="1">+</button><button title="' + t('graph.controls.zoomOut') + '" data-action="zoom-graph" data-dir="-1">&minus;</button><div class="ctrl-divider"></div><button title="' + t('graph.controls.recenter') + '" data-action="recenter-graph">⌖</button></div><div class="graph-tooltip" id="graph-tooltip"></div></div><div class="graph-sidebar" id="graph-sidebar"></div></div>';

      var results = await Promise.all([
        apiPost('graph/query', { limit: GRAPH_INITIAL_LIMIT }),
        api('graph/stats', { readErrorBody: true })
      ]);
      var queryResult = results[0];
      var statsResult = results[1];
      if (statsResult && statsResult.error && statsResult.flag) {
        // 503 with a structured body = the feature is off, not broken.
        // Rendering this as "query failed / Retry" sends users hunting
        // through server logs for an error that isn't one.
        state.graph.disabledInfo = statsResult;
        state.graph.queryError = null;
        state.graph.nodes = [];
        state.graph.edges = [];
        state.graph.stats = {};
        state.graph.loaded = true;
        renderGraphSidebar();
        return;
      }
      state.graph.disabledInfo = null;
      if (queryResult === null) {
        // api() returns null only on non-2xx or a transport error; an
        // empty graph would come back as { nodes: [], edges: [] }.
        // Surface as an error state so #753-class failures don't read
        // as "no data yet" — and so "Rebuild Graph" stays available.
        state.graph.queryError = t('graph.error.detailsQuery');
        state.graph.nodes = [];
        state.graph.edges = [];
        state.graph.stats = results[1] || {};
        state.graph.loaded = true;
        renderGraphSidebar();
        return;
      }
      state.graph.queryError = null;
      state.graph.nodes = queryResult.nodes || [];
      state.graph.edges = queryResult.edges || [];
      state.graph.truncated = queryResult.truncated === true;
      state.graph.totalNodes = typeof queryResult.totalNodes === 'number' ? queryResult.totalNodes : state.graph.nodes.length;
      state.graph.totalEdges = typeof queryResult.totalEdges === 'number' ? queryResult.totalEdges : state.graph.edges.length;
      state.graph.stats = results[1] || {};

      if (state.graph.nodes.length === 0 && (state.graph.stats.totalNodes || state.graph.stats.nodes || 0) === 0) {
        var sb = document.getElementById('graph-sidebar');
        if (sb) sb.innerHTML = '<h3>' + t('graph.title') + '</h3><p class="prose" style="font-size:12px;color:var(--ink-faint);margin:8px 0;font-style:italic;">' + t('graph.empty.building') + '</p>';
        var buildResult = await apiPost('graph/build', {});
        if (buildResult && buildResult.success && buildResult.nodes > 0) {
          var freshResults = await Promise.all([
            apiPost('graph/query', { limit: GRAPH_INITIAL_LIMIT }),
            apiGet('graph/stats')
          ]);
          var freshQuery = freshResults[0];
          if (freshQuery) {
            state.graph.nodes = freshQuery.nodes || [];
            state.graph.edges = freshQuery.edges || [];
            state.graph.truncated = freshQuery.truncated === true;
            state.graph.totalNodes = typeof freshQuery.totalNodes === 'number' ? freshQuery.totalNodes : state.graph.nodes.length;
            state.graph.totalEdges = typeof freshQuery.totalEdges === 'number' ? freshQuery.totalEdges : state.graph.edges.length;
          }
          state.graph.stats = freshResults[1] || {};
        }
      }

      state.graph.loaded = true;
      var types = {};
      state.graph.nodes.forEach(function(n) { types[n.type] = true; });
      state.graph.filters = types;

      renderGraphSidebar();
      initGraph();
    }

    var NODE_SHAPES = {

    function renderGraphSidebar() {
      var sb = document.getElementById('graph-sidebar');

      var gs = state.graph.stats || {};
      var nodeCount = gs.totalNodes !== undefined ? gs.totalNodes : (gs.nodes !== undefined ? gs.nodes : (gs.nodeCount || state.graph.nodes.length));

      var html = '';

        if (state.graph.disabledInfo.docsHref) {
          html += '<a href="' + esc(state.graph.disabledInfo.docsHref) + '" target="_blank" rel="noopener" style="font-size:11px;">' + t('graph.disabled.docs') + '</a>';

        html += '<div style="font-weight:600;margin-bottom:4px;">' + t('graph.error.query') + '</div>';

        html += '<button class="btn" data-action="rebuild-graph" style="margin-top:8px;font-size:11px;">' + t('graph.actions.retry') + '</button>';

      html += '<input type="text" class="graph-search" id="graph-search" placeholder="' + t('graph.search.placeholder') + '">';

      html += '<h3 class="graph-section-title" style="margin-top:16px;font-size:10px;color:var(--ink-muted);font-family:var(--font-ui);font-weight:700;">' + t('graph.stats.title') + '</h3>';
      html += '<div style="display:flex;gap:20px;margin:10px 0 16px;padding:12px;background:var(--bg-alt);border:1px solid var(--border-light);border-radius:4px;">';
      html += '<div style="text-align:center;flex:1;"><span style="font-size:28px;font-weight:900;font-family:var(--font-display);color:var(--ink);line-height:1;">' + nodeCount + '</span><div class="graph-stat-label" style="font-size:8px;color:var(--ink-faint);font-family:var(--font-ui);font-weight:600;margin-top:4px;">' + t('graph.stats.nodes') + '</div></div>';
      html += '<div style="width:1px;background:var(--border-light);"></div>';
      html += '<div style="text-align:center;flex:1;"><span style="font-size:28px;font-weight:900;font-family:var(--font-display);color:var(--ink);line-height:1;">' + edgeCount + '</span><div class="graph-stat-label" style="font-size:8px;color:var(--ink-faint);font-family:var(--font-ui);font-weight:600;margin-top:4px;">' + t('graph.stats.edges') + '</div></div>';
      html += '</div>';

      html += '<h3 class="graph-section-title" style="margin-top:12px;font-size:10px;color:var(--ink-muted);font-family:var(--font-ui);font-weight:700;">' + t('graph.filters.title') + '</h3>';

      }
      html += '<div class="graph-legend" style="display:none"><h3>' + t('graph.legend.title') + '</h3>';
      var shapeLabels = { rect: '&#9645;', circle: '&#9679;', diamond: '&#9670;', hexagon: '&#11042;' };
      var shownShapes = {};
      Object.keys(NODE_COLORS).forEach(function(type) {
        var shape = NODE_SHAPES[type] || 'circle';
        var color = NODE_COLORS[type];
        var key = type;
        if (shownShapes[key]) return;
        shownShapes[key] = true;
        html += '<div class="graph-legend-item"><span class="graph-legend-shape" style="color:' + color + ';font-size:14px;">' + (shapeLabels[shape] || '&#9679;') + '</span><span>' + esc(nodeKindLabel(type)) + '</span></div>';
      });
      html += '</div>';

      html += '<button class="btn" style="margin-top:14px;width:100%;font-size:11px;padding:8px;transition:all 0.15s ease;" data-action="rebuild-graph">' + t('graph.actions.rebuild') + '</button>';
      html += '<div id="selected-node-panel"></div>';
      var __focus = captureSearchFocus(['graph-search']);
      sb.innerHTML = html;

      sb.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
        cb.addEventListener('change', function() {
          state.graph.filters[this.dataset.type] = this.checked;
          renderGraph();
        });
      });

      var searchInput = document.getElementById('graph-search');
      if (searchInput) {
        bindImeSafeSearch(searchInput, 200, function(v){ graphSearchTerm = v.toLowerCase(); renderGraph(); });
      }
      restoreSearchFocus(__focus);
    }

    function initGraph() {
      var canvas = document.getElementById('graph-canvas');
      if (!canvas) return;
      graphSim.canvas = canvas;
      graphSim.ctx = canvas.getContext('2d');

      function resize() {
        var r = canvas.parentElement.getBoundingClientRect();
        canvas.width = r.width * window.devicePixelRatio;
        canvas.height = r.height * window.devicePixelRatio;
        canvas.style.width = r.width + 'px';
        canvas.style.height = r.height + 'px';
        graphSim.ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      var cw = canvas.width / window.devicePixelRatio;
      var ch = canvas.height / window.devicePixelRatio;
      graphSim.panX = cw / 2;
      graphSim.panY = ch / 2;

      var edgeMap = {};
      state.graph.edges.forEach(function(e) {
        edgeMap[e.sourceNodeId] = (edgeMap[e.sourceNodeId] || 0) + 1;
        edgeMap[e.targetNodeId] = (edgeMap[e.targetNodeId] || 0) + 1;
      });

      // With no (or few) edges a pure force layout is a meaningless
      // scatter. Anchor each type to its own cluster center so the
      // picture reads as "here is what memory knows, grouped by kind";
      // once real relations exist the edge springs dominate instead.
      var types = [];
      state.graph.nodes.forEach(function(n) {
        if (types.indexOf(n.type) === -1) types.push(n.type);
      });
      var typeCenters = {};
      types.forEach(function(t, ti) {
        var a = (2 * Math.PI * ti) / Math.max(types.length, 1) - Math.PI / 2;
        var cr = types.length > 1 ? Math.min(cw, ch) * 0.28 : 0;
        typeCenters[t] = { x: Math.cos(a) * cr, y: Math.sin(a) * cr };
      });
      graphSim.typeCenters = typeCenters;
      graphSim.clustered = state.graph.edges.length < state.graph.nodes.length / 2;

      graphSim.nodes = state.graph.nodes.map(function(n, i) {
        var deg = edgeMap[n.id] || 0;
        var c = typeCenters[n.type] || { x: 0, y: 0 };
        return {
          id: n.id, type: n.type, name: n.name, properties: n.properties,
          x: c.x + (Math.random() - 0.5) * 150,
          y: c.y + (Math.random() - 0.5) * 150,
          vx: 0, vy: 0,
          r: Math.max(11, Math.min(22, 11 + deg * 2.5))
        };
      });
      graphSim.edges = state.graph.edges.slice();
      graphSim.running = true;
      graphSim.dragNode = null;
      graphSim.autoFitPending = true;

      setupGraphInteraction(canvas);
      runSimulation();
    }

    function setupGraphInteraction(canvas) {
      var isPanning = false;
      var lastMX = 0, lastMY = 0;

      function canvasCoords(e) {
        var rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left - graphSim.panX) / graphSim.zoom,
          y: (e.clientY - rect.top - graphSim.panY) / graphSim.zoom
        };
      }
      function findNode(cx, cy) {
        for (var i = graphSim.nodes.length - 1; i >= 0; i--) {
          var n = graphSim.nodes[i];
          if (!state.graph.filters[n.type]) continue;
          var dx = n.x - cx, dy = n.y - cy;
          if (dx * dx + dy * dy < n.r * n.r + 25) return n;
        }
        return null;
      }

      canvas.addEventListener('mousedown', function(e) {
        var c = canvasCoords(e);
        var node = findNode(c.x, c.y);
        if (node) {
          graphSim.dragNode = node;
        } else {
          isPanning = true;
        }
        lastMX = e.clientX;
        lastMY = e.clientY;
        // wake the simulation if it parked itself after settling
        wakeGraphSim();
      });
      canvas.addEventListener('mousemove', function(e) {
        var dx = e.clientX - lastMX;
        var dy = e.clientY - lastMY;
        if (graphSim.dragNode) {
          graphSim.dragNode.x += dx / graphSim.zoom;
          graphSim.dragNode.y += dy / graphSim.zoom;
          graphSim.dragNode.vx = 0;
          graphSim.dragNode.vy = 0;
        } else if (isPanning) {
          graphSim.panX += dx;
          graphSim.panY += dy;
        }
        lastMX = e.clientX;
        lastMY = e.clientY;
        graphSim.mouseX = e.clientX;
        graphSim.mouseY = e.clientY;

        var c = canvasCoords(e);
        var hoverNode = findNode(c.x, c.y);
        var tooltip = document.getElementById('graph-tooltip');
        if (tooltip) {
          if (hoverNode && !graphSim.dragNode && !isPanning) {
            var conns = graphSim.edges.filter(function(ed) { return ed.sourceNodeId === hoverNode.id || ed.targetNodeId === hoverNode.id; }).length;
            var ttHtml = '<div class="tt-name">' + esc(hoverNode.name) + '</div>';
            ttHtml += '<div class="tt-type" style="color:' + (NODE_COLORS[hoverNode.type] || '#666') + '">' + esc(nodeKindLabel(hoverNode.type)) + '</div>';
            if (hoverNode.properties) {
              var propKeys = Object.keys(hoverNode.properties).slice(0, 3);
              propKeys.forEach(function(k) {
                ttHtml += '<div class="tt-prop">' + esc(k) + ': ' + esc(truncate(String(hoverNode.properties[k]), 30)) + '</div>';
              });
            }
            ttHtml += '<div class="tt-conns">' + t(conns === 1 ? 'graph.tooltip.connection' : 'graph.tooltip.connections', { n: conns }) + '</div>';
            tooltip.innerHTML = ttHtml;
            var rect = canvas.getBoundingClientRect();
            tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
            tooltip.style.top = (e.clientY - rect.top + 12) + 'px';
            tooltip.classList.add('visible');
            canvas.style.cursor = 'pointer';
          } else {
            tooltip.classList.remove('visible');
            canvas.style.cursor = graphSim.dragNode || isPanning ? 'grabbing' : 'grab';
          }
        }
      });
      canvas.addEventListener('mouseup', function(e) {
        if (graphSim.dragNode && !isPanning) {
          selectGraphNode(graphSim.dragNode);
        }
        graphSim.dragNode = null;
        isPanning = false;
      });
      canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        var factor = e.deltaY > 0 ? 0.9 : 1.1;
        graphSim.zoom = Math.max(0.1, Math.min(5, graphSim.zoom * factor));
        // zoom is visually meaningless if the rAF loop is parked —
        // wake the simulation so the next frame redraws at the new scale.
        wakeGraphSim();
      }, { passive: false });
      canvas.addEventListener('dblclick', function(e) {
        var c = canvasCoords(e);
        var node = findNode(c.x, c.y);
        if (node) {
          selectGraphNode(node);
          expandNode(node.id);
        }
      });
    }

    window.zoomGraph = function(dir) {
      var factor = dir > 0 ? 1.25 : 0.8;
      graphSim.zoom = Math.max(0.1, Math.min(5, graphSim.zoom * factor));
      wakeGraphSim();
    };
    window.recenterGraph = function() {
      graphSim.zoom = 1;
      if (graphSim.canvas) {
        var cw = graphSim.canvas.width / window.devicePixelRatio;
        var ch = graphSim.canvas.height / window.devicePixelRatio;
        graphSim.panX = cw / 2;
        graphSim.panY = ch / 2;
      }
      wakeGraphSim();
    };

    function selectGraphNode(simNode) {
      state.graph.selectedNode = simNode;
      var panel = document.getElementById('selected-node-panel');
      if (!panel) return;
      var color = NODE_COLORS[simNode.type] || '#666666';
      var html = '<div class="selected-node-info">';
      html += '<h4 style="color:' + color + '">' + esc(simNode.name) + '</h4>';
      html += '<div class="prop">' + t('graph.node.type', { kind: esc(nodeKindLabel(simNode.type)) }) + '</div>';
      if (simNode.properties) {
        Object.keys(simNode.properties).forEach(function(k) {
          html += '<div class="prop">' + esc(k) + ': ' + esc(truncate(simNode.properties[k], 50)) + '</div>';
        });
      }
      var conns = graphSim.edges.filter(function(e) { return e.sourceNodeId === simNode.id || e.targetNodeId === simNode.id; }).length;
      html += '<div class="prop">' + t('graph.node.connections', { n: conns }) + '</div>';
      html += '<button class="btn btn-primary" style="margin-top:8px;width:100%;" data-action="expand-node" data-node-id="' + esc(simNode.id) + '">' + t('graph.actions.expandNeighbors') + '</button>';
      html += '</div>';
      panel.innerHTML = html;
    }

    async function expandNode(nodeId) {
      var result = await apiPost('graph/query', { startNodeId: nodeId, maxDepth: 1 });
      if (!result) return;
      var existingIds = {};
      graphSim.nodes.forEach(function(n) { existingIds[n.id] = true; });
      var parentNode = graphSim.nodes.find(function(n) { return n.id === nodeId; });
      var px = parentNode ? parentNode.x : 0;
      var py = parentNode ? parentNode.y : 0;

      (result.nodes || []).forEach(function(n) {
        if (!existingIds[n.id]) {
          state.graph.nodes.push(n);
          if (!state.graph.filters.hasOwnProperty(n.type)) state.graph.filters[n.type] = true;
          var angle = Math.random() * Math.PI * 2;
          graphSim.nodes.push({
            id: n.id, type: n.type, name: n.name, properties: n.properties,
            x: px + Math.cos(angle) * 80,
            y: py + Math.sin(angle) * 80,
            vx: 0, vy: 0, r: 8
          });
        }
      });

      var existingEdges = {};
      graphSim.edges.forEach(function(e) { existingEdges[e.id] = true; });
      (result.edges || []).forEach(function(e) {
        if (!existingEdges[e.id]) {
          state.graph.edges.push(e);
          graphSim.edges.push(e);
        }
      });
      renderGraphSidebar();
    }

    function runSimulation() {
      if (!graphSim.running) return;
      var nodes = graphSim.nodes;
      var edges = graphSim.edges;
      var nodeCount = nodes.length;
      graphSim.tickCount = (graphSim.tickCount || 0) + 1;
      // dense graphs (>1000 nodes) used to oscillate forever
      // because the per-node force pile-up exceeded what 0.9 damping
      // could bleed off each tick. Tick-decay tightens damping over
      // time so the layout actually settles; a per-node velocity cap
      // prevents any single node from being launched off-screen by an
      // accumulated kick before damping catches up.
      var coolBoost = Math.min(0.4, graphSim.tickCount / 1500);
      var damping = 0.9 - coolBoost;
      var repulsion = nodeCount > 1000 ? 3000 : nodeCount > 100 ? 2000 : nodeCount > 50 ? 1200 : 800;
      var attraction = nodeCount > 100 ? 0.002 : 0.005;
      var centerGravity = nodeCount > 1000 ? 0.012 : nodeCount > 100 ? 0.005 : 0.01;
      var velocityCap = nodeCount > 1000 ? 6 : nodeCount > 200 ? 12 : 24;

      var nodeMap = {};
      nodes.forEach(function(n) { nodeMap[n.id] = n; });

      for (var i = 0; i < nodes.length; i++) {
        if (graphSim.dragNode === nodes[i]) continue;
        var n = nodes[i];
        var fx = 0, fy = 0;
        for (var j = 0; j < nodes.length; j++) {
          if (i === j) continue;
          var dx = n.x - nodes[j].x;
          var dy = n.y - nodes[j].y;
          var dist = Math.sqrt(dx * dx + dy * dy) || 1;
          var force = repulsion / (dist * dist);
          fx += (dx / dist) * force;
          fy += (dy / dist) * force;
        }
        if (graphSim.clustered && graphSim.typeCenters && graphSim.typeCenters[n.type]) {
          var tc = graphSim.typeCenters[n.type];
          fx += (tc.x - n.x) * 0.006;
          fy += (tc.y - n.y) * 0.006;
        } else {
          fx -= n.x * centerGravity;
          fy -= n.y * centerGravity;
        }
        var nvx = (n.vx + fx) * damping;
        var nvy = (n.vy + fy) * damping;
        // Velocity cap (#563): keep any single node from being launched
        // off-screen by a one-tick force spike.
        if (nvx > velocityCap) nvx = velocityCap; else if (nvx < -velocityCap) nvx = -velocityCap;
        if (nvy > velocityCap) nvy = velocityCap; else if (nvy < -velocityCap) nvy = -velocityCap;
        n.vx = nvx;
        n.vy = nvy;
      }

      edges.forEach(function(e) {
        var s = nodeMap[e.sourceNodeId];
        var t = nodeMap[e.targetNodeId];
        if (!s || !t) return;
        var dx = t.x - s.x;
        var dy = t.y - s.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var f = (dist - 100) * attraction;
        var fx = (dx / dist) * f;
        var fy = (dy / dist) * f;
        if (graphSim.dragNode !== s) { s.vx += fx; s.vy += fy; }
        if (graphSim.dragNode !== t) { t.vx -= fx; t.vy -= fy; }
      });

      var totalKineticEnergy = 0;
      nodes.forEach(function(n) {
        if (graphSim.dragNode === n) return;
        n.x += n.vx;
        n.y += n.vy;
        totalKineticEnergy += n.vx * n.vx + n.vy * n.vy;
      });

      if (graphSim.autoFitPending && graphSim.tickCount > 45) {
        graphSim.autoFitPending = false;
        fitGraphToView();
      }
      // park the simulation when the layout is quiet to save CPU.
      // Pick up again when a drag/interaction wakes the loop.
      var rmsVelocity = nodes.length > 0 ? Math.sqrt(totalKineticEnergy / nodes.length) : 0;
      if (rmsVelocity < 0.05 && graphSim.tickCount > 60 && !graphSim.dragNode) {
        graphSim.quietTicks = (graphSim.quietTicks || 0) + 1;
      } else {
        graphSim.quietTicks = 0;
      }

      renderGraph();
      if (graphSim.quietTicks > 30) {
        graphSim.raf = null;
        return;
      }
      graphSim.raf = requestAnimationFrame(runSimulation);
    }

    async function rebuildGraph() {
      var sb = document.getElementById('graph-sidebar');
      if (sb) sb.innerHTML = '<h3>' + t('graph.title') + '</h3><p class="prose" style="font-size:12px;color:var(--ink-faint);font-style:italic;">' + t('graph.loading.rebuilding') + '</p>';
      await apiPost('graph/build', {});
      state.graph.loaded = false;
      loadGraph();
    }

    function drawNodeShape(ctx, x, y, r, type) {
      var shape = NODE_SHAPES[type] || 'circle';
      switch(shape) {
        case 'rect':
          ctx.beginPath();
          ctx.rect(x - r, y - r * 0.75, r * 2, r * 1.5);
          break;
        case 'diamond':
          ctx.beginPath();
          ctx.moveTo(x, y - r);
          ctx.lineTo(x + r, y);
          ctx.lineTo(x, y + r);
          ctx.lineTo(x - r, y);
          ctx.closePath();
          break;
        case 'hexagon':
          ctx.beginPath();
          for (var i = 0; i < 6; i++) {
            var angle = (Math.PI / 3) * i - Math.PI / 2;
            var hx = x + r * Math.cos(angle);
            var hy = y + r * Math.sin(angle);
            if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          break;
        default:
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          break;
      }
    }

    function fitGraphToView() {
      var canvas = graphSim.canvas;
      if (!canvas || graphSim.nodes.length === 0) return;
      var w = canvas.width / window.devicePixelRatio;
      var h = canvas.height / window.devicePixelRatio;
      var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      graphSim.nodes.forEach(function(n) {
        if (n.x < minX) minX = n.x;
        if (n.x > maxX) maxX = n.x;
        if (n.y < minY) minY = n.y;
        if (n.y > maxY) maxY = n.y;
      });
      var pad = 150;
      var spanX = (maxX - minX) + pad * 2;
      var spanY = (maxY - minY) + pad * 2;
      var z = Math.min(w / spanX, h / spanY);
      graphSim.zoom = Math.max(0.35, Math.min(1.4, z));
      graphSim.panX = w / 2 - ((minX + maxX) / 2) * graphSim.zoom;
      graphSim.panY = h / 2 - ((minY + maxY) / 2) * graphSim.zoom;
    }

    function renderGraph() {
      var ctx = graphSim.ctx;
      var canvas = graphSim.canvas;
      if (!ctx || !canvas) return;
      var w = canvas.width / window.devicePixelRatio;
      var h = canvas.height / window.devicePixelRatio;

      ctx.clearRect(0, 0, w, h);

      // --- Canvas grid background ---
      var gridSize = 24;
      ctx.save();
      ctx.strokeStyle = isDarkMode() ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
      ctx.lineWidth = 0.5;
      for (var gx = 0; gx < w; gx += gridSize) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
      }
      for (var gy = 0; gy < h; gy += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(graphSim.panX, graphSim.panY);
      ctx.scale(graphSim.zoom, graphSim.zoom);

      var nodeMap = {};
      graphSim.nodes.forEach(function(n) { nodeMap[n.id] = n; });

      var searchActive = graphSearchTerm.length > 0;
      var drawnLabelRects = [];
      function labelFits(x, y, w2, h2) {
        for (var li = 0; li < drawnLabelRects.length; li++) {
          var r = drawnLabelRects[li];
          if (x < r.x + r.w && x + w2 > r.x && y < r.y + r.h && y + h2 > r.y) return false;
        }
        drawnLabelRects.push({ x: x, y: y, w: w2, h: h2 });
        return true;
      }
      var totalVisible = graphSim.nodes.filter(function(n) { return state.graph.filters[n.type]; }).length;
      var isDense = totalVisible > 40;
      var labelZoomThreshold = isDense ? 1.5 : 0.5;
      var edgeLabelZoomThreshold = isDense ? 2.5 : 1.2;
      var selectedId = state.graph.selectedNode ? state.graph.selectedNode.id : null;

      // --- Hover node detection for focus effect ---
      var hoverNodeId = null;
      if (!graphSim.dragNode && graphSim.canvas) {
        var rect = graphSim.canvas.getBoundingClientRect();
        var hx = (graphSim.mouseX - rect.left - graphSim.panX) / graphSim.zoom;
        var hy = (graphSim.mouseY - rect.top - graphSim.panY) / graphSim.zoom;
        for (var hi = graphSim.nodes.length - 1; hi >= 0; hi--) {
          var hn = graphSim.nodes[hi];
          if (!state.graph.filters[hn.type]) continue;
          var hdx = hn.x - hx, hdy = hn.y - hy;
          if (hdx * hdx + hdy * hdy < hn.r * hn.r + 25) { hoverNodeId = hn.id; break; }
        }
      }
      var focusNodeId = selectedId || hoverNodeId;

      // --- Draw edges ---
      graphSim.edges.forEach(function(e) {
        var s = nodeMap[e.sourceNodeId];
        var t = nodeMap[e.targetNodeId];
        if (!s || !t) return;
        if (!state.graph.filters[s.type] || !state.graph.filters[t.type]) return;

        var edgeDimmed = searchActive && !(s.name.toLowerCase().includes(graphSearchTerm) || t.name.toLowerCase().includes(graphSearchTerm));
        var isConnectedToFocus = focusNodeId && (e.sourceNodeId === focusNodeId || e.targetNodeId === focusNodeId);
        var isFocusActive = focusNodeId !== null;
        var weight = typeof e.weight === 'number' ? e.weight : 0.5;
        var lineWidth = isConnectedToFocus ? 2 + weight * 2 : 1 + weight * 1.5;

        var dx = t.x - s.x;
        var dy = t.y - s.y;
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var curveOffset = isDense ? 12 : 18;
        var offsetX = -dy / len * curveOffset;
        var offsetY = dx / len * curveOffset;
        var cpx = (s.x + t.x) / 2 + offsetX;
        var cpy = (s.y + t.y) / 2 + offsetY;

        // Colored edges based on source node type
        var edgeColor = NODE_COLORS[s.type] || '#666666';
        var edgeAlpha;
        if (edgeDimmed) {
          edgeAlpha = 0.06;
        } else if (isFocusActive && isConnectedToFocus) {
          edgeAlpha = 0.65;
        } else if (isFocusActive && !isConnectedToFocus) {
          edgeAlpha = 0.06;
        } else {
          edgeAlpha = isDense ? 0.15 : 0.25;
        }

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.quadraticCurveTo(cpx, cpy, t.x, t.y);
        // Parse hex color to rgba
        var r = parseInt(edgeColor.slice(1,3), 16);
        var g = parseInt(edgeColor.slice(3,5), 16);
        var b = parseInt(edgeColor.slice(5,7), 16);
        ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + edgeAlpha + ')';
        ctx.lineWidth = lineWidth;
        ctx.stroke();

        if (!isDense || isConnectedToFocus) {
          var arrowAngle = Math.atan2(t.y - cpy, t.x - cpx);
          var arrowLen = 5 + lineWidth;
          ctx.beginPath();
          ctx.moveTo(t.x - t.r * Math.cos(arrowAngle), t.y - t.r * Math.sin(arrowAngle));
          ctx.lineTo(t.x - (t.r + arrowLen) * Math.cos(arrowAngle - 0.3), t.y - (t.r + arrowLen) * Math.sin(arrowAngle - 0.3));
          ctx.lineTo(t.x - (t.r + arrowLen) * Math.cos(arrowAngle + 0.3), t.y - (t.r + arrowLen) * Math.sin(arrowAngle + 0.3));
          ctx.closePath();
          ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (edgeDimmed ? 0.06 : isConnectedToFocus ? 0.6 : 0.2) + ')';
          ctx.fill();
        }

        var showEdgeLabel = e.type && !edgeDimmed && (isConnectedToFocus ? graphSim.zoom > 0.6 : graphSim.zoom > edgeLabelZoomThreshold);
        if (showEdgeLabel) {
          var zoomInv = 1 / graphSim.zoom;
          ctx.save();
          ctx.fillStyle = isDarkMode() ? (isConnectedToFocus ? 'rgba(238,238,238,0.9)' : 'rgba(180,180,180,0.7)') : (isConnectedToFocus ? 'rgba(17,17,17,0.85)' : 'rgba(80,80,80,0.7)');
          ctx.font = (isConnectedToFocus ? '600 ' : '500 ') + (11 * zoomInv).toFixed(1) + "px 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif";
          ctx.textAlign = 'center';
          ctx.fillText(localizedEnumLabel('dashboard.relations.type', e.type, e.type), cpx, cpy - (4 * zoomInv));
          ctx.restore();
        }
      });

      // --- Draw nodes ---
      graphSim.nodes.forEach(function(n) {
        if (!state.graph.filters[n.type]) return;
        var color = NODE_COLORS[n.type] || '#666666';
        var isSelected = selectedId === n.id;
        var isHovered = hoverNodeId === n.id;
        var matchesSearch = !searchActive || n.name.toLowerCase().includes(graphSearchTerm);
        var isFocusFaded = graphSim.edges.length > 0 && focusNodeId && n.id !== focusNodeId && !graphSim.edges.some(function(ed) {
          return (ed.sourceNodeId === focusNodeId && ed.targetNodeId === n.id) ||
                 (ed.targetNodeId === focusNodeId && ed.sourceNodeId === n.id);
        });

        var nodeAlpha = !matchesSearch ? 0.12 : (isFocusFaded ? 0.2 : 1);

        ctx.save();
        ctx.globalAlpha = nodeAlpha;

        // Glow effect
        if (matchesSearch && !isFocusFaded && (isSelected || isHovered || !searchActive)) {
          ctx.shadowColor = color;
          ctx.shadowBlur = isSelected ? 20 : isHovered ? 16 : (isDense ? 4 : 8);
        }

        // Gradient fill
        drawNodeShape(ctx, n.x, n.y, n.r, n.type);
        var grad = ctx.createRadialGradient(n.x - n.r * 0.3, n.y - n.r * 0.3, 0, n.x, n.y, n.r * 1.2);
        var cr = parseInt(color.slice(1,3), 16);
        var cg = parseInt(color.slice(3,5), 16);
        var cb = parseInt(color.slice(5,7), 16);
        grad.addColorStop(0, 'rgba(' + Math.min(255, cr + 60) + ',' + Math.min(255, cg + 60) + ',' + Math.min(255, cb + 60) + ',0.95)');
        grad.addColorStop(1, color);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();

        // Selected ring
        if (isSelected) {
          ctx.save();
          drawNodeShape(ctx, n.x, n.y, n.r + 3, n.type);
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.shadowColor = color;
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.restore();
        } else if (isHovered) {
          drawNodeShape(ctx, n.x, n.y, n.r + 2, n.type);
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (searchActive && matchesSearch) {
          drawNodeShape(ctx, n.x, n.y, n.r, n.type);
          ctx.strokeStyle = '#CC0000';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        var showLabel = matchesSearch && !isFocusFaded && (
          isSelected || isHovered ||
          (searchActive && matchesSearch) ||
          (totalVisible <= 30 && graphSim.zoom > 0.5) ||
          (!isDense && graphSim.zoom > labelZoomThreshold) ||
          (isDense && graphSim.zoom > labelZoomThreshold && n.r > 10)
        );
        if (showLabel) {
          var zoomInv = 1 / graphSim.zoom;
          ctx.save();
          ctx.font = (isSelected || isHovered ? '600 ' : '500 ') + (13 * zoomInv).toFixed(1) + 'px Inter, sans-serif';
          ctx.textAlign = 'center';
          
          var label = truncate(n.name, 18);
          var textW = ctx.measureText(label).width;
          var labelW = textW + (16 * zoomInv);
          var labelH = 20 * zoomInv;
          var labelY = n.y + n.r + (8 * zoomInv); // Top of the background pill
          // Selected/hovered labels always win; others draw only into
          // free space so zoomed-out views degrade to fewer labels
          // instead of a pile of overlapping pills.
          if (!isSelected && !isHovered && !labelFits(n.x - labelW / 2, labelY, labelW, labelH)) {
            ctx.restore();
            return;
          }
          ctx.fillStyle = isDarkMode() ? 'rgba(30,30,35,0.92)' : 'rgba(255,255,255,0.92)';
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(n.x - labelW / 2, labelY, labelW, labelH, 4 * zoomInv) : ctx.rect(n.x - labelW / 2, labelY, labelW, labelH);
          ctx.fill();
          
          ctx.strokeStyle = isDarkMode() ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
          ctx.lineWidth = 1 * zoomInv;
          ctx.stroke();

          ctx.fillStyle = isDarkMode() ? (isSelected || isHovered ? '#eeeeee' : '#bbbbbb') : (isSelected || isHovered ? '#111111' : '#444444');
          // Vertically center text in the pill box
          ctx.fillText(label, n.x, labelY + (14 * zoomInv));
          ctx.restore();
        }
      });

      ctx.restore();

      if (graphSim.nodes.length === 0) {
        ctx.fillStyle = '#999999';
        ctx.font = '14px Lora, Georgia, serif';
        ctx.textAlign = 'center';
        ctx.fillText(t('graph.canvas.empty'), w / 2, h / 2 - 16);
        ctx.font = '12px Inter, sans-serif';
        ctx.fillText(t('graph.canvas.enable', { flag: 'GRAPH_EXTRACTION_ENABLED' }), w / 2, h / 2 + 8);
      }
    }

    async function loadMemories() {
      var el = document.getElementById('view-memories');
      if (!state.memories.loaded) el.innerHTML = '<div class="loading">' + t('memories.loading') + '</div>';
      // cap at 2000 so the viewer remains responsive on large
      // corpora. Older endpoints returned the full unbounded list which
      // hit the iii invocation timeout and the UI fell through to 0.
      var result = await apiGet('memories?latest=true&limit=2000');
      var items = (result && result.memories) || [];
      // Newest first — server returns KV-insertion order.
      items.sort(function(a, b) {
        var ac = (a && a.createdAt) || (a && a.updatedAt) || '';
        var bc = (b && b.createdAt) || (b && b.updatedAt) || '';
        return bc.localeCompare(ac);
      });
      state.memories.items = items;
      state.memories.total = (result && typeof result.total === 'number') ? result.total : items.length;
      state.memories.loaded = true;
      renderMemories();
    }

      var sessResult = await apiGet('sessions');

      state.timeline.loaded = true;

      if (sessions.length > 0 && !state.timeline.sessionId) {
        // Default to the session with the most observations — the newest
        // one is often a sparse just-started session, which made the tab
        // look empty on first open.
        var sorted = sessions.slice().sort(function(a, b) {
          return (b.observationCount || 0) - (a.observationCount || 0) ||
            (b.startedAt || '').localeCompare(a.startedAt || '');
        });
        var firstSelectable = sorted.find(function(s) { return sessionId(s); });
        state.timeline.sessionId = firstSelectable ? sessionId(firstSelectable) : '';

      renderTimelineToolbar(sessions);

    async function loadActivity() {
      var el = document.getElementById('view-activity');
      if (!state.activity.loaded) el.innerHTML = '<div class="loading">' + t('activity.loading') + '</div>';
      var results = await Promise.all([
        apiGet('sessions'),
        apiGet('audit?limit=200')
      ]);
      var sessions = (results[0] && results[0].sessions) || [];
      var auditEntries = (results[1] && results[1].entries) || [];

      var allObs = [];
      var sorted = sessions.slice().sort(function(a, b) { return (b.startedAt || '').localeCompare(a.startedAt || ''); });
      var recentSessions = sorted.slice(0, 5);

      var obsResults = await Promise.all(recentSessions.filter(function(s) { return sessionId(s); }).map(function(s) {
        return apiGet('observations?sessionId=' + encodeURIComponent(sessionId(s)));
      }));
      obsResults.forEach(function(r) {
        if (r && r.observations) allObs = allObs.concat(r.observations);
      });

      state.activity.sessions = sessions;
      state.activity.observations = allObs;
      state.activity.audit = auditEntries;
      state.activity.loaded = true;
      renderActivity();
    }

    function renderActivity() {
      var el = document.getElementById('view-activity');
      var obs = state.activity.observations;
      var sessions = state.activity.sessions;

      var TOOL_TYPE_MAP = { Read: 'file_read', Write: 'file_write', Edit: 'file_edit', Bash: 'command_run', Grep: 'search', Glob: 'search', WebFetch: 'web_fetch', WebSearch: 'web_fetch', AskUserQuestion: 'conversation', Task: 'subagent' };

      var html = '';

      html += '<div class="card"><div class="card-title">' + t('activity.heatmap.title') + '</div>';
      var dayCounts = {};
      obs.forEach(function(o) {
        try {
          var d = new Date(o.timestamp);
          var key = d.toISOString().slice(0, 10);
          dayCounts[key] = (dayCounts[key] || 0) + 1;
        } catch(e) {}
      });
      sessions.forEach(function(s) {
        try {
          var d = new Date(s.startedAt);
          var key = d.toISOString().slice(0, 10);
          dayCounts[key] = (dayCounts[key] || 0) + 1;
        } catch(e) {}
      });

      var maxCount = 0;
      Object.keys(dayCounts).forEach(function(k) { if (dayCounts[k] > maxCount) maxCount = dayCounts[k]; });

      var today = new Date();
      var weekdayNames = [];
      try {
        if (typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
          var weekdayFormatter = new Intl.DateTimeFormat(dateLocale, { weekday: 'short' });
          for (var weekdayIndex = 0; weekdayIndex < 7; weekdayIndex++) {
            weekdayNames.push(weekdayFormatter.format(new Date(2024, 0, 1 + weekdayIndex, 12, 0, 0)));
          }
        }
      } catch (_) {}
      var dayLabels = [weekdayNames[0] || '', '', weekdayNames[2] || '', '', weekdayNames[4] || '', '', ''];
      html += '<div class="heatmap-labels">';
      dayLabels.forEach(function(l) { html += '<span style="width:10px;text-align:center;">' + l + '</span>'; });
      html += '</div>';
      html += '<div class="heatmap-wrap"><div class="heatmap-grid">';
      for (var w = 51; w >= 0; w--) {
        for (var d = 0; d < 7; d++) {
          var cellDate = new Date(today);
          cellDate.setDate(cellDate.getDate() - (w * 7 + (6 - d)));
          var key = cellDate.toISOString().slice(0, 10);
          var count = dayCounts[key] || 0;
          var level = count === 0 ? '' : count <= (maxCount * 0.25) ? 'level-1' : count <= (maxCount * 0.5) ? 'level-2' : count <= (maxCount * 0.75) ? 'level-3' : 'level-4';
          var unit = t(count === 1 ? 'activity.heatmap.unit.event' : 'activity.heatmap.unit.events');
          var title = t('activity.heatmap.tooltip', { date: key, n: count, unit: unit });
          html += '<div class="heatmap-cell ' + level + '" title="' + esc(title) + '"></div>';
        }
      }
      html += '</div></div>';
      html += '<div style="display:flex;align-items:center;gap:4px;margin-top:8px;font-size:10px;color:var(--ink-faint);font-family:var(--font-mono);justify-content:flex-end;">' + t('activity.legend.less') + ' ';
      html += '<div class="heatmap-cell" style="display:inline-block;"></div>';
      html += '<div class="heatmap-cell level-1" style="display:inline-block;"></div>';
      html += '<div class="heatmap-cell level-2" style="display:inline-block;"></div>';
      html += '<div class="heatmap-cell level-3" style="display:inline-block;"></div>';
      html += '<div class="heatmap-cell level-4" style="display:inline-block;"></div>';
      html += ' ' + t('activity.legend.more') + '</div>';
      html += '</div>';

      var typeCounts = {};
      obs.forEach(function(o) {
        var t = o.type || TOOL_TYPE_MAP[o.toolName] || (o.hookType ? o.hookType.replace(/_/g, ' ') : 'other');
        typeCounts[t] = (typeCounts[t] || 0) + 1;
      });
      var typeList = Object.keys(typeCounts).sort(function(a, b) { return typeCounts[b] - typeCounts[a]; });
      var totalObs = obs.length || 1;

      html += '<div class="two-col" style="margin-top:16px;">';

      html += '<div class="card"><div class="card-title">' + t('activity.breakdown.title') + '</div>';
      if (typeList.length === 0) {
        html += '<div style="font-size:13px;color:var(--ink-faint);font-style:italic;">' + t('activity.empty.observations') + '</div>';
      } else {
        html += '<div class="bar-chart">';
        typeList.slice(0, 12).forEach(function(t) {
          var pct = Math.round((typeCounts[t] / totalObs) * 100);
          var color = OBS_TYPE_COLORS[t] || '#666666';
          html += '<div class="bar-row"><span class="bar-label">' + esc(observationTypeLabel(t)) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div><span class="bar-value">' + typeCounts[t] + '</span></div>';
        });
        html += '</div>';
      }
      html += '</div>';

      html += '<div class="card"><div class="card-title">' + t('activity.feed.title') + '</div>';
      var sortedObs = obs.slice().sort(function(a, b) { return (b.timestamp || '').localeCompare(a.timestamp || ''); });
      if (sortedObs.length === 0) {
        html += '<div style="font-size:13px;color:var(--ink-faint);font-style:italic;">' + t('activity.empty.recent') + '</div>';
      } else {
        sortedObs.slice(0, 20).forEach(function(o) {
          var type = o.type || TOOL_TYPE_MAP[o.toolName] || 'other';
          var typeColor = OBS_TYPE_COLORS[type] || '#666666';
          var icon = OBS_TYPE_ICONS[type] || '&#128196;';
          var title = o.title || o.toolName || (o.hookType ? o.hookType.replace(/_/g, ' ') : t('timeline.fallback.observation'));

          html += '<div class="activity-feed-item">';
          html += '<div class="activity-feed-icon" style="color:' + typeColor + ';border-color:' + typeColor + ';">' + icon + '</div>';
          html += '<div class="activity-feed-body">';
          html += '<div class="activity-feed-title">' + esc(truncate(title, 60)) + '</div>';
          if (o.narrative) html += '<div style="font-size:12px;color:var(--ink-muted);margin-top:2px;">' + esc(truncate(o.narrative, 100)) + '</div>';
          html += '<div class="activity-feed-meta">' + esc(observationTypeLabel(type));
          if (o.files && o.files.length) html += ' &middot; <span class="tag file-tag" style="font-size:9px;padding:0 4px;">' + esc(o.files[0].split('/').pop()) + '</span>';
          html += ' &middot; ' + esc(shortTime(o.timestamp)) + '</div>';
          html += '</div></div>';
        });
      }
      html += '</div>';

      html += '</div>';

      el.innerHTML = html;
    }

        state.sessions.selectedId &&
        window.matchMedia('(max-width: 1100px)').matches
      ) {

      var projects = {};

      var content = document.getElementById('profile-content');
      if (!content || !state.profile.selectedProject) return;
      content.innerHTML = '<div class="loading">' + t('profile.loadingData') + '</div>';
      var result = await apiGet('profile?project=' + encodeURIComponent(state.profile.selectedProject));
      state.profile.data = (result && result.profile) ? result.profile : result;
      renderProfile();

    function renderProfile() {
      var content = document.getElementById('profile-content');
      if (!content) return;
      var p = state.profile.data;

      if (!p) {
        content.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128203;</div><p>' + t('profile.empty.noData') + '</p></div>';
        return;
      }

      var html = '<div class="two-col">';

      html += '<div class="card"><div class="card-title">' + t('profile.card.topConcepts') + '</div>';

      } else {
        var maxC = Math.max.apply(null, concepts.map(function(c) { return c.frequency; })) || 1;
        html += '<div class="bar-chart">';
        concepts.slice(0, 10).forEach(function(c) {
          var pct = Math.round((c.frequency / maxC) * 100);
          html += '<div class="bar-row"><span class="bar-label">' + esc(c.concept) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:var(--yellow);"></div></div><span class="bar-value">' + c.frequency + '</span></div>';
        });
        html += '</div>';
      }
      html += '</div>';

      html += '<div class="card"><div class="card-title">' + t('profile.card.topFiles') + '</div>';
      var files = p.topFiles || [];
      if (files.length === 0) {
        html += '<div style="font-size:13px;color:var(--ink-faint);font-style:italic;">' + t('profile.empty.files') + '</div>';
      } else {
        var maxF = Math.max.apply(null, files.map(function(f) { return f.frequency; })) || 1;
        html += '<div class="bar-chart">';
        files.slice(0, 10).forEach(function(f) {
          var pct = Math.round((f.frequency / maxF) * 100);
          html += '<div class="bar-row"><span class="bar-label">' + esc(f.file.split('/').pop()) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:var(--green);"></div></div><span class="bar-value">' + f.frequency + '</span></div>';

      html += '</div>';

      html += '<div class="card" style="margin-top:16px;"><div class="card-title">' + t('profile.card.conventions') + '</div>';
