<line class="hair" x1="640.5" y1="58" x2="640.5" y2="372"/>
<text class="cap" x="660" y="68">COST AT 10,000 MEMORIES</text>
<g class="rise r1"><circle class="pk" cx="664" cy="96" r="3.5"/><text class="t12" x="674" y="100">disk, text only</text><text class="v" x="934" y="100" text-anchor="end">32 MiB</text><line class="hair" x1="660" y1="112.5" x2="934" y2="112.5"/></g>
<g class="rise r2"><circle class="pk" cx="664" cy="132" r="3.5"/><text class="t12" x="674" y="136">disk, 768-d vectors</text><text class="v" x="934" y="136" text-anchor="end">72 MiB</text><line class="hair" x1="660" y1="148.5" x2="934" y2="148.5"/></g>
<g class="rise r3"><circle class="green" cx="664" cy="168" r="3.5"/><text class="t12" x="674" y="172">RAM, engine+worker</text><text class="v" x="934" y="172" text-anchor="end">504–788 MiB</text><line class="hair" x1="660" y1="184.5" x2="934" y2="184.5"/></g>
<g class="rise r4"><circle fill="var(--muted)" cx="664" cy="204" r="3.5"/><text class="t12" x="674" y="208">context/session</text><text class="v" x="934" y="208" text-anchor="end">1,455/2,000 tok</text><line class="hair" x1="660" y1="220.5" x2="934" y2="220.5"/></g>
<g class="rise r5"><circle fill="var(--muted)" cx="664" cy="240" r="3.5"/><text class="t12" x="674" y="244">hook p50</text><text class="v" x="934" y="244" text-anchor="end">59–139 ms</text><line class="hair" x1="660" y1="256.5" x2="934" y2="256.5"/></g>
<g class="rise r6"><circle fill="var(--muted)" cx="664" cy="276" r="3.5"/><text class="t12" x="674" y="280">hook p95</text><text class="v" x="934" y="280" text-anchor="end">&lt; 235 ms</text><line class="hair" x1="660" y1="292.5" x2="934" y2="292.5"/></g>
<g class="rise r7"><circle class="green" cx="664" cy="312" r="3.5"/><text class="t12" x="674" y="316">API keys needed</text><text class="v" x="934" y="316" text-anchor="end">none</text></g>
<text class="t11" x="660" y="352">At 1,000: 3.6 / 7.6 MiB disk,</text>
