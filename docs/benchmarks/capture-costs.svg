<line class="hair" x1="11" y1="44.5" x2="949" y2="44.5"/>
<text class="cap" x="26" y="32">AGENTMEMORY · CAPTURE PATH UNDER A HARD KILL</text>
<text class="cap" x="934" y="32" text-anchor="end">NPM RUN BENCH:CAPTURE-COSTS</text>

<text class="cap" x="24" y="68">AGENT</text>
<text class="cap" x="200" y="68">HOOK</text>
<text class="cap" x="342" y="68">SERVICE</text>
<text class="cap" x="476" y="68">STATE</text>

<g class="rise r1"><rect class="row" x="24.5" y="74.5" width="152" height="20" rx="4"/><text class="t12" x="32" y="88">Bash<tspan x="78">npm test</tspan></text></g>
<g class="rise r2"><rect class="row" x="24.5" y="100.5" width="152" height="20" rx="4"/><text class="t12" x="32" y="114">Edit<tspan x="78">src/auth.ts</tspan></text></g>
<g class="rise r3"><rect class="row" x="24.5" y="126.5" width="152" height="20" rx="4"/><text class="t12" x="32" y="140">Read<tspan x="78">package.json</tspan></text></g>
<g class="rise r4"><rect class="row" x="24.5" y="152.5" width="152" height="20" rx="4"/><text class="t12" x="32" y="166">Grep<tspan x="78">"TODO"</tspan></text></g>
<g class="rise r5"><rect class="row" x="24.5" y="178.5" width="152" height="20" rx="4"/><text class="t12" x="32" y="192">Bash<tspan x="78">git diff</tspan></text></g>
<g class="rise r6"><rect class="row" x="24.5" y="204.5" width="152" height="20" rx="4"/><text class="t12" x="32" y="218">Write<tspan x="78">docs/api.md</tspan></text></g>

<path class="wire" d="M177 85 C190 85 190 145 200 145 M177 111 C190 111 190 145 200 145 M177 137 C190 137 190 145 200 145 M177 163 C190 163 190 145 200 145 M177 189 C190 189 190 145 200 145 M177 215 C190 215 190 145 200 145"/>
<line class="wire" x1="318" y1="145" x2="342" y2="145"/>
<line class="wire" x1="460" y1="145" x2="476" y2="145"/>
<path class="wire dash" d="M259 168 V236"/>
<path class="wire dash" d="M318 260 C331 260 330 160 342 160"/>

<rect class="box" x="200.5" y="122.5" width="118" height="46" rx="6"/>
<text class="t12" x="259" y="149" text-anchor="middle">post-tool-use</text>

<rect class="box" x="342.5" y="122.5" width="118" height="46" rx="6"/>
<text class="t12" x="401" y="141" text-anchor="middle">agentmemory</text>
<text class="t11" x="401" y="157" text-anchor="middle">:3111</text>
