<g transform="rotate(-4 401 104)"><g class="e kill"><rect x="362.5" y="92.5" width="78" height="22" rx="3" fill="var(--card)" class="redline"/><text x="401" y="108" text-anchor="middle" class="v red">SIGKILL</text></g></g>
<text class="e up t11" x="401" y="186" text-anchor="middle">restarted in ~1 s</text>

