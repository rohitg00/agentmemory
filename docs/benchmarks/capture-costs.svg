<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
<title id="t">agentmemory capture path under a hard kill, and what it costs</title>
<desc id="d">Tool calls flow from the agent through the post-tool-use hook into agentmemory on port 3111 and into state. The service is killed with SIGKILL; the next tool calls land in the local spool file capture-spool/local-3111.jsonl. After the restart the spool drains into state. Measured: 10,000 of 10,000 memories and vectors back after SIGKILL with 0 embedding calls, and 1,000 of 1,000 tool calls kept while the service was down. At 10,000 memories: 32 MiB of disk for text, 72 MiB with 768-dimension vectors, 504 to 788 MiB of RAM for engine and worker, 1,455 of 2,000 context tokens per session, hook median 59 to 139 ms with p95 under 235 ms, and no API keys required.</desc>
<style>
:root{--bg:#F9F9F7;--card:#FFFFFF;--soft:#F2F2EE;--ink:#111111;--muted:#6B6B66;--hair:#E1E1DC;--hair2:#CFCFC9;--pk:#1D4E89;--red:#cf2d56;--green:#1f8a65}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--card:#17181B;--soft:#1D1F23;--ink:#EEF0F3;--muted:#94979D;--hair:#26282C;--hair2:#34373C;--pk:#93C5FD;--red:#f2555a;--green:#3fb950}}
text{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;fill:var(--ink)}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--hair2)}.soft{fill:var(--soft)}.hair{stroke:var(--hair);fill:none}
.box{fill:var(--card);stroke:var(--hair2)}.row{fill:var(--soft);stroke:var(--hair)}
.cap{font-size:11px;letter-spacing:.08em;fill:var(--muted)}.t12{font-size:12px}.t11{font-size:11px;fill:var(--muted)}.v{font-size:12.5px;font-weight:600}
.wire{stroke:var(--hair2);stroke-width:1.2;fill:none}.dash{stroke-dasharray:3 4}
.pk{fill:var(--pk)}.e.pk{opacity:0}.red{fill:var(--red)}.redline{stroke:var(--red);stroke-width:1.5}.green{fill:var(--green)}
.e{animation-timing-function:cubic-bezier(.23,1,.32,1);animation-duration:4.6s;animation-fill-mode:both;animation-iteration-count:1}
.rise{animation:rise .42s cubic-bezier(.23,1,.32,1) both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pa{animation-name:pa}.pb{animation-name:pb}.pc{animation-name:pc}.pd{animation-name:pd}.pe{animation-name:pe}
@keyframes pa{0%{opacity:0;transform:translate(178px,80px)}11%{opacity:1;transform:translate(178px,80px)}20%{transform:translate(204px,141px)}28%{transform:translate(338px,141px)}34%{opacity:1;transform:translate(480px,141px)}37%,100%{opacity:0;transform:translate(480px,141px)}}
@keyframes pb{0%{opacity:0;transform:translate(178px,106px)}17%{opacity:1;transform:translate(178px,106px)}25%{transform:translate(204px,141px)}33%{transform:translate(338px,141px)}39%{opacity:1;transform:translate(480px,141px)}42%,100%{opacity:0;transform:translate(480px,141px)}}
@keyframes pc{0%{opacity:0;transform:translate(178px,132px)}45%{opacity:1;transform:translate(178px,132px)}52%{transform:translate(204px,141px)}59%,72%{transform:translate(236px,255px)}79%{transform:translate(332px,156px)}86%{opacity:1;transform:translate(480px,150px)}89%,100%{opacity:0;transform:translate(480px,150px)}}
@keyframes pd{0%{opacity:0;transform:translate(178px,158px)}50%{opacity:1;transform:translate(178px,158px)}56%{transform:translate(204px,141px)}63%,76%{transform:translate(254px,255px)}83%{transform:translate(332px,156px)}90%{opacity:1;transform:translate(480px,150px)}93%,100%{opacity:0;transform:translate(480px,150px)}}
@keyframes pe{0%{opacity:0;transform:translate(178px,184px)}55%{opacity:1;transform:translate(178px,184px)}61%{transform:translate(204px,141px)}68%,80%{transform:translate(272px,255px)}87%{transform:translate(332px,156px)}95%{opacity:1;transform:translate(480px,150px)}98%,100%{opacity:0;transform:translate(480px,150px)}}
.kill{animation-name:kill}@keyframes kill{0%,41%{opacity:0;transform:scale(.95)}44%,100%{opacity:1;transform:none}}
.down{animation-name:down;opacity:0}@keyframes down{0%,41%{opacity:0}44%,70%{opacity:.6}74%,100%{opacity:0}}
.up{animation-name:up}@keyframes up{0%,72%{opacity:0}76%,100%{opacity:1}}
.kept{animation-name:kept;opacity:0}@keyframes kept{0%,64%{opacity:0}68%,78%{opacity:1}84%,100%{opacity:0}}
.drained{animation-name:drained}@keyframes drained{0%,86%{opacity:0}90%,100%{opacity:1}}
.stored{animation-name:stored}@keyframes stored{0%,90%{opacity:0}95%,100%{opacity:1}}
.verdict{animation-name:verdict}@keyframes verdict{0%,94%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}
.r1{animation-delay:.05s}.r2{animation-delay:.1s}.r3{animation-delay:.15s}.r4{animation-delay:.2s}.r5{animation-delay:.25s}.r6{animation-delay:.3s}.r7{animation-delay:.35s}
@media (prefers-reduced-motion:reduce){.e,.rise{animation:none}}
</style>
