<path d="M885 126 V292" class="line" stroke-width="1.2"/><circle cx="885" cy="292" r="3" class="dot"/>
<path d="M225 248 V292" class="line" stroke-width="1.2"/><circle cx="225" cy="292" r="3" class="dot"/>
<path d="M357 248 V292" class="line" stroke-width="1.2"/><circle cx="357" cy="292" r="3" class="dot"/>
<path d="M489 248 V292" class="line" stroke-width="1.2"/><circle cx="489" cy="292" r="3" class="dot"/>
<rect x="16" y="380" width="928" height="102" rx="12" class="wash"/>
<text x="32" y="414" class="acc mono" font-size="12.5" font-weight="700" text-anchor="start">SessionStart</text>
<text x="32" y="434" class="muted sans" font-size="11.5" font-weight="400" text-anchor="start">new session</text>
<path d="M284 431 H562" class="line" stroke-width="1.2"/>
<rect x="166" y="392" width="118" height="78" rx="8" class="card"/>
<text x="178" y="414" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Profile</text>
<text x="274" y="462" class="faint mono" font-size="10" font-weight="400" text-anchor="end">01</text>
<text x="178" y="434" class="muted sans" font-size="11" font-weight="400" text-anchor="start">top concepts,</text>
<text x="178" y="450" class="muted sans" font-size="11" font-weight="400" text-anchor="start">files, patterns</text>
<rect x="298" y="392" width="118" height="78" rx="8" class="card"/>
<text x="310" y="414" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Hybrid search</text>
<text x="406" y="462" class="faint mono" font-size="10" font-weight="400" text-anchor="end">02</text>
<text x="310" y="434" class="muted sans" font-size="11" font-weight="400" text-anchor="start">BM25 + vector</text>
<text x="310" y="450" class="muted sans" font-size="11" font-weight="400" text-anchor="start">+ graph, RRF k=60</text>
<rect x="430" y="392" width="118" height="78" rx="8" class="card"/>
<text x="442" y="414" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Token budget</text>
<text x="538" y="462" class="faint mono" font-size="10" font-weight="400" text-anchor="end">03</text>
<text x="442" y="434" class="muted sans" font-size="11" font-weight="400" text-anchor="start">2,000 by default</text>
<text x="442" y="450" class="muted sans" font-size="11" font-weight="400" text-anchor="start">max 3 per session</text>
<rect x="562" y="392" width="118" height="78" rx="8" class="card" stroke-dasharray="4 3"/>
<text x="574" y="414" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Inject context</text>
<text x="670" y="462" class="faint mono" font-size="10" font-weight="400" text-anchor="end">04</text>
<text x="574" y="434" class="muted sans" font-size="11" font-weight="400" text-anchor="start">when the host</text>
<text x="574" y="450" class="muted sans" font-size="11" font-weight="400" text-anchor="start">allows it</text>
<path d="M225 350 V392" class="line" stroke-width="1.2"/><circle cx="225" cy="350" r="3" class="dot"/>
<path d="M357 350 V392" class="line" stroke-width="1.2"/><circle cx="357" cy="350" r="3" class="dot"/>
<path d="M680 431 H718" class="line" stroke-width="1.2"/><circle cx="718" cy="431" r="3" class="dot"/>
<text x="730" y="427" class="ink sans" font-size="12.5" font-weight="700" text-anchor="start">agent prompt</text>
<text x="730" y="445" class="acc mono" font-size="10.5" font-weight="400" text-anchor="start">$AGENTMEMORY_INJECT_CONTEXT=true</text>
<text x="16" y="500" class="acc mono" font-size="11" font-weight="400" text-anchor="start">Opt-in switches: AGENTMEMORY_AUTO_COMPRESS · EMBEDDING_PROVIDER · GRAPH_EXTRACTION_ENABLED · AGENTMEMORY_SLOTS + AGENTMEMORY_REFLECT</text>
<text x="16" y="520" class="muted sans" font-size="12" font-weight="400" text-anchor="start">Keyless installs skip every dashed step and all LLM calls: synthetic compression and BM25 recall still work.</text>
<text x="16" y="540" class="muted sans" font-size="12" font-weight="400" text-anchor="start">Secrets are scrubbed on every write path, including imports, mesh sync, summaries and graph nodes.</text>
</svg>
