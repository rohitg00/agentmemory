<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="agentmemory memory pipeline: PostToolUse captures, filters, stores, compresses and indexes each tool call; Stop and SessionEnd summarize; SessionStart builds a profile, runs hybrid search within a token budget and injects context.">

<style>
  .ink{fill:#1A1918}.muted{fill:#5E5852}.faint{fill:#8A837C}.acc{fill:#E8551F}
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .line{stroke:#B9B0A7;fill:none}.aline{stroke:#FF6B35;fill:none}
  .card{fill:#FFFFFF;stroke:#CFC6BD}.wash{fill:#F7F3EF;stroke:#DDD5CD}
  .hot{fill:#FFF1EA;stroke:#FFB896}.hotcard{fill:#FFFFFF;stroke:#FF9A6B}
  .zone{fill:#FF6B35;fill-opacity:.04;stroke:#FF6B35;stroke-opacity:.55}
  .chip{fill:#FFFFFF;stroke:#B9B0A7}.pill{fill:#FF6B35}.pilltx{fill:#FFFFFF}
  .top{fill:#FFFFFF;stroke:#BDB4AB}.left{fill:#EEE8E2;stroke:#BDB4AB}.right{fill:#DED6CE;stroke:#BDB4AB}
  .atop{fill:#FFE6DA;stroke:#F07A45}.aleft{fill:#FF8F5E;stroke:#E8551F}.aright{fill:#E8551F;stroke:#C2410C}
  .tile{fill:#FFFFFF;stroke:#C9C0B7}.atile{fill:#FFFFFF;stroke:#F59A6E}
  .t1{fill:#FF6B35}.t2{fill:#FF9466}.t3{fill:#FFBE9E}.t4{fill:#FFE2D3}
  .t1x{fill:#FFFFFF}.t4x{fill:#7A3A1E}
  .guide{stroke:#CFC6BD;stroke-dasharray:3 4;fill:none}
  .dot{fill:#FF6B35}
  .logo{fill:#2A2725}.logos{stroke:#2A2725;fill:none}.glyph{fill:#E8551F}.glyphs{stroke:#E8551F;fill:none}
  @media (prefers-color-scheme:dark){
    .ink{fill:#F3EFEB}.muted{fill:#B3ABA3}.faint{fill:#8C857E}.acc{fill:#FF8F5E}
    .line{stroke:#5A544E}.card{fill:#1F1D1B;stroke:#45403B}.wash{fill:#191716;stroke:#35312D}
    .hot{fill:#2A1B14;stroke:#7A3A1E}.hotcard{fill:#1F1D1B;stroke:#C2410C}
    .zone{fill-opacity:.06}.chip{fill:#1F1D1B;stroke:#5A544E}
    .top{fill:#262321;stroke:#4A443F}.left{fill:#1C1A18;stroke:#4A443F}.right{fill:#141211;stroke:#4A443F}
    .atop{fill:#3A2117;stroke:#C2410C}.aleft{fill:#C2410C;stroke:#9A3412}.aright{fill:#9A3412;stroke:#7C2D12}
    .tile{fill:#1F1D1B;stroke:#4A443F}.atile{fill:#2A1B14;stroke:#C2410C}
    .t2{fill:#D95A26}.t3{fill:#8F3A17}.t4{fill:#4A2214}.t4x{fill:#FFD9C6}
    .guide{stroke:#45403B}
    .logo{fill:#E9E4DF}.logos{stroke:#E9E4DF}.glyph{fill:#FF8F5E}.glyphs{stroke:#FF8F5E}
  }
</style>
<text x="16" y="24" class="acc sans" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">MEMORY PIPELINE</text>
<text x="944" y="24" class="muted sans" font-size="11.5" font-weight="400" text-anchor="end">dashed = opt-in</text>
<rect x="16" y="36" width="928" height="102" rx="12" class="hot"/>
<text x="32" y="70" class="acc mono" font-size="12.5" font-weight="700" text-anchor="start">PostToolUse</text>
<text x="32" y="90" class="muted sans" font-size="11.5" font-weight="400" text-anchor="start">every tool call</text>
<path d="M284 87 H826" class="line" stroke-width="1.2"/>
<rect x="166" y="48" width="118" height="78" rx="8" class="card"/>
<text x="178" y="70" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Event</text>
<text x="274" y="118" class="faint mono" font-size="10" font-weight="400" text-anchor="end">01</text>
<text x="178" y="90" class="muted sans" font-size="11" font-weight="400" text-anchor="start">stable event ID</text>
<text x="178" y="106" class="muted sans" font-size="11" font-weight="400" text-anchor="start">dedupe on replay</text>
<rect x="298" y="48" width="118" height="78" rx="8" class="card"/>
<text x="310" y="70" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Inbox</text>
<text x="406" y="118" class="faint mono" font-size="10" font-weight="400" text-anchor="end">02</text>
<text x="310" y="90" class="muted sans" font-size="11" font-weight="400" text-anchor="start">durable capture</text>
<text x="310" y="106" class="muted sans" font-size="11" font-weight="400" text-anchor="start">spool if offline</text>
<rect x="430" y="48" width="118" height="78" rx="8" class="hotcard"/>
<text x="442" y="70" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Privacy filter</text>
<text x="538" y="118" class="faint mono" font-size="10" font-weight="400" text-anchor="end">03</text>
<text x="442" y="90" class="muted sans" font-size="11" font-weight="400" text-anchor="start">keys, tokens, URLs</text>
<text x="442" y="106" class="muted sans" font-size="11" font-weight="400" text-anchor="start">&lt;private&gt; tags</text>
<rect x="562" y="48" width="118" height="78" rx="8" class="card"/>
<text x="574" y="70" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Observation</text>
<text x="670" y="118" class="faint mono" font-size="10" font-weight="400" text-anchor="end">04</text>
<text x="574" y="90" class="muted sans" font-size="11" font-weight="400" text-anchor="start">raw, per session</text>
<text x="574" y="106" class="muted sans" font-size="11" font-weight="400" text-anchor="start">provenance stamp</text>
<rect x="694" y="48" width="118" height="78" rx="8" class="card"/>
<text x="706" y="70" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Compress</text>
<text x="802" y="118" class="faint mono" font-size="10" font-weight="400" text-anchor="end">05</text>
<text x="706" y="90" class="muted sans" font-size="11" font-weight="400" text-anchor="start">synthetic default</text>
<text x="706" y="106" class="muted sans" font-size="11" font-weight="400" text-anchor="start">LLM opt-in</text>
<rect x="826" y="48" width="118" height="78" rx="8" class="card"/>
<text x="838" y="70" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Index</text>
<text x="934" y="118" class="faint mono" font-size="10" font-weight="400" text-anchor="end">06</text>
<text x="838" y="90" class="muted sans" font-size="11" font-weight="400" text-anchor="start">BM25 always</text>
<text x="838" y="106" class="muted sans" font-size="11" font-weight="400" text-anchor="start">vectors opt-in</text>
<rect x="16" y="158" width="928" height="102" rx="12" class="wash"/>
<text x="32" y="192" class="acc mono" font-size="12.5" font-weight="700" text-anchor="start">Stop · SessionEnd</text>
<text x="32" y="212" class="muted sans" font-size="11.5" font-weight="400" text-anchor="start">end of turn or session</text>
<path d="M284 209 H430" class="line" stroke-width="1.2"/>
<rect x="166" y="170" width="118" height="78" rx="8" class="card"/>
<text x="178" y="192" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Summary</text>
<text x="274" y="240" class="faint mono" font-size="10" font-weight="400" text-anchor="end">01</text>
<text x="178" y="212" class="muted sans" font-size="11" font-weight="400" text-anchor="start">incremental, only</text>
<text x="178" y="228" class="muted sans" font-size="11" font-weight="400" text-anchor="start">new observations</text>
<rect x="298" y="170" width="118" height="78" rx="8" class="card" stroke-dasharray="4 3"/>
<text x="310" y="192" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Graph</text>
<text x="406" y="240" class="faint mono" font-size="10" font-weight="400" text-anchor="end">02</text>
<text x="310" y="212" class="muted sans" font-size="11" font-weight="400" text-anchor="start">entities and</text>
<text x="310" y="228" class="muted sans" font-size="11" font-weight="400" text-anchor="start">relations</text>
<rect x="430" y="170" width="118" height="78" rx="8" class="card" stroke-dasharray="4 3"/>
<text x="442" y="192" class="ink sans" font-size="13" font-weight="700" text-anchor="start">Reflection</text>
<text x="538" y="240" class="faint mono" font-size="10" font-weight="400" text-anchor="end">03</text>
<text x="442" y="212" class="muted sans" font-size="11" font-weight="400" text-anchor="start">updates memory</text>
<text x="442" y="228" class="muted sans" font-size="11" font-weight="400" text-anchor="start">slots</text>
<rect x="16" y="292" width="928" height="58" rx="10" class="hotcard" stroke-width="1.4"/>
<svg x="32.0" y="305" width="15.0" height="15" viewBox="0 0 24 24"><path d="M4 6c0-1.66 3.58-3 8-3s8 1.34 8 3v12c0 1.66-3.58 3-8 3s-8-1.34-8-3Z M4 6c0 1.66 3.58 3 8 3s8-1.34 8-3 M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3" class="glyphs" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
<text x="52" y="317" class="acc sans" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">STATE STORE</text>
<text x="32" y="335" class="muted sans" font-size="11.5" font-weight="400" text-anchor="start">file store by default</text>
<rect x="166" y="307" width="104" height="28" rx="6" class="t1"/>
<text x="218" y="325" class="t1x sans" font-size="11.5" font-weight="700" text-anchor="middle">Working</text>
<rect x="278" y="307" width="104" height="28" rx="6" class="t2"/>
<text x="330" y="325" class="t1x sans" font-size="11.5" font-weight="700" text-anchor="middle">Episodic</text>
<rect x="390" y="307" width="104" height="28" rx="6" class="t3"/>
<text x="442" y="325" class="t4x sans" font-size="11.5" font-weight="700" text-anchor="middle">Semantic</text>
<rect x="502" y="307" width="104" height="28" rx="6" class="t4"/>
<text x="554" y="325" class="t4x sans" font-size="11.5" font-weight="700" text-anchor="middle">Procedural</text>
<text x="928" y="317" class="ink sans" font-size="11.5" font-weight="600" text-anchor="end">decay · TTL · contradiction checks</text>
<text x="928" y="335" class="muted sans" font-size="11.5" font-weight="400" text-anchor="end">git snapshots · version chains</text>
