<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" font-family="monospace, 'Courier New'">

  <!-- Background -->
  <rect width="960" height="740" fill="#fafafa"/>

  <!-- ── ZONE: CLAUDE CODE RUNTIME ── -->
  <rect x="20" y="50" width="210" height="560" rx="6" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="125" y="44" text-anchor="middle" font-size="10" font-weight="bold" fill="#444" letter-spacing="1.5">CLAUDE CODE RUNTIME</text>

  <!-- Hooks & Middleware -->
  <rect x="36" y="78" width="178" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="125" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Hooks &amp; Middleware</text>
  <text x="125" y="116" text-anchor="middle" font-size="9" fill="#666">PostToolUse · PreToolUse · Stop</text>

  <!-- System Prompt -->
  <rect x="36" y="162" width="178" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="125" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">System Prompt</text>
  <text x="125" y="200" text-anchor="middle" font-size="9" fill="#666">memory fragments injected here</text>

  <!-- MCP Tools / REST -->
  <rect x="36" y="248" width="178" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="125" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">MCP Tools / REST API</text>
  <text x="125" y="286" text-anchor="middle" font-size="9" fill="#666">43 tools · 103 endpoints</text>

  <!-- Memory Viewer -->
  <rect x="36" y="334" width="178" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="125" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Memory Viewer</text>
  <text x="125" y="372" text-anchor="middle" font-size="9" fill="#666">:3113 · HMAC auth · CSP</text>

  <!-- ── ZONE: AGENTMEMORY WORKER ── -->
  <rect x="262" y="50" width="430" height="560" rx="6" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="477" y="44" text-anchor="middle" font-size="10" font-weight="bold" fill="#444" letter-spacing="1.5">AGENTMEMORY WORKER  /  iii-engine</text>

  <!-- mem::observe -->
  <rect x="278" y="78" width="150" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="353" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">mem::observe</text>
  <text x="353" y="116" text-anchor="middle" font-size="9" fill="#666">compress · title · importance</text>

  <!-- mem::context (accent yellow) -->
  <rect x="278" y="162" width="150" height="52" rx="5" fill="#fffde7" stroke="#222" stroke-width="1.2"/>
  <text x="353" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">mem::context</text>
  <text x="353" y="200" text-anchor="middle" font-size="9" fill="#666">retrieve · shape · inject</text>

  <!-- mem::compress -->
  <rect x="278" y="248" width="150" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="353" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">mem::compress</text>
  <text x="353" y="286" text-anchor="middle" font-size="9" fill="#666">session window · rolling summary</text>

  <!-- mem::retention -->
  <rect x="278" y="334" width="150" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="353" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">mem::retention</text>
  <text x="353" y="372" text-anchor="middle" font-size="9" fill="#666">auto-forget · importance decay</text>

  <!-- mem::smart-search (accent blue) -->
  <rect x="278" y="420" width="150" height="52" rx="5" fill="#e3f2fd" stroke="#222" stroke-width="1.2"/>
  <text x="353" y="442" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">mem::smart-search</text>
  <text x="353" y="458" text-anchor="middle" font-size="9" fill="#666">BM25 + vector + graph hybrid</text>

  <!-- mem::graph -->
  <rect x="454" y="78" width="220" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="564" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">mem::graph / temporal-graph</text>
  <text x="564" y="116" text-anchor="middle" font-size="9" fill="#666">concept linking · time-decay edges</text>

  <!-- Orchestration Layer -->
  <rect x="454" y="162" width="220" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="564" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Orchestration Layer</text>
  <text x="564" y="200" text-anchor="middle" font-size="9" fill="#666">33 functions · keyed mutex · retries</text>

  <!-- Privacy / Governance -->
  <rect x="454" y="248" width="220" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="564" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Privacy / Governance</text>
  <text x="564" y="286" text-anchor="middle" font-size="9" fill="#666">redact · consent · retention policy</text>

  <!-- Health / OTel -->
  <rect x="454" y="334" width="220" height="52" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="564" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Health / OTel</text>
  <text x="564" y="372" text-anchor="middle" font-size="9" fill="#666">spans · metrics · mem::health</text>

  <!-- ── ZONE: STORAGE LAYER ── -->
  <rect x="726" y="50" width="214" height="560" rx="6" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="833" y="44" text-anchor="middle" font-size="10" font-weight="bold" fill="#444" letter-spacing="1.5">STORAGE LAYER</text>

  <!-- StateKV cylinder -->
  <ellipse cx="833" cy="110" rx="76" ry="14" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <rect x="757" y="110" width="152" height="52" fill="#fff" stroke="#222" stroke-width="1.2" stroke-top="none"/>
  <line x1="757" y1="110" x2="757" y2="162" stroke="#222" stroke-width="1.2"/>
  <line x1="909" y1="110" x2="909" y2="162" stroke="#222" stroke-width="1.2"/>
  <ellipse cx="833" cy="162" rx="76" ry="14" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="833" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">StateKV</text>
  <text x="833" y="150" text-anchor="middle" font-size="9" fill="#666">sessions · obs · memories</text>

  <!-- BM25 Index cylinder -->
  <ellipse cx="833" cy="220" rx="76" ry="14" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <rect x="757" y="220" width="152" height="52" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <line x1="757" y1="220" x2="757" y2="272" stroke="#222" stroke-width="1.2"/>
  <line x1="909" y1="220" x2="909" y2="272" stroke="#222" stroke-width="1.2"/>
  <ellipse cx="833" cy="272" rx="76" ry="14" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="833" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">BM25 Index</text>
  <text x="833" y="258" text-anchor="middle" font-size="9" fill="#666">full-text · token frequency</text>

  <!-- Vector Index cylinder -->
  <ellipse cx="833" cy="326" rx="76" ry="14" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <rect x="757" y="326" width="152" height="52" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <line x1="757" y1="326" x2="757" y2="378" stroke="#222" stroke-width="1.2"/>
  <line x1="909" y1="326" x2="909" y2="378" stroke="#222" stroke-width="1.2"/>
  <ellipse cx="833" cy="378" rx="76" ry="14" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="833" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Vector Index</text>
  <text x="833" y="364" text-anchor="middle" font-size="9" fill="#666">6 embedding providers</text>

  <!-- Knowledge Graph cylinder -->
  <ellipse cx="833" cy="432" rx="76" ry="14" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <rect x="757" y="432" width="152" height="52" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <line x1="757" y1="432" x2="757" y2="484" stroke="#222" stroke-width="1.2"/>
  <line x1="909" y1="432" x2="909" y2="484" stroke="#222" stroke-width="1.2"/>
  <ellipse cx="833" cy="484" rx="76" ry="14" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="833" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Knowledge Graph</text>
  <text x="833" y="470" text-anchor="middle" font-size="9" fill="#666">concepts · files · sessions</text>

  <!-- ── ARROWS ── -->
  <!-- hooks -> observe -->
  <line x1="214" y1="104" x2="278" y2="104" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="246" y="99" text-anchor="middle" font-size="8" fill="#555">fire PostToolUse</text>

  <!-- sysprompt -> ctx -->
  <line x1="214" y1="188" x2="278" y2="188" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="246" y="183" text-anchor="middle" font-size="8" fill="#555">inject fragments</text>

  <!-- mcp_tools -> orchestration -->
  <line x1="214" y1="274" x2="454" y2="188" stroke="#333" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4 2"/>
  <text x="334" y="222" text-anchor="middle" font-size="8" fill="#555">tool calls</text>

  <!-- viewer -> statekv (read) -->
  <line x1="214" y1="360" x2="726" y2="136" stroke="#aaa" stroke-width="1" marker-end="url(#arr_gray)" stroke-dasharray="3 3"/>
  <text x="470" y="290" text-anchor="middle" font-size="8" fill="#aaa">read-only browse</text>

  <!-- orchestration -> statekv -->
  <line x1="674" y1="188" x2="726" y2="136" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="710" y="158" text-anchor="middle" font-size="8" fill="#555">read/write</text>

  <!-- smart-search -> bm25 -->
  <line x1="428" y1="446" x2="726" y2="246" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="597" y="380" text-anchor="middle" font-size="8" fill="#555">BM25 query</text>

  <!-- smart-search -> vector -->
  <line x1="428" y1="458" x2="726" y2="352" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="610" y="440" text-anchor="middle" font-size="8" fill="#555">embed query</text>

  <!-- graph -> kgraph -->
  <line x1="674" y1="104" x2="726" y2="458" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="720" y="280" text-anchor="middle" font-size="8" fill="#555">graph walk</text>

  <!-- ── BOTTOM ANNOTATION BAR ── -->
  <rect x="20" y="640" width="920" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="30" y="661" font-size="10" font-weight="bold" fill="#333" letter-spacing="1">SIGNAL</text>
  <text x="480" y="661" text-anchor="middle" font-size="9" fill="#777" font-style="italic">more signal = better next-turn reasoning</text>
  <text x="910" y="661" text-anchor="end" font-size="10" font-weight="bold" fill="#aaa" letter-spacing="1">NOISE</text>

  <!-- THE BITTER LESSON callout -->
  <rect x="540" y="498" width="260" height="28" rx="4" fill="#f8f8f8" stroke="#bbb" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="670" y="516" text-anchor="middle" font-size="9" font-style="italic" fill="#666">THE BITTER LESSON: memory beats prompting</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#aaa"/>
    </marker>
  </defs>

</svg>
